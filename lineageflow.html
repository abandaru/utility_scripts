<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LineageFlow — OpenLineage Visualizer</title>
<meta name="description" content="Visualize OpenLineage event files as an interactive dataset and job lineage graph with column-level lineage. Single-file, no install.">
<style>
/* Brand palette — Purple #2E1A47, White #FFF, Dusk #7C6992, Sky Blue #B0E0E2,
   Dark Grey #787878, Charcoal #34363B, Dawn #AFABC9, Light Gray #C9C9C9,
   Mild Gray #A8A8A8. `:root` = dark theme; [data-theme="light"] = light theme.
   Semantic red/green kept (not in the brand set) but tuned to the palette. */
/* Indigo SaaS palette. :root = dark theme; [data-theme="light"] = light (default).
   Topbar + status bar keep a fixed dark-navy chrome in both themes (per design). */
/* Dark theme — neutral slate rather than blue-navy, with a measured elevation
   ramp (bg0 canvas -> bg4 highest) and restrained chroma. Every text pair
   clears WCAG AA on the surface it actually sits on; --t3 in particular is
   set from the darkest surface it appears on (--bg2 inputs), not the panel. */
:root{--bg0:#0d1017;--bg1:#141821;--bg2:#1b202b;--bg3:#242a37;--bg4:#2e3542;--hover:#38404f;--border:#343c4d;--border2:#20262f;--t0:#e9edf5;--t1:#c3cad8;--t2:#99a2b3;--t3:#7e8798;--acc:#8590e8;--acc2:#a7b0f0;--accbg:rgba(133,144,232,0.15);--blue:#5f9df2;--purple:#a08cf0;--orange:#e8ab3f;--red:#ef7076;--cyan:#3cc2d8;--pink:#e87bae;--green:#3fbf94;--node-bg:#161b25;--modal-overlay:rgba(4,6,10,0.72);--edge-color:#39424f;--canvas-dot:#1c222d;--topbar-bg:#2e1a47;--topbar-fg:#f1eef8;--topbar-border:#43305f;--topbar-hl:#b0e0e2;--shadow-sm:0 1px 2px rgba(0,0,0,0.4);--shadow-md:0 16px 40px rgba(0,0,0,0.55)}
[data-theme="light"]{--bg0:#f6f8fb;--bg1:#ffffff;--bg2:#f1f3f8;--bg3:#e6e9f1;--bg4:#dbe0ea;--hover:#e2e6ef;--border:#e4e7ee;--border2:#eef1f6;--t0:#1f2430;--t1:#4b5162;--t2:#6b7280;--t3:#9aa1ae;--acc:#2E1A47;--acc2:#4338ca;--accbg:rgba(79,70,229,0.1);--blue:#3b82f6;--purple:#8b5cf6;--orange:#f59e0b;--red:#ef4444;--cyan:#06b6d4;--pink:#ec4899;--green:#10b981;--node-bg:#ffffff;--modal-overlay:rgba(17,24,39,0.28);--edge-color:#c7cdd8;--canvas-dot:#e7eaf0;--topbar-bg:#2e1a47;--topbar-fg:#f1eef8;--topbar-border:#43305f;--topbar-hl:#b0e0e2;--shadow-sm:0 1px 2px rgba(16,24,40,0.06);--shadow-md:0 10px 30px rgba(16,24,40,0.10)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif,'Apple Color Emoji','Segoe UI Emoji','Segoe UI Symbol','Noto Color Emoji';background:var(--bg0);color:var(--t0);height:100vh;height:100dvh;overflow:hidden;transition:background 0.25s,color 0.25s}
/* Keep the monospace identity on canvas data + code, per design. */
.node-label,.node-sub,.field-txt,.field-type,.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.modal pre,.box pre,pre,code{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
#root{height:100%}
.app{display:flex;flex-direction:column;height:100%}
.topbar{min-height:56px;background:var(--topbar-bg);border-bottom:1px solid var(--topbar-border);display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0;z-index:20;transition:background 0.25s}
.topbar .logo-text{color:#fff}
/* Topbar buttons — ghost on the dark navy chrome; the indigo primary pops. */
.topbar .btn{background:transparent;border-color:rgba(255,255,255,0.14);color:var(--topbar-fg)}
.topbar .btn:hover{background:rgba(176,224,226,0.14);border-color:var(--topbar-hl);color:var(--topbar-hl)}
.topbar .theme-toggle{background:transparent;border-color:rgba(255,255,255,0.14);color:var(--topbar-fg)}
.topbar .theme-toggle:hover{background:rgba(176,224,226,0.14);border-color:var(--topbar-hl);color:var(--topbar-hl)}
.topbar .btn.primary{background:var(--topbar-hl);border-color:var(--topbar-hl);color:#1a2340}
.topbar .btn.primary:hover{background:#c4ebed;border-color:#c4ebed;color:#1a2340}
.topbar .tb-sep{background:rgba(255,255,255,0.12)}
.topbar .search{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.14)}
.topbar .search input{color:#fff}
.topbar .search input::placeholder{color:rgba(232,235,245,0.5)}
.topbar .btn.primary{background:var(--acc);border-color:var(--acc);color:var(--bg0)}
.topbar .btn.primary:hover{background:var(--acc2);border-color:var(--acc2);color:var(--bg0)}
.tb-group{display:flex;align-items:center;gap:6px;flex-shrink:0}
.tb-sep{width:1px;height:24px;background:var(--border);flex-shrink:0;margin:0 2px}
.logo{width:30px;height:30px;background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo svg{width:30px;height:30px;display:block}
.brand-home{cursor:pointer;border-radius:8px;padding:2px 6px;margin:-2px -2px -2px -6px;transition:background 0.15s,opacity 0.15s}
.brand-home:hover{background:rgba(176,224,226,0.12)}
.brand-home:active{opacity:0.8}
.brand-home:focus-visible{outline:2px solid var(--topbar-hl);outline-offset:2px}
.logo-text{font-size:14px;font-weight:700;color:var(--acc);white-space:nowrap}
/* Button system — consistent 3-tier hierarchy across the app:
   .btn (secondary, neutral surface), .btn.primary (solid accent),
   .theme-toggle (icon), and .toggle (segmented). Hovers stay neutral;
   the accent is reserved for primary and selected states. */
.btn{padding:6px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--t1);font-family:inherit;font-size:11px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;min-height:32px;transition:background 0.15s,border-color 0.15s,color 0.15s,box-shadow 0.15s}
.btn:hover{background:var(--bg3);border-color:var(--t3);color:var(--t0)}
.btn:active{transform:translateY(0.5px)}
.btn.primary{background:var(--acc);color:var(--bg0);border-color:var(--acc);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,0.14)}
.btn.primary:hover{background:var(--acc2);border-color:var(--acc2);color:var(--bg0)}
.btn.primary:active{transform:translateY(0.5px)}
.btn:disabled{opacity:0.45;cursor:not-allowed;box-shadow:none;transform:none}
.btn:disabled:hover{background:var(--bg2);border-color:var(--border);color:var(--t1)}
.btn.primary:disabled:hover{background:var(--acc);border-color:var(--acc)}
.btn:focus-visible,.theme-toggle:focus-visible,.tab:focus-visible,.toggle span:focus-visible,.zoom-ctl button:focus-visible,.grpmenu-btn:focus-visible,.sheet-chip:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.theme-toggle{width:32px;height:32px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--t2);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.15s,border-color 0.15s,color 0.15s;flex-shrink:0}
.theme-toggle:hover{background:var(--bg3);border-color:var(--t3);color:var(--t0)}
.theme-toggle:active{transform:translateY(0.5px)}
.search{flex:1 1 auto;min-width:110px;display:flex;align-items:center;gap:8px;background:var(--bg0);border:1px solid var(--border);border-radius:6px;padding:0 10px;transition:background 0.25s,border-color 0.25s}
.search input{min-width:0}
.search input{flex:1;background:transparent;border:0;outline:0;color:var(--t0);font-family:inherit;font-size:11px;padding:7px 0}
.search input::placeholder{color:var(--t3)}
.search-nav{display:flex;align-items:center;gap:2px;flex-shrink:0;padding-left:4px;border-left:1px solid var(--border)}
.sn-count{font-size:10px;color:var(--t2);min-width:26px;text-align:center;font-variant-numeric:tabular-nums}
.sn-count.none{color:var(--red)}
.sn-btn{width:20px;height:20px;background:transparent;border:0;border-radius:4px;color:var(--t2);cursor:pointer;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;transition:background 0.12s,color 0.12s}
.sn-btn:hover{background:var(--bg2);color:var(--acc)}
.sn-btn:disabled{opacity:0.35;cursor:not-allowed}
.chips{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--t2);white-space:nowrap;flex-shrink:0}
.chip b{color:var(--t0);font-weight:600}
.dot{color:var(--border)}
.body{flex:1;display:flex;min-height:0}
.rail{width:242px;background:var(--bg1);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;transition:width 0.2s ease,background 0.25s}
.rail.collapsed{width:0;min-width:0;border-right:0;overflow:hidden}
.panel.collapsed{width:0;min-width:0;border-left:0;overflow:hidden}
/* Collapsed left rail becomes a slim icon strip (not width:0) so controls stay
   discoverable while the canvas keeps the reclaimed width. Click any glyph to
   re-open the full rail. */
.rail-icons{width:48px;background:var(--bg1);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;flex-shrink:0;transition:background 0.25s}
.rail-icons button{position:relative;width:34px;height:34px;background:transparent;border:1px solid transparent;border-radius:8px;color:var(--t2);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;transition:background 0.15s,color 0.15s,border-color 0.15s}
.rail-icons button:hover{background:var(--accbg);color:var(--acc);border-color:var(--acc)}
.rail-icons .ri-issues:hover{background:rgba(248,113,113,0.14);color:var(--red);border-color:var(--red)}
.rail-icons button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.rail-icons .ri-sep{width:22px;height:1px;background:var(--border);margin:4px 0;flex-shrink:0}
.rail-icons .ri-issues{color:var(--red)}
.rail-icons .ri-issues .ri-dot{position:absolute;transform:translate(9px,-9px);background:var(--red);color:#fff;font-size:8px;font-weight:700;border-radius:8px;padding:0 3px;line-height:1.4}
/* Persistent Issues indicator in the topbar — visible even when the rail is
   collapsed, so validation problems are never hidden. */
.tb-issues{background:rgba(232,106,106,0.12)!important;border-color:var(--red)!important;color:var(--red)!important;font-weight:600}
.tb-issues:hover{background:rgba(232,106,106,0.2)!important;border-color:var(--red)!important;color:var(--red)!important}
.edge-toggle{position:absolute;top:14px;width:22px;height:44px;background:var(--bg1);border:1px solid var(--border);color:var(--t2);cursor:pointer;z-index:16;display:flex;align-items:center;justify-content:center;font-size:15px;padding:0}
.edge-toggle:hover{color:var(--acc);border-color:var(--acc)}
.edge-toggle.left{left:0;border-left:0;border-radius:0 8px 8px 0}
.edge-toggle.right{right:0;border-right:0;border-radius:8px 0 0 8px}
.rail-sec{padding:12px;border-bottom:1px solid var(--border)}
.rail-title{font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--t3);margin-bottom:8px}
/* Rail accordion — collapsible control cards. Only the cards in use stay open,
   so the rail stays short instead of stacking every section at full height. */
.acc{background:var(--bg1);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin:8px;flex-shrink:0}
.acc-head{display:flex;align-items:center;gap:9px;width:100%;padding:10px 11px;background:transparent;border:0;cursor:pointer;font-family:inherit;color:var(--t0);text-align:left;transition:background 0.15s}
.acc-head:hover{background:var(--bg2)}
.acc-head:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.acc-ico{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;background:var(--accbg);color:var(--acc);flex-shrink:0}
.acc-lbl{flex:1;min-width:0;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-meta{font-size:9px;color:var(--t3);white-space:nowrap;max-width:62px;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.acc-chev{color:var(--t3);font-size:10px;transition:transform 0.18s ease;flex-shrink:0}
.acc.open .acc-chev{transform:rotate(180deg)}
.acc-body{display:none;padding:2px 11px 12px;border-top:1px solid var(--border)}
.acc.open .acc-body{display:block}
.fld{margin-top:9px}
.fld>label{display:block;font-size:9px;color:var(--t3);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.4px}
.chk-row{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:11px;color:var(--t0);cursor:pointer;user-select:none}
.chk-row input{width:15px;height:15px;accent-color:var(--acc);cursor:pointer;margin:0;flex-shrink:0}
.fsel{width:100%;padding:6px 8px;background:var(--bg0);border:1px solid var(--border);border-radius:7px;color:var(--t0);font-family:inherit;font-size:11px;cursor:pointer;outline:none}
.fsel:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg)}
/* Multi-select attribute filter: header + All/None + a bounded checkbox list.
   The list is capped and scrolls so four facets cannot push the rail long. */
.fhead{display:flex;align-items:baseline;gap:6px}
.fhead>label{display:block;font-size:9px;color:var(--t3);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.4px}
.fhead .fh-sum{margin-left:auto;font-size:9px;color:var(--t3);white-space:nowrap}
.fbtns{display:flex;gap:5px;margin-bottom:5px}
.fbtn{flex:1;justify-content:center;padding:3px 6px;min-height:0;font-size:9.5px;letter-spacing:0.3px}
.fbtn:disabled{opacity:0.4;cursor:not-allowed}
.fmulti{border:1px solid var(--border);border-radius:7px;background:var(--bg0);max-height:132px;overflow-y:auto}
.fmulti>label{display:flex;align-items:center;gap:8px;padding:5px 8px;font-size:11px;color:var(--t0);cursor:pointer;user-select:none}
.fmulti>label:hover{background:var(--bg2)}
.fmulti input{width:14px;height:14px;accent-color:var(--acc);cursor:pointer;margin:0;flex-shrink:0}
.fmulti input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.fm-lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fm-empty{padding:8px;font-size:10px;color:var(--t3)}
/* Lineage level ladder — coarse at the top, fine at the bottom, with the node
   count each level would draw so the cost of going finer is visible up front. */
.lvl-ladder{display:flex;flex-direction:column;gap:2px;background:var(--bg0);border:1px solid var(--border);border-radius:8px;padding:3px}
.lvl{display:flex;align-items:center;gap:8px;width:100%;padding:6px 9px;border:0;border-radius:6px;background:transparent;color:var(--t1);font-family:inherit;font-size:11px;cursor:pointer;text-align:left;transition:background 0.15s,color 0.15s}
.lvl:hover{background:var(--bg2);color:var(--t0)}
.lvl.on{background:var(--accbg);color:var(--acc);font-weight:600;box-shadow:inset 2px 0 0 var(--acc)}
.lvl:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.lvl-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lvl-n{font-size:9px;color:var(--t3);font-variant-numeric:tabular-nums;flex-shrink:0}
.lvl.on .lvl-n{color:var(--acc)}
.savebtn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:10px;padding:7px;border:1px dashed var(--acc);border-radius:8px;background:var(--accbg);color:var(--acc);font-size:11px;font-weight:600;font-family:inherit;cursor:pointer;transition:background 0.15s}
.savebtn:hover{background:var(--bg2)}
.ns-row{display:flex;align-items:center;gap:8px;padding:6px;border-radius:6px;cursor:pointer;font-size:11px;color:var(--t1);user-select:none;border:1px solid transparent;margin-bottom:3px}
.ns-row:hover{background:var(--bg2);border-color:var(--border)}
.ns-row.off{opacity:0.45}
.ns-check{width:14px;height:14px;accent-color:var(--acc);cursor:pointer;flex-shrink:0;margin:0}
.ns-info{display:flex;flex-direction:column;min-width:0}
.ns-name{color:var(--t0);font-size:11px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ns-sub{color:var(--t3);font-size:9px;line-height:1.3}
.sw{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.ns-count{margin-left:auto;color:var(--t3);font-size:10px}
.toggle{display:flex;gap:2px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:2px}
.toggle span{flex:1;text-align:center;padding:5px 6px;border-radius:4px;font-size:11px;font-weight:500;color:var(--t2);cursor:pointer;white-space:nowrap;transition:background 0.15s,color 0.15s}
.toggle span:hover{color:var(--t0)}
.toggle span.on{background:#2e1a47;color:#fff}
.toggle.four{display:grid;grid-template-columns:1fr 1fr}
.toggle.four span{padding:5px 4px}
input[type=range]{accent-color:#2e1a47;height:4px;cursor:pointer}
.legend-row{display:flex;align-items:center;gap:8px;color:var(--t2);font-size:11px;margin-bottom:6px}
.hex-glyph{width:16px;height:14px;background:var(--purple);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);flex-shrink:0}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stat-card{background:var(--node-bg,var(--bg2));border:1px solid var(--border);border-radius:6px;padding:8px 6px;text-align:center;transition:border-color 0.15s}
.flabel{display:block;font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--t3);margin-bottom:5px}
.finput{width:100%;padding:8px 10px;background:var(--bg0);border:1px solid var(--border);border-radius:6px;color:var(--t0);font-family:inherit;font-size:12px;outline:none}
.finput:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg)}
select.finput{cursor:pointer}
.stat-card.link{cursor:pointer}
.stat-card.link:hover{border-color:var(--acc)}
.stat-card.link .stat-num{text-decoration:underline;text-decoration-color:var(--border);text-underline-offset:2px}
.stat-card.link:hover .stat-num{text-decoration-color:var(--acc)}
.stat-card.alert{border-color:var(--red)}
.stat-num{font-size:18px;font-weight:700;line-height:1.1}
.stat-label{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:0.4px;margin-top:2px}
/* Overview rendered as a metrics list (icon chip + label + count) — SaaS style. */
.ov-list{display:flex;flex-direction:column;gap:2px}
.ov-row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;border:1px solid transparent;transition:background 0.15s,border-color 0.15s}
.ov-row.link{cursor:pointer}
.ov-row.link:hover{background:var(--bg2);border-color:var(--border)}
.ov-ico{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.ov-label{flex:1;font-size:12px;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov-count{font-size:15px;font-weight:700;color:var(--t0);font-variant-numeric:tabular-nums;letter-spacing:-0.01em}
.ov-row.alert{background:rgba(239,68,68,0.06)}
/* Softer, lifted surfaces to match the mockup. */
.rail{box-shadow:2px 0 12px rgba(16,24,40,0.03)}
.panel{box-shadow:-2px 0 12px rgba(16,24,40,0.03)}
.btn{border-radius:8px}
.box,.list-item,.stat-card,.finput,.sys-pill{border-radius:9px}
.crumb{border-radius:10px;box-shadow:var(--shadow-sm)}
.zoom-ctl button,.theme-toggle{border-radius:8px}
/* Bottom status bar — dark chrome, key counts + scan status. */
.statusbar{height:34px;flex-shrink:0;background:var(--topbar-bg);border-top:1px solid var(--topbar-border);color:var(--topbar-fg);display:flex;align-items:center;gap:14px;padding:0 16px;font-size:11px;z-index:20}
.statusbar .sb-item{display:flex;align-items:center;gap:6px;color:rgba(232,235,245,0.72);font-variant-numeric:tabular-nums;white-space:nowrap}
.statusbar .sb-item b{color:#fff;font-weight:600}
.statusbar .sb-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
.statusbar .sb-sep{width:1px;height:16px;background:rgba(255,255,255,0.12);flex-shrink:0}
.statusbar .sb-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.statusbar .sb-trust{color:rgba(255,255,255,0.72);cursor:help;border-bottom:1px dotted rgba(255,255,255,0.35)}
.statusbar .sb-trust:hover,.statusbar .sb-trust:focus-visible{color:#fff}
.statusbar .sb-trust:focus-visible{outline:2px solid var(--topbar-hl);outline-offset:2px}
.canvas-wrap{flex:1;position:relative;min-width:0;background:var(--bg0);background-image:radial-gradient(var(--canvas-dot) 1px,transparent 1px);background-size:20px 20px;transition:background-color 0.25s}
.canvas-wrap svg{width:100%;height:100%;display:block}

<body>
<div id="root"></div>

<script>
/* LINEAGE_ENGINE_START — pure logic, no DOM/React/D3. Testable in Node. */
(
  function(){
  // Namespace identity colours. One palette serves both themes, so each hue is
  // mid-tone: >=4.2 contrast on the dark canvas AND on the light one. The
  // previous set was tuned for dark only and fell to ~1.1 on light.
  var NS_COLORS=['#3c79be','#2e8473','#9d6f2a','#8e65c3','#34819d','#bc5287','#697a91','#378644','#c25847'];
  var JOB_COLOR='#a78bfa';

  // §3 Graph data model — derive the storage/compute System (platform) a dataset
  // lives on from its namespace. OpenLineage namespaces are typically scheme URIs
  // (snowflake://, s3://, postgres://host:port). Enables cross-platform lineage.
  var SYSTEM_MAP={snowflake:'Snowflake',bigquery:'BigQuery',postgres:'Postgres',postgresql:'Postgres',mysql:'MySQL',mariadb:'MySQL',redshift:'Redshift',s3:'S3',s3a:'S3',gs:'GCS',gcs:'GCS',abfss:'ADLS',abfs:'ADLS',wasbs:'ADLS',kafka:'Kafka',file:'File',hdfs:'HDFS',mssql:'SQLServer',sqlserver:'SQLServer',oracle:'Oracle',trino:'Trino',presto:'Presto',hive:'Hive',databricks:'Databricks',athena:'Athena',dbfs:'DBFS',clickhouse:'ClickHouse',cassandra:'Cassandra',mongodb:'MongoDB',elasticsearch:'Elasticsearch'};
  var SYSTEM_ICONS={Snowflake:'❄',BigQuery:'▤',Postgres:'🐘',MySQL:'🐬',Redshift:'▧',S3:'🪣',GCS:'🪣',ADLS:'🪣',Kafka:'✉',File:'📄',HDFS:'🗄',SQLServer:'🗄',Oracle:'🗄',Trino:'◆',Presto:'◆',Hive:'🐝',Databricks:'▦',Athena:'◈',DBFS:'🗄',ClickHouse:'◉',Cassandra:'◎',MongoDB:'🌿',Elasticsearch:'🔎'};
  function systemOf(ns){
    ns=ns||'';
    var m=ns.match(/^([a-z0-9+]+):\/\//i);
    var scheme=m?m[1].toLowerCase():'';
    if(scheme)return SYSTEM_MAP[scheme]||(scheme.charAt(0).toUpperCase()+scheme.slice(1));
    var seg=ns.split(/[:.\/@]/)[0];// no scheme -> first segment as platform grouping
    return seg?(SYSTEM_MAP[seg.toLowerCase()]||(seg.charAt(0).toUpperCase()+seg.slice(1))):'unknown';
  }
  function systemIcon(sys){return SYSTEM_ICONS[sys]||'▢';}

  // §8 Column lineage — normalize OpenLineage transformation type/subtype/masking
  // into a semantic class the UI can style distinctly. OL uses type DIRECT|INDIRECT
  // with subtypes (IDENTITY, TRANSFORMATION, AGGREGATION, FILTER, GROUP_BY, JOIN,
  // SORT, WINDOW, CONDITIONAL) plus a masking boolean.
  function classifyTx(type,subtype,masking,hasDesc){
    if(masking)return 'MASKING';
    var t=(type||'').toUpperCase(),s=(subtype||'').toUpperCase();
    if(s==='AGGREGATION'||s==='GROUP_BY')return 'AGGREGATION';
    if(!t&&!hasDesc)return 'IDENTITY';
    if(t==='IDENTITY'||s==='IDENTITY')return 'IDENTITY';
    if(t==='INDIRECT'&&!hasDesc&&(s==='FILTER'||s==='JOIN'||s==='SORT'||s==='WINDOW'||s==='CONDITIONAL'))return 'FILTER';
    return 'TRANSFORM';
  }

  // Depths are free-form labels ("1", "H2", "Hop-10"), so order them the way a
  // reader would: digit runs compared numerically, everything else as text.
  function natCompare(a,b){
    var ra=String(a).match(/\d+|\D+/g)||[],rb=String(b).match(/\d+|\D+/g)||[];
    for(var i=0;i<Math.max(ra.length,rb.length);i++){
      var x=ra[i],y=rb[i];
      if(x===undefined)return -1;
      if(y===undefined)return 1;
      var nx=/^\d+$/.test(x),ny=/^\d+$/.test(y);
      if(nx&&ny){if(+x!==+y)return +x-+y;}
      else if(x!==y)return x<y?-1:1;
    }
    return 0;
  }
  function dsKey(ns,name){return (ns||'')+'::'+(name||'');}

  function collectEvent(o,events,issues,file,idx){
    var where=(idx!=null?' (line '+(idx+1)+')':'');
    if(o&&typeof o==='object'&&o.job&&typeof o.job==='object'&&(o.eventType||o.inputs||o.outputs)){
      events.push(o);
    }else{
      issues.push({file:file,severity:'high',reason:'Not an OpenLineage event'+where});
    }
  }

  function parseFileContent(text,file){
    var events=[],issues=[];
    var trimmed=(text||'').trim();
    if(!trimmed){issues.push({file:file,severity:'med',reason:'Empty file'});return{events:events,issues:issues};}
    var parsed,parseErr=null;
    try{parsed=JSON.parse(trimmed);}catch(e){parseErr=e;}
    if(!parseErr){
      if(Array.isArray(parsed))parsed.forEach(function(o){collectEvent(o,events,issues,file);});
      else collectEvent(parsed,events,issues,file);
      return{events:events,issues:issues};
    }
    // Fallback: NDJSON (one JSON object per line)
    var lines=trimmed.split(/\r?\n/).filter(function(l){return l.trim();});
    var anyOk=false;
    lines.forEach(function(l,i){
      try{collectEvent(JSON.parse(l),events,issues,file,i);anyOk=true;}
      catch(e2){issues.push({file:file,severity:'high',reason:'Line '+(i+1)+': invalid JSON'});}
    });
    if(!anyOk&&lines.length<=1){
      issues=[{file:file,severity:'high',reason:'Invalid JSON: '+(parseErr.message||parseErr)}];
    }
    return{events:events,issues:issues};
  }

  function eventTimeMs(ev){var t=ev&&ev.eventTime?Date.parse(ev.eventTime):NaN;return isNaN(t)?0:t;}

  function buildModel(events,parseIssues){
    var datasets={},jobs={},edgeSet={},edges=[],colEdges=[],issues=(parseIssues||[]).slice();
    var nsOrder=[];
    function ns(n){if(n&&nsOrder.indexOf(n)<0)nsOrder.push(n);}
    function ensureDs(d){
      var k=dsKey(d.namespace,d.name);
      if(!datasets[k]){datasets[k]={key:k,namespace:d.namespace||'',name:d.name||'',system:systemOf(d.namespace),schemaFields:[],columnLineage:null,producedByJobs:{},consumedByJobs:{},owners:[],tags:[],facets:{}};ns(d.namespace);}
      return datasets[k];
    }
    function addEdge(from,to){var id=from+'>'+to;if(!edgeSet[id]){edgeSet[id]=1;edges.push({from:from,to:to});}}

    var ordered=events.slice().sort(function(a,b){return eventTimeMs(a)-eventTimeMs(b);});
    ordered.forEach(function(ev){
      var jns=ev.job.namespace||'',jname=ev.job.name||'';
      var jk=dsKey(jns,jname);ns(jns);
      var job=jobs[jk]||(jobs[jk]={key:jk,namespace:jns,name:jname,inputs:{},outputs:{},runs:[],latestEventType:null,latestTime:-1,sourceCode:null,facets:ev.job.facets||{}});
      var t=eventTimeMs(ev);
      if(ev.run&&ev.run.runId)job.runs.push({runId:ev.run.runId,eventType:ev.eventType||'',eventTime:ev.eventTime||''});
      if(t>=job.latestTime){job.latestTime=t;job.latestEventType=ev.eventType||job.latestEventType;}
      if(ev.job.facets){
        job.facets=ev.job.facets;
        if(ev.job.facets.sourceCode)job.sourceCode=ev.job.facets.sourceCode;
        var jAppF=ev.job.facets.application||ev.job.facets.domain;
        if(jAppF&&jAppF.name)job.domain=String(jAppF.name);
      }

      (ev.inputs||[]).forEach(function(d){
        if(!d)return;var ds=ensureDs(d);var k=ds.key;
        job.inputs[k]=1;ds.consumedByJobs[jk]=1;
        addEdge('d:'+k,'j:'+jk);
        applyFacets(ds,d.facets);
      });
      (ev.outputs||[]).forEach(function(d){
        if(!d)return;var ds=ensureDs(d);var k=ds.key;
        job.outputs[k]=1;ds.producedByJobs[jk]=1;
        addEdge('j:'+jk,'d:'+k);
        applyFacets(ds,d.facets);
        extractColumnEdges(ds,d.facets,colEdges);
      });
    });

    function applyFacets(ds,facets){
      if(!facets)return;
      if(facets.schema&&Array.isArray(facets.schema.fields)&&facets.schema.fields.length){
        ds.schemaFields=facets.schema.fields.map(function(f){return{name:f.name,type:f.type||''};});
      }
      if(facets.columnLineage&&facets.columnLineage.fields)ds.columnLineage=facets.columnLineage.fields;
      // Per-field governance metadata (lineage id, depth, contact…) — the hop
      // number is what labels application-to-application edges when grouping.
      if(facets.mappingMetadata&&facets.mappingMetadata.fields)ds.mappingMeta=facets.mappingMetadata.fields;
      // §3 ownership + tags facets -> governance metadata on the node
      if(facets.ownership&&Array.isArray(facets.ownership.owners))
        ds.owners=facets.ownership.owners.map(function(o){return{name:o.name||'',type:o.type||''};}).filter(function(o){return o.name;});
      var tg=[];
      if(Array.isArray(facets.tags))facets.tags.forEach(function(t){tg.push(typeof t==='string'?t:(t.key?t.key+(t.value?'='+t.value:''):(t.name||'')));});
      else if(facets.tags&&Array.isArray(facets.tags.tags))facets.tags.tags.forEach(function(t){tg.push(t.key?t.key+(t.value?'='+t.value:''):(t.name||t.value||''));});
      if(tg.length)ds.tags=tg.filter(Boolean);
      // Owning application -> group-by dimension. `domain` is the legacy facet name.
      var appF=facets.application||facets.domain;
      if(appF&&appF.name)ds.domain=String(appF.name);
      Object.keys(facets).forEach(function(fk){if(fk[0]!=='_')ds.facets[fk]=facets[fk];});
    }
    function extractColumnEdges(ds,facets,out){
      if(!facets||!facets.columnLineage||!facets.columnLineage.fields)return;
      var f=facets.columnLineage.fields;
      Object.keys(f).forEach(function(outField){
        var spec=f[outField];var ins=(spec&&spec.inputFields)||[];
        ins.forEach(function(inp){
          if(!inp)return;
          var tx='',type='',subtype='',masking=false;
          if(Array.isArray(inp.transformations)&&inp.transformations.length){
            var tr=inp.transformations[0];
            tx=tr.description||'';type=tr.type||'';subtype=tr.subtype||'';masking=!!tr.masking;
          }
          if(!tx&&inp.transformationDescription)tx=inp.transformationDescription;
          if(!type&&inp.transformationType)type=inp.transformationType;
          if(!tx&&spec.transformationDescription)tx=spec.transformationDescription;
          var txClass=classifyTx(type,subtype,masking,!!tx);
          out.push({toDs:ds.key,toField:outField,fromDs:dsKey(inp.namespace,inp.name),fromField:inp.field||'',transformation:tx,transformationType:type,transformationSubtype:subtype,masking:masking,txClass:txClass});
        });
      });
    }

    // colors
    var nsColor={};nsOrder.forEach(function(n,i){nsColor[n]=NS_COLORS[i%NS_COLORS.length];});

    var dsList=Object.keys(datasets).map(function(k){return datasets[k];});
    var jobList=Object.keys(jobs).map(function(k){return jobs[k];});
    var systems=[];dsList.forEach(function(d){if(systems.indexOf(d.system)<0)systems.push(d.system);});
    var stats={datasets:dsList.length,jobs:jobList.length,namespaces:nsOrder.length,systems:systems.length,edges:edges.length,columnEdges:colEdges.length,events:events.length};

    // §Application hops. Each mapping row records the hop it represents; roll
    // those up per source-application -> target-application pair so a collapsed
    // Application graph can say *how* one application populates another, e.g.
    // "SAP ECC -> Snowflake EDW  ·  depth 1, 2" rather than an unlabelled arrow.
    var appHops={};
    Object.keys(datasets).forEach(function(k){
      var d=datasets[k];
      if(!d.domain||!d.mappingMeta||!d.columnLineage)return;
      Object.keys(d.mappingMeta).forEach(function(f){
        var m=d.mappingMeta[f],depth=m&&m.lineageDepth;
        depth=(depth==null?'':String(depth)).trim();
        if(!depth)return;// no depth recorded -> nothing to label the edge with
        var spec=d.columnLineage[f];
        if(!spec||!Array.isArray(spec.inputFields))return;
        spec.inputFields.forEach(function(inp){
          var src=datasets[dsKey(inp.namespace,inp.name)];
          if(!src||!src.domain||src.domain===d.domain)return;
          var kk=src.domain+'\u0000'+d.domain;
          (appHops[kk]||(appHops[kk]={}))[depth]=1;
        });
      });
    });
    Object.keys(appHops).forEach(function(kk){
      appHops[kk]=Object.keys(appHops[kk]).sort(natCompare);
    });

    var model={datasets:datasets,jobs:jobs,edges:edges,colEdges:colEdges,namespaces:nsOrder,systems:systems,nsColor:nsColor,stats:stats,issues:issues,appHops:appHops};
    validate(model);
    return model;
  }

  function detectCycles(model){
    var adj={};model.edges.forEach(function(e){(adj[e.from]||(adj[e.from]=[])).push(e.to);});
    var state={},cycleNodes={};
    function dfs(n){
      state[n]=1;
      (adj[n]||[]).forEach(function(m){
        if(state[m]===1){cycleNodes[m]=1;cycleNodes[n]=1;}
        else if(!state[m])dfs(m);
      });
      state[n]=2;
    }
    Object.keys(adj).forEach(function(n){if(!state[n])dfs(n);});
    return Object.keys(cycleNodes);
  }

  // §5 Impact analysis (direction 'down') and root-cause (direction 'up').
  // BFS over the structural dataset<->job graph from a start node id ('d:'/'j:'),
  // bounded by maxDepth. Returns per-node depth, the traversed edge set, and a
  // reachable count. Pure + testable.
  function traverse(model,startId,direction,maxDepth){
    maxDepth=(maxDepth==null)?Infinity:maxDepth;
    var fwd={},rev={};
    model.edges.forEach(function(e){(fwd[e.from]||(fwd[e.from]=[])).push(e.to);(rev[e.to]||(rev[e.to]=[])).push(e.from);});
    var adj=direction==='up'?rev:fwd;
    var depth={},edges={};depth[startId]=0;
    var q=[startId];
    while(q.length){
      var n=q.shift();var d=depth[n];if(d>=maxDepth)continue;
      (adj[n]||[]).forEach(function(m){
        edges[direction==='up'?(m+'>'+n):(n+'>'+m)]=1;
        if(depth[m]==null){depth[m]=d+1;q.push(m);}
      });
    }
    return{depth:depth,edges:edges,count:Object.keys(depth).length-1,direction:direction,start:startId};
  }

  function validate(model){
    var issues=model.issues;
    Object.keys(model.datasets).forEach(function(k){
      var d=model.datasets[k];
      var prod=Object.keys(d.producedByJobs).length,cons=Object.keys(d.consumedByJobs).length;
      if(prod===0&&cons===0)issues.push({severity:'med',reason:'Orphan dataset (no producer or consumer): '+d.key});
      else if(prod>0&&d.schemaFields.length===0)issues.push({severity:'med',reason:'Output dataset missing schema: '+d.key});
    });
    var cyc=detectCycles(model);
    if(cyc.length)issues.push({severity:'high',reason:'Cycle detected involving '+cyc.length+' node(s): '+cyc.map(function(x){return x.slice(2);}).join(', ')});
    model.cycleNodes=cyc;
    return issues;
  }

  function computeLayout(model,opts){
    opts=opts||{};
    var dir=opts.direction||'LR';
    var expanded=opts.expanded||{};
    var hidden=opts.hiddenNs||{};
    var manual=opts.manual||{};
    var colFilter=opts.colFilter||{};// dsKey -> filter substring
    var fullCols=opts.fullCols||{};// nodeId -> 1 (show all columns)
    // §Extension: search-first / hop-wise focus. When `only` is provided, restrict
    // the built graph to that node-id allowlist ('d:'/'j:' ids) so million-edge
    // models render only their explored subgraph. null => build everything.
    var only=opts.only||null;
    function allow(id){return !only||only[id];}
    // §Extension: external positions (e.g. from ELK layered layout). When
    // provided as {nodeId:{x,y}} (top-left, already in `dir` orientation), the
    // internal ranking/barycenter placement is skipped and these coordinates are
    // used instead — giving clean, overlap-free, straightened large graphs.
    var positions=opts.positions||null;
    // Node boxes are a fixed width per kind so a row of them reads as a row, not
    // a ragged skyline. Long names wrap onto extra lines and grow the box
    // downwards instead of stretching it sideways.
    var HEADER=44,ROWH=16,MAXF=12,MAXFULL=200;
    var DSW=200,JOBW=150,GROUPW=210,NAME_LH=13,GNAME_LH=15,MAX_NAME_LINES=2;
    // Break on the separators that appear in dataset names (dots, underscores,
    // slashes) before resorting to a hard character break.
    function wrapText(s,maxChars,maxLines){
      s=String(s==null?'':s);
      if(s.length<=maxChars)return [s];
      var toks=s.match(/[^._\-\/ ]+[._\-\/ ]*/g)||[s],lines=[],cur='';
      toks.forEach(function(t){
        if(!cur){cur=t;return;}
        if((cur+t).length<=maxChars){cur+=t;return;}
        lines.push(cur);cur=t;
      });
      if(cur)lines.push(cur);
      var out=[];
      lines.forEach(function(l){
        while(l.length>maxChars){out.push(l.slice(0,maxChars));l=l.slice(maxChars);}
        if(l)out.push(l);
      });
      if(out.length>maxLines){
        out=out.slice(0,maxLines);
        var last=out[maxLines-1];
        out[maxLines-1]=last.length>maxChars-1?last.slice(0,maxChars-1)+'\u2026':last+'\u2026';
      }
      return out;
    }
    var COLGAP=opts.colGap!=null?opts.colGap:90;
    var ROWGAP=opts.rowGap!=null?opts.rowGap:26;

    // §5 grouped drill-down: 'namespace' | 'system' | null. Collapsed groups render
    // as one node; expanding a group reveals its tables (then columns).
    var groupBy=opts.groupBy||null;
    var expandedGroups=opts.expandedGroups||{};
    var nodes={},order=[];
    function visible(ns){return !hidden[ns];}
    function dsGroup(k){var d=model.datasets[k];return groupBy==='domain'?(d.domain||d.namespace):groupBy==='system'?(d.system||systemOf(d.namespace)):d.namespace;}
    function jobGroup(k){var j=model.jobs[k];return groupBy==='domain'?(j.domain||j.namespace):groupBy==='system'?systemOf(j.namespace):j.namespace;}

    function buildDatasetNode(k){
      var d=model.datasets[k];var id='d:'+k;var exp=!!expanded[id];
      var allF=d.schemaFields;
      var filt=(colFilter[k]||'').toLowerCase();
      var matched=filt?allF.filter(function(f){return f.name.toLowerCase().indexOf(filt)>=0;}):allF;
      // Show all matching columns when filtering or when the user expanded the
      // node; otherwise cap at MAXF with a "show all" affordance.
      var showAll=!!fullCols[id]||!!filt;
      var cap=showAll?Math.min(matched.length,MAXFULL):MAXF;
      var shown=matched.slice(0,cap);
      var more=Math.max(0,matched.length-shown.length);
      var sys=d.system||systemOf(d.namespace);
      var w=DSW;
      var nameLines=wrapText(d.name,Math.floor((w-18)/6.7),MAX_NAME_LINES);
      var hdr=HEADER+(nameLines.length-1)*NAME_LH;// header grows with the wrap
      var h=exp&&shown.length?hdr+shown.length*ROWH+(more||showAll||filt?18:6):46+(nameLines.length-1)*NAME_LH;
      nodes[id]={id:id,kind:'dataset',key:k,name:d.name,nameLines:nameLines,hdr:hdr,namespace:d.namespace,system:sys,color:model.nsColor[d.namespace]||'#888',w:w,h:h,expanded:exp,fields:shown,moreFields:more,totalFields:allF.length,matchCount:matched.length,filtered:!!filt,showAll:showAll,group:dsGroup(k)};
      order.push(id);
    }
    function buildJobNode(k){
      var j=model.jobs[k];var id='j:'+k;
      // Auto-size job width to the name (+ hex point insets) so labels never clip.
      var jw=JOBW;
      var jLines=wrapText(j.name,Math.floor((jw-34)/6),MAX_NAME_LINES);
      nodes[id]={id:id,kind:'job',key:k,name:j.name,nameLines:jLines,namespace:j.namespace,system:systemOf(j.namespace),color:JOB_COLOR,w:jw,h:46+(jLines.length-1)*12,eventType:j.latestEventType,group:jobGroup(k)};
      order.push(id);
    }

    var edges;
    if(!groupBy){
      Object.keys(model.datasets).forEach(function(k){if(visible(model.datasets[k].namespace)&&allow('d:'+k))buildDatasetNode(k);});
      Object.keys(model.jobs).forEach(function(k){if(visible(model.jobs[k].namespace)&&allow('j:'+k))buildJobNode(k);});
      edges=model.edges.filter(function(e){return nodes[e.from]&&nodes[e.to];});
      // Bypass hidden jobs: connect a hidden job's visible inputs directly to its
      // visible outputs so dataset-level lineage stays visible.
      var edgeSet={};edges.forEach(function(e){edgeSet[e.from+'>'+e.to]=1;});
      Object.keys(model.jobs).forEach(function(k){
        var jid='j:'+k;if(nodes[jid])return;
        var j=model.jobs[k];
        Object.keys(j.inputs).forEach(function(ik){
          var iid='d:'+ik;if(!nodes[iid])return;
          Object.keys(j.outputs).forEach(function(ok){
            var oid='d:'+ok;if(!nodes[oid]||iid===oid)return;
            var ek=iid+'>'+oid;if(!edgeSet[ek]){edgeSet[ek]=1;edges.push({from:iid,to:oid,bypass:true});}
          });
        });
      });
    }else{
      // Build group buckets; expand or collapse each.
      var groups={};
      Object.keys(model.datasets).forEach(function(k){var d=model.datasets[k];if(!visible(d.namespace))return;var g=dsGroup(k);(groups[g]||(groups[g]={ds:[],jobs:[],color:model.nsColor[d.namespace],sys:(d.system||systemOf(d.namespace)),nss:{}})).ds.push(k);groups[g].nss[d.namespace]=1;});
      Object.keys(model.jobs).forEach(function(k){var j=model.jobs[k];if(!visible(j.namespace))return;var g=jobGroup(k);(groups[g]||(groups[g]={ds:[],jobs:[],color:JOB_COLOR,sys:systemOf(j.namespace),nss:{}})).jobs.push(k);groups[g].nss[j.namespace]=1;});
      Object.keys(groups).forEach(function(g){
        if(expandedGroups[g]){
          groups[g].ds.forEach(buildDatasetNode);
          groups[g].jobs.forEach(buildJobNode);
        }else{
          var G=groups[g];
          // Auto-size group width to the (icon-prefixed) name so it never clips;
          // also keep room for the counts/drill-down rows. Clamped [190, 380].
          var gW=GROUPW;
          var gLines=wrapText(g,Math.floor((gW-30)/7.1)-(groupBy==='system'?2:0),MAX_NAME_LINES);
          nodes['g:'+g]={id:'g:'+g,kind:'group',key:g,name:g,nameLines:gLines,group:g,groupBy:groupBy,dsCount:G.ds.length,jobCount:G.jobs.length,nsCount:Object.keys(G.nss).length,color:G.color||'#888',system:G.sys,namespace:(groupBy==='namespace'?g:''),w:gW,h:70+(gLines.length-1)*GNAME_LH};
          order.push('g:'+g);
        }
      });
      // Map each underlying node to its representative (member id or group node).
      function repr(id){
        if(id[0]==='d'){var k=id.slice(2);var d=model.datasets[k];if(!d||hidden[d.namespace])return null;var g=dsGroup(k);return expandedGroups[g]?id:'g:'+g;}
        var k2=id.slice(2);var j=model.jobs[k2];if(!j||hidden[j.namespace])return null;var g2=jobGroup(k2);return expandedGroups[g2]?id:'g:'+g2;
      }
      edges=[];var eset={};
      // When both ends are collapsed Application groups, carry the hop numbers
      // that connect them so the edge can say how the flow happens.
      function hopsFor(a,b){
        if(groupBy!=='domain'||!model.appHops)return null;
        if(a.indexOf('g:')!==0||b.indexOf('g:')!==0)return null;
        var arr=model.appHops[a.slice(2)+'\u0000'+b.slice(2)];
        if(!arr)return null;
        arr=arr.filter(function(x){return String(x||'').trim();});
        return arr.length?arr:null;
      }
      function addGroupEdge(a,b,byp){
        if(!a||!b||a===b||!nodes[a]||!nodes[b])return;
        var ek=a+'>'+b;if(eset[ek])return;eset[ek]=1;
        var e=byp?{from:a,to:b,bypass:true}:{from:a,to:b};
        var hops=hopsFor(a,b);if(hops)e.hops=hops;
        edges.push(e);
      }
      // adjacency over the underlying dataset↔job graph, for bypassing hidden nodes.
      var gadj={};model.edges.forEach(function(e){(gadj[e.from]||(gadj[e.from]=[])).push(e.to);});
      // Transitive group edges: when a target maps to a hidden namespace (repr null),
      // walk forward through the hidden nodes to the nearest visible reprs, so the
      // higher-level lineage stays connected across an unselected namespace/group
      // (e.g. hiding the ETL/job namespace no longer isolates its source & target groups).
      model.edges.forEach(function(e){
        var a=repr(e.from);if(!a)return;
        var b=repr(e.to);
        if(b){addGroupEdge(a,b,false);return;}
        var seen={},stack=[e.to];
        while(stack.length){var cur=stack.pop();(gadj[cur]||[]).forEach(function(nx){
          if(seen[nx])return;seen[nx]=1;var rn=repr(nx);
          if(rn)addGroupEdge(a,rn,true);else stack.push(nx);
        });}
      });
    }

    // §4 Cross-platform / cross-namespace: flag edges whose endpoints live in
    // different namespaces or on different systems so the renderer can style the
    // boundary crossing distinctly.
    edges.forEach(function(e){var a=nodes[e.from],b=nodes[e.to];if(a&&b){e.crossNs=a.namespace!==b.namespace;e.crossSystem=a.system!==b.system;}});

    var totalW=0,totalH=0;
    if(positions){
      // External layered layout (ELK): use provided top-left coords directly.
      order.forEach(function(id){var p=positions[id];nodes[id].x=(p&&p.x!=null)?p.x:20;nodes[id].y=(p&&p.y!=null)?p.y:20;});
    }else{
    // rank via Kahn + longest path
    var indeg={},adj={};order.forEach(function(id){indeg[id]=0;adj[id]=[];});
    edges.forEach(function(e){adj[e.from].push(e.to);indeg[e.to]++;});
    var rank={},queue=[];order.forEach(function(id){if(indeg[id]===0){rank[id]=0;queue.push(id);}});
    var idc={};Object.keys(indeg).forEach(function(k){idc[k]=indeg[k];});
    var seen=0;
    while(queue.length){
      var n=queue.shift();seen++;
      adj[n].forEach(function(m){rank[m]=Math.max(rank[m]||0,(rank[n]||0)+1);if(--idc[m]===0)queue.push(m);});
    }
    // any unranked (cycles) -> place after max
    order.forEach(function(id){if(rank[id]==null)rank[id]=0;});

    var byRank={};order.forEach(function(id){var r=rank[id];(byRank[r]||(byRank[r]=[])).push(id);});
    var ranks=Object.keys(byRank).map(Number).sort(function(a,b){return a-b;});

    // column x per rank (variable node widths => use max width in rank * rank index spacing)
    var rankX={},x=20;
    ranks.forEach(function(r){var maxW=0;byRank[r].forEach(function(id){maxW=Math.max(maxW,nodes[id].w);});rankX[r]=x;x+=maxW+COLGAP;});
    totalW=x;

    // Vertical placement: keep chains straight in L->R by aligning each node to
    // the barycenter (average center) of its parents. A node with a single parent
    // inherits the parent's Y (dead-straight); a node fed by several parents sits
    // at their midpoint; only genuine collisions get pushed down by the min gap.
    var childrenOf={},parentsOf={};
    order.forEach(function(id){childrenOf[id]=[];parentsOf[id]=[];});

  // any other host -> GitLab API (supports self-hosted). Handles bare "owner/repo"
  // (GitHub) and web URLs that embed a branch (/tree/<branch>/... or /-/tree/...).
  function parseRepoUrl(url){
    if(!url||typeof url!=='string')return null;
    url=url.trim().replace(/\.git(\/)?$/,'').replace(/\/+$/,'');
    if(!url)return null;
    var m=url.match(/^https?:\/\/([^\/]+)\/(.+)$/i);
    if(!m){

  // §7 Transformation categories -> OpenLineage transformation {type,subtype}.
  // Order matters: earlier, more specific patterns win. type is DIRECT (value
  // flows into the field) or INDIRECT (affects selection/shape); subtype per OL.
  var TX_CATS=[
    {cat:'Aggregation',re:/\b(sum|avg|count|min|max|group\s*by|aggregate)\b/i,type:'DIRECT',subtype:'AGGREGATION',sql:true},
    {cat:'Lookup',re:/\b(lookup|vlookup|xref|reference)\b/i,type:'INDIRECT',subtype:'JOIN',sql:true},
    {cat:'Join',re:/\b(join|inner\s+join|left\s+join|right\s+join|merge)\b/i,type:'INDIRECT',subtype:'JOIN',sql:true},
    {cat:'Filter',re:/\b(filter|where|having)\b/i,type:'INDIRECT',subtype:'FILTER',sql:true},
    {cat:'Sort',re:/\b(sort|order\s*by)\b/i,type:'INDIRECT',subtype:'SORT',sql:true},
    {cat:'Distinct',re:/\b(distinct|dedup|deduplicate|unique)\b/i,type:'INDIRECT',subtype:'FILTER',sql:true},
    {cat:'Union',re:/\bunion(\s+all)?\b/i,type:'DIRECT',subtype:'TRANSFORMATION',sql:true},
    {cat:'Case Statement',re:/\b(case\s+when|decode|if\s*\(|iif)\b/i,type:'DIRECT',subtype:'CONDITIONAL',sql:true},
    {cat:'Concatenation',re:/(\|\||\bconcat\b|\bconcatenate\b)/i,type:'DIRECT',subtype:'TRANSFORMATION',sql:true},
    {cat:'Arithmetic',re:/[\+\-\*\/%]|\b(mod|round|floor|ceil|abs)\b/i,type:'DIRECT',subtype:'TRANSFORMATION',sql:true},
    {cat:'Substring',re:/\b(substr|substring|left|right|mid)\b/i,type:'DIRECT',subtype:'TRANSFORMATION',sql:true},
    {cat:'Trim',re:/\b(trim|ltrim|rtrim)\b/i,type:'DIRECT',subtype:'TRANSFORMATION',sql:true},
    {cat:'Upper',re:/\bupper\b/i,type:'DIRECT',subtype:'TRANSFORMATION',sql:true},
    {cat:'Lower',re:/\blower\b/i,type:'DIRECT',subtype:'TRANSFORMATION',sql:true},
    {cat:'Cast',re:/\b(cast|convert|to_char|to_date|to_number)\b/i,type:'DIRECT',subtype:'TRANSFORMATION',sql:true},
    {cat:'Coalesce',re:/\bcoalesce\b/i,type:'DIRECT',subtype:'TRANSFORMATION',sql:true},
    {cat:'NVL',re:/\b(nvl|nvl2|ifnull|isnull)\b/i,type:'DIRECT',subtype:'TRANSFORMATION',sql:true},
    {cat:'Constant',re:/^\s*(['"].*['"]|-?\d+(\.\d+)?)\s*$|\bconstant\b|\bliteral\b/i,type:'DIRECT',subtype:'TRANSFORMATION',sql:false},
    {cat:'Alias',re:/\b(alias|rename|as\b)/i,type:'DIRECT',subtype:'IDENTITY',sql:false},
    {cat:'Derived Column',re:/\b(derive|derived|expression|expr)\b/i,type:'DIRECT',subtype:'TRANSFORMATION',sql:true}

  /** Classify a transformation string into an OL transformation descriptor. */
  function classifyTransformation(text,mappingType){
    var t=(text==null?'':String(text)).trim();
    var mt=normKey(mappingType);
    if(!t){// empty transformation => DIRECT identity mapping (per spec §4)
      if(mt==='constant')return{category:'Constant',type:'DIRECT',subtype:'TRANSFORMATION',sqlLike:false,description:'',direct:true};
      return{category:'Direct Mapping',type:'DIRECT',subtype:'IDENTITY',sqlLike:false,description:'',direct:true};
    }
    for(var i=0;i<TX_CATS.length;i++){
      if(TX_CATS[i].re.test(t))return{category:TX_CATS[i].cat,type:TX_CATS[i].type,subtype:TX_CATS[i].subtype,sqlLike:TX_CATS[i].sql,description:t,direct:false};
    }
    return{category:'Expression',type:'DIRECT',subtype:'TRANSFORMATION',sqlLike:true,description:t,direct:false};
  }

  // Explicit ColumnTransformationType -> OpenLineage {type,subtype}. When the
  // process template supplies a type, it wins; otherwise fall back to inferring
  // from the transformation logic text.
  var COL_TX_MAP={identity:{type:'DIRECT',subtype:'IDENTITY'},direct:{type:'DIRECT',subtype:'IDENTITY'},copy:{type:'DIRECT',subtype:'IDENTITY'},passthrough:{type:'DIRECT',subtype:'IDENTITY'},
    transformation:{type:'DIRECT',subtype:'TRANSFORMATION'},expression:{type:'DIRECT',subtype:'TRANSFORMATION'},derived:{type:'DIRECT',subtype:'TRANSFORMATION'},derivedcolumn:{type:'DIRECT',subtype:'TRANSFORMATION'},
    aggregation:{type:'DIRECT',subtype:'AGGREGATION'},aggregate:{type:'DIRECT',subtype:'AGGREGATION'},
    conditional:{type:'DIRECT',subtype:'CONDITIONAL'},'case':{type:'DIRECT',subtype:'CONDITIONAL'},casestatement:{type:'DIRECT',subtype:'CONDITIONAL'},decode:{type:'DIRECT',subtype:'CONDITIONAL'},
    join:{type:'INDIRECT',subtype:'JOIN'},lookup:{type:'INDIRECT',subtype:'JOIN'},
    filter:{type:'INDIRECT',subtype:'FILTER'},'where':{type:'INDIRECT',subtype:'FILTER'},distinct:{type:'INDIRECT',subtype:'FILTER'},
    sort:{type:'INDIRECT',subtype:'SORT'},orderby:{type:'INDIRECT',subtype:'SORT'},window:{type:'INDIRECT',subtype:'WINDOW'},
    groupby:{type:'INDIRECT',subtype:'GROUP_BY'},masking:{type:'DIRECT',subtype:'TRANSFORMATION',masking:true},mask:{type:'DIRECT',subtype:'TRANSFORMATION',masking:true}};

  /** Classify a column transformation given an explicit type and/or logic text. */
  function classifyColumn(typeStr,logic){
    var key=normKey(typeStr);
    var lg=(logic==null?'':String(logic)).trim();
    if(key&&COL_TX_MAP[key]){
      var m=COL_TX_MAP[key];
      var base=classifyTransformation(lg,'');
      return{category:(typeStr?String(typeStr).trim():m.subtype),type:m.type,subtype:m.subtype,sqlLike:base.sqlLike,description:lg,masking:!!m.masking,direct:m.subtype==='IDENTITY'};
    }
    var c=classifyTransformation(lg,'');c.masking=false;return c;// unknown/blank type -> infer from logic
  }

  // Match a worksheet's headers against one template, returning the column map
  // plus every structural discrepancy.
  function buildMap(headers,tmpl){
    var map={},duplicates=[],blanks=[],unexpected=[],caseMismatches=[],seen={};
    headers.forEach(function(raw,i){
      var s=(raw==null?'':String(raw)).trim();
      if(!s){blanks.push({index:i});return;}
      var f=tmpl.alias[normKey(s)];
      if(!f){unexpected.push({index:i,header:s});return;}
      if(seen[f.key]!=null){duplicates.push({key:f.key,label:f.label,index:i});return;}
      seen[f.key]=i;map[f.key]=i;
      // Only flag headers that are the canonical label in different case or
      // spacing. A header that matched through an accepted alias is a different
      // wording, not a mistake, and warning on it buries the real gaps.
      if(s!==f.label&&normKey(s)===normKey(f.label))caseMismatches.push({index:i,header:s,expected:f.label});
    });
    var missing=tmpl.fields.filter(function(f){return f.req&&map[f.key]==null;}).map(function(f){return f.label;});
    return{map:map,duplicates:duplicates,blanks:blanks,unexpected:unexpected,caseMismatches:caseMismatches,missing:missing,mapped:Object.keys(map).length};
  }

  // §3 Template validation. Auto-detects which registered template the sheet
  // uses (fewest missing required columns, ties broken by most columns mapped).
  // Pass opts.template to force one. `meta` carries structural signals.
  function validateTemplate(headers,opts){
    opts=opts||{};headers=headers||[];
    var chosen,trial;
    if(opts.template&&TEMPLATES[opts.template]){chosen=opts.template;trial=buildMap(headers,TEMPLATES[chosen]);}
    else{
      // Scoring. "Fewest missing required" alone is fragile: a sheet can be short
      // a few columns of its own template yet accidentally satisfy more of the
      // other one, and then the failure is reported against a template the author
      // never used. Signature columns — the ones only that template has — settle
      // it first, so the reported gaps always name the template actually in use.
      var cands=Object.keys(TEMPLATES).map(function(id){
        var t=buildMap(headers,TEMPLATES[id]);
        var sig=(TEMPLATES[id].signature||[]).filter(function(k){return t.map[k]!=null;}).length;
        return {id:id,t:t,sig:sig,label:TEMPLATES[id].label};
      });
      cands.sort(function(a,b){
        if(b.sig!==a.sig)return b.sig-a.sig;                       // more signature columns wins
        if(a.t.missing.length!==b.t.missing.length)return a.t.missing.length-b.t.missing.length;
        return b.t.mapped-a.t.mapped;
      });
      chosen=cands[0].id;trial=cands[0].t;
      var candidates=cands.map(function(c){
        return {template:c.id,label:c.label,signatureMatched:c.sig,
          signatureTotal:(TEMPLATES[c.id].signature||[]).length,
          missing:c.t.missing,mapped:c.t.mapped};
      });
    }
    var tmpl=TEMPLATES[chosen];
    var orderIssues=[];
    if(opts.enforceOrder){
      var present=tmpl.fields.filter(function(f){return trial.map[f.key]!=null;});
      var idxs=present.map(function(f){return trial.map[f.key];});
      for(var k=1;k<idxs.length;k++)if(idxs[k]<idxs[k-1]){orderIssues.push(present[k].label);break;}
    }
    var meta=opts.meta||{};
    var structural=[];
    if(meta.merges&&meta.merges.length)structural.push({kind:'mergedCells',count:meta.merges.length});
    if(meta.hiddenCols&&meta.hiddenCols.length)structural.push({kind:'hiddenColumns',count:meta.hiddenCols.length});
    var ok=trial.missing.length===0&&trial.duplicates.length===0;
    return{ok:ok,template:chosen,templateLabel:tmpl.label,candidates:(typeof candidates!=='undefined'?candidates:null),map:trial.map,missing:trial.missing,unexpected:trial.unexpected,duplicates:trial.duplicates,blanks:trial.blanks,caseMismatches:trial.caseMismatches,orderIssues:orderIssues,structural:structural,sheetName:meta.sheetName||opts.sheetName||''};
  }

  function isBlank(v){return v==null||String(v).trim()==='';}
  function whitespaceOnly(v){return v!=null&&String(v)!==''&&String(v).trim()==='';}
  var IDENT_RE=/^[A-Za-z_][A-Za-z0-9_$# .]*$/;
  function parseBool(v){var s=normKey(v);if(s==='y'||s==='yes'||s==='true'||s==='1'||s==='nullable')return true;if(s==='n'||s==='no'||s==='false'||s==='0'||s==='notnull')return false;return null;}
  function gap(row,severity,field,current,expected,rule,message,rec){return{row:row,severity:severity,field:field,current:current==null?'':String(current),expected:expected||'',rule:rule,message:message,recommendation:rec||''};}

  // §4 Row-level validation, driven by the detected template. Emits a normalized
  // row (ns/name/field + OL transformation, template-agnostic) for every valid
  // row and a typed Gap[] for every violation. Any ERROR gap excludes the row.
  function validateRows(rows,map,opts){
    opts=opts||{};rows=rows||[];
    var tmpl=(opts.template&&TEMPLATES[opts.template])||templateForMap(map);
    var headerRow=opts.headerRow||1;
    var gaps=[],valid=[],seenMap={},edges=[],edgeSet={},processed=0,invalid=0,seenLineageId={};

      var rowErr=false,rec={};

        }
      });
      // name-shape validation for the template's identifier columns
      tmpl.identifiers.forEach(function(k){
        var v=rec[k];if(v&&!IDENT_RE.test(v)){var lbl=labelOf(tmpl,k);gaps.push(gap(excelRow,'WARNING',lbl,v,'valid identifier','invalid-name',lbl+' "'+v+'" is not a valid identifier.','Use letters, digits, _ and . only.'));}
      });
      tmpl.check(rec,gaps,excelRow);
      // Lineage ID is declared a unique serial, so a repeat is a real defect —
      // it breaks traceability back to the row a downstream question came from.
      if(rec.lineageId){
        var lid=String(rec.lineageId).trim();
        if(seenLineageId[lid])gaps.push(gap(excelRow,'WARNING','Lineage ID',lid,'unique across the sheet','duplicate-lineage-id','Lineage ID "'+lid+'" is already used on row '+seenLineageId[lid]+'.','Give each row its own identifier.'));
        else seenLineageId[lid]=excelRow;
      }
      // duplicate + structural edge (for cross-row cycle detection)
      var e=tmpl.edge(rec);
      if(e){
        if(seenMap[e.dup])gaps.push(gap(excelRow,'WARNING',e.tgtLabel,e.tgtField,'unique mapping','duplicate-mapping','Duplicate mapping (same source and target column).','Remove the duplicate row.'));
        else seenMap[e.dup]=excelRow;
        if(e.selfCircular)gaps.push(gap(excelRow,'WARNING',e.tgtLabel,e.to,'distinct source/target','circular-mapping','Source and target are identical (self-mapping).','Confirm this is intentional or remove the row.'));

      if(rowErr){invalid++;return;}
      valid.push(tmpl.normalize(rec,excelRow,opts));
    });
    // §4 cross-row circular mappings at the dataset level
    var cyc=detectCycles(edges);
    if(cyc.length)gaps.push(gap(0,'WARNING','Target',cyc.map(function(x){return x.split('::').pop();}).join(' -> '),'acyclic lineage','circular-mapping','Circular mapping detected across datasets.','Break the cycle; lineage graphs must be acyclic.'));

  }

  // Template registry. Each template supplies field defs, identifier columns for
  // name-shape checks, a per-row `check` (warnings), an `edge` (dup/cycle keys),
  // and a `normalize` producing the common row consumed by generateEvents.
  function templateForMap(map){if(map&&map.sourceTable!=null)return TEMPLATES.basic;if(map&&(map.processName!=null||map.sourceDataset!=null))return TEMPLATES.process;return TEMPLATES.basic;}
  var TEMPLATES={
    basic:{id:'basic',label:'Source→Target Mapping',fields:FIELDS,alias:mkAlias(FIELDS),

      // Columns Template B does not have — their presence means this is a Template A sheet.
      signature:['sourceSchema','targetSchema','sourceColumn','targetColumn','cde','lineageDepth','sourceAssetId','targetAssetId','physicalOrigin','contactName','filterCriteria','templateFile'],
      check:function(rec,gaps,er){
        if(rec.dataType&&!DATA_TYPES[normKey(rec.dataType).replace(/\(.*/,'')])gaps.push(gap(er,'WARNING','Data Type',rec.dataType,'known SQL type','invalid-data-type','Unrecognized data type "'+rec.dataType+'".','Use a standard SQL type (e.g. varchar, decimal, timestamp).'));
        if(rec.mappingType&&!MAPPING_TYPES[normKey(rec.mappingType)])gaps.push(gap(er,'WARNING','Mapping Type',rec.mappingType,'supported mapping type','unsupported-mapping-type','Unsupported mapping type "'+rec.mappingType+'".','Use DIRECT, DERIVED, LOOKUP, AGGREGATION, JOIN, EXPRESSION, or CONSTANT.'));
        if(rec.nullable&&parseBool(rec.nullable)==null)gaps.push(gap(er,'WARNING','Nullable',rec.nullable,'Y/N boolean','invalid-nullable','Nullable "'+rec.nullable+'" is not a recognized boolean.','Use Y/N, true/false, or 1/0.'));

        [['Source Asset ID',rec.sourceAssetId],['Target Asset ID',rec.targetAssetId]].forEach(function(a){
          if(a[1]&&!ASSET_ID_RE.test(String(a[1]).trim()))
            gaps.push(gap(er,'WARNING',a[0],a[1],'APP/MOD/EUC prefix','invalid-asset-id',a[0]+' "'+a[1]+'" does not start with a known asset prefix.','Prefix with APP- (application), MOD- (model), or EUC- (end-user computing).'));
        });
        if(rec.physicalOrigin&&parseBool(rec.physicalOrigin)==null)
          gaps.push(gap(er,'WARNING','Physical Data Element of Origin (Y/N)',rec.physicalOrigin,'Y/N boolean','invalid-physical-origin','Physical Data Element of Origin "'+rec.physicalOrigin+'" is not a recognized boolean.','Use Y/N, true/false, or 1/0.'));

        if(rec.cde&&String(rec.cde).indexOf('.')<0)
          gaps.push(gap(er,'WARNING','CDE Associated with Row',rec.cde,'<table>.<field>','invalid-cde-format','CDE "'+rec.cde+'" is not in <table>.<field> form.','Write the table or file, a period, then the field — or leave blank to derive it from the target.'));
      },
      edge:function(rec){
        var srcFq=rec.sourceSystem+'.'+rec.sourceSchema+'.'+rec.sourceTable;
        var tgtFq=rec.targetSystem+'.'+rec.targetSchema+'.'+rec.targetTable;
        return{from:rec.sourceTable?srcFq:'',to:rec.targetTable?tgtFq:'',dup:tgtFq+'|'+rec.targetColumn+'<='+srcFq+'|'+rec.sourceColumn,tgtField:rec.targetColumn,tgtLabel:'Target Column',selfCircular:(srcFq===tgtFq&&rec.sourceColumn&&rec.sourceColumn===rec.targetColumn&&isBlank(rec.transformation))};

        // namespaces stay meaningful (snowflakeedw://analytics) instead of every
        // dataset collapsing under a single "unknown" scheme.
        var sSys=rec.sourceSystem||rec.sourceDomain||'',tSys=rec.targetSystem||rec.targetDomain||'';
        var sNs=nsFor(sSys,rec.sourceSchema),sName=nameFor(rec.sourceSchema,rec.sourceTable);
        var tNs=nsFor(tSys,rec.targetSchema),tName=nameFor(rec.targetSchema,rec.targetTable);

        // target when the author left it blank rather than demanding it twice.

          targetNs:tNs,targetName:tName,targetField:rec.targetColumn,targetObjectType:'TABLE',
          sourceDomain:rec.sourceDomain||'',targetDomain:rec.targetDomain||'',dataType:rec.dataType,nullable:parseBool(rec.nullable)!==false,tx:tx,tableTx:null,
          lineageId:rec.lineageId||'',cde:cde,filterCriteria:rec.filterCriteria||'',

          sourceObjectId:rec.sourceObjectId||'',targetObjectId:rec.targetObjectId||'',
          sourceDatabase:rec.sourceDatabase||'',targetDatabase:rec.targetDatabase||'',
          physicalOrigin:parseBool(rec.physicalOrigin),contactName:rec.contactName||'',
          lineageDepth:rec.lineageDepth||'',templateFile:rec.templateFile||'',

      }},
    process:{id:'process',label:'Process Lineage',fields:PROCESS_FIELDS,alias:mkAlias(PROCESS_FIELDS),
      identifiers:['sourceDataset','sourceField','targetDataset','targetField'],
      // Columns Template A does not have — the process/technology/host triple.
      signature:['processName','sourceTech','targetTech','sourceHost','targetHost','lineageType','runId','tableTransformationType','columnTransformationType'],
      check:function(rec,gaps,er){
        var lt=normKey(rec.lineageType);

        if((lt==='runtime'||lt==='run')&&isBlank(rec.runId))gaps.push(gap(er,'WARNING','RunId','','RunId for a runtime row','missing-runid','RunId is empty for a RunTime lineage row.','Provide RunId so the runtime event has a stable run identifier.'));

        var sNs=techNs(rec.sourceTech,rec.sourceHost,rec.sourcePort),tNs=techNs(rec.targetTech,rec.targetHost,rec.targetPort);
        var srcFq=sNs+'::'+rec.sourceDataset,tgtFq=tNs+'::'+rec.targetDataset;
        return{from:rec.sourceDataset?srcFq:'',to:rec.targetDataset?tgtFq:'',dup:tgtFq+'|'+rec.targetField+'<='+srcFq+'|'+rec.sourceField,tgtField:rec.targetField,tgtLabel:'TargetField',selfCircular:(srcFq===tgtFq&&rec.sourceField&&rec.sourceField===rec.targetField&&isBlank(rec.columnTransformationLogic))};
      },
      normalize:function(rec,er,opts){
        var lt=normKey(rec.lineageType);var isRun=lt==='runtime'||lt==='run';
        var colTx=classifyColumn(rec.columnTransformationType,rec.columnTransformationLogic);
        var sNs=techNs(rec.sourceTech,rec.sourceHost,rec.sourcePort),tNs=techNs(rec.targetTech,rec.targetHost,rec.targetPort);
        var jk=(rec.processName||'process')+(rec.lineageId?('#'+rec.lineageId):'')+'::'+(isRun?'RUNTIME':'DESIGN')+(isRun&&rec.runId?('::'+rec.runId):'');
        return{row:er,sourceNs:sNs,sourceName:rec.sourceDataset,sourceField:rec.sourceField,sourceObjectType:rec.sourceObjectType||'TABLE',
          targetNs:tNs,targetName:rec.targetDataset,targetField:rec.targetField,targetObjectType:rec.targetObjectType||'TABLE',
          sourceDomain:rec.sourceDomain||'',targetDomain:rec.targetDomain||'',dataType:'',nullable:true,tx:colTx,tableTx:{type:rec.tableTransformationType||'',logic:rec.tableTransformationLogic||''},
          jobName:rec.processName,jobKey:jk,jobNamespace:opts.processNamespace||'etl.process',lineageType:isRun?'RUNTIME':'DESIGN',runId:isRun?(rec.runId||null):null};
      }}
  };

  function detectCycles(edges){
    var adj={},cyc={},state={};
    edges.forEach(function(e){(adj[e.from]||(adj[e.from]=[])).push(e.to);});
    function dfs(n){state[n]=1;(adj[n]||[]).forEach(function(m){if(state[m]===1){cyc[m]=1;cyc[n]=1;}else if(!state[m])dfs(m);});state[n]=2;}
    Object.keys(adj).forEach(function(n){if(!state[n])dfs(n);});

  }

  // Build an OpenLineage namespace (scheme URI) + dataset name from ETL metadata.
  // scheme://schema keeps LineageEngine.systemOf() able to derive the platform.
  function schemeOf(sys){var t=normKey(sys);return t||'unknown';}
  function nsFor(system,schema){return schemeOf(system)+'://'+(schema?String(schema).toLowerCase():'default');}
  function nameFor(schema,table){return (schema?String(schema)+'.':'')+table;}
  // Process-template namespace: <technology-scheme>://<host[:port]> so
  // LineageEngine.systemOf() still derives the platform and cross-host lineage
  // stays distinguishable.
  function techNs(tech,host,port){
    var s=schemeOf(tech);var auth=host?String(host).trim():'';
    if(auth&&port!=null&&String(port).trim())auth+=':'+String(port).trim();
    return s+'://'+(auth||'default');
  }

  function hashStr(s){var h=0x811c9dc5;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=(h*0x01000193)>>>0;}return h;}
  function uuidFrom(s){// deterministic v4-shaped id so re-runs produce stable runIds
    var a=hashStr(s),b=hashStr(s+'|1'),c=hashStr(s+'|2'),d=hashStr(s+'|3');
    function hex(n){return ('00000000'+(n>>>0).toString(16)).slice(-8);}
    var raw=hex(a)+hex(b)+hex(c)+hex(d);
    return raw.slice(0,8)+'-'+raw.slice(8,12)+'-4'+raw.slice(13,16)+'-'+((parseInt(raw[16],16)&0x3|0x8).toString(16))+raw.slice(17,20)+'-'+raw.slice(20,32);
  }

  // §8 Generate OpenLineage COMPLETE events from normalized rows. One event per
  // job (a target table's mapping for template A; a ProcessName+run for template
  // B), each with its input datasets and one or more output datasets carrying
  // schema, columnLineage, documentation, datasetType, and an SQL job facet.
  // Design rows get deterministic runIds; RunTime rows use the supplied RunId.
  function generateEvents(rows,opts){
    opts=opts||{};
    var producer=opts.producer||PRODUCER;
    var eventTime=opts.eventTime||new Date().toISOString();
    var jobs={},jobOrder=[],report=[],targetSet={};
    rows.forEach(function(r){
      var job=jobs[r.jobKey];
      if(!job){job=jobs[r.jobKey]={key:r.jobKey,name:r.jobName,namespace:r.jobNamespace,lineageType:r.lineageType,runId:r.runId,tableTx:r.tableTx,inputs:{},inputOrder:[],outputs:{},outputOrder:[],sqlLike:false};jobOrder.push(r.jobKey);}
      var ik=r.sourceNs+'::'+r.sourceName;
      var inp=job.inputs[ik];if(!inp){inp=job.inputs[ik]={namespace:r.sourceNs,name:r.sourceName,objectType:r.sourceObjectType,domain:r.sourceDomain||'',assetId:r.sourceAssetId||'',objectId:r.sourceObjectId||'',database:r.sourceDatabase||'',fields:{},fieldOrder:[]};job.inputOrder.push(ik);}
      if(r.sourceField&&inp.fields[r.sourceField]==null){inp.fields[r.sourceField]=1;inp.fieldOrder.push(r.sourceField);}
      var ok=r.targetNs+'::'+r.targetName;targetSet[ok]=1;
      var out=job.outputs[ok];if(!out){out=job.outputs[ok]={namespace:r.targetNs,name:r.targetName,objectType:r.targetObjectType,domain:r.targetDomain||'',assetId:r.targetAssetId||'',objectId:r.targetObjectId||'',database:r.targetDatabase||'',fields:{},fieldOrder:[],cl:{},meta:{}};job.outputOrder.push(ok);}
      // Row-level governance metadata, keyed by the target field it describes.
      if(r.targetField&&(r.lineageId||r.cde||r.filterCriteria||r.contactName||r.lineageDepth||r.templateFile||r.physicalOrigin!=null)){
        out.meta=out.meta||{};
        out.meta[r.targetField]={lineageId:r.lineageId||'',cde:r.cde||'',filterCriteria:r.filterCriteria||'',
          physicalDataElementOfOrigin:r.physicalOrigin==null?null:!!r.physicalOrigin,
          contactName:r.contactName||'',lineageDepth:String(r.lineageDepth||'').trim()||null,
          templateFile:r.templateFile||''};
      }
      if(out.fields[r.targetField]==null){out.fields[r.targetField]=r.dataType||'';out.fieldOrder.push(r.targetField);}
      var cl=out.cl[r.targetField]||(out.cl[r.targetField]={inputFields:[]});
      cl.inputFields.push({namespace:r.sourceNs,name:r.sourceName,field:r.sourceField,transformations:[{type:r.tx.type,subtype:r.tx.subtype,description:r.tx.description||'',masking:!!r.tx.masking}]});
      if(r.tx.sqlLike||(r.tableTx&&r.tableTx.logic))job.sqlLike=true;
      report.push({process:r.jobName,lineageType:r.lineageType,targetDataset:r.targetName,targetColumn:r.targetField,sourceDataset:r.sourceName,sourceColumn:r.sourceField,transformation:r.tx.description||'(direct)',category:r.tx.category,type:r.tx.type,subtype:r.tx.subtype});
    });
    function dsFacet(d,isOutput){
      var facets={schema:{_producer:producer,_schemaURL:SCHEMA_FACET,fields:d.fieldOrder.map(function(c){return{name:c,type:isOutput?(d.fields[c]||''):''};})}};
      if(isOutput){
        facets.columnLineage={_producer:producer,_schemaURL:CL_FACET,fields:d.cl};
        facets.documentation={_producer:producer,_schemaURL:DOC_SCHEMA,description:'Target of a lineage mapping specification.'};
      }
      if(d.objectType)facets.datasetType={_producer:producer,_schemaURL:DSTYPE_FACET,datasetType:String(d.objectType).toUpperCase(),subType:''};
      // Owning application — emitted so the grouping survives a round-trip through
      // OpenLineage. `domain` is retained as a deprecated alias for consumers
      // written against the previous name.
      if(d.domain){
        facets.application={_producer:producer,_schemaURL:APP_FACET,name:String(d.domain)};
        facets.domain={_producer:producer,_schemaURL:APP_FACET,name:String(d.domain),deprecated:'Use the application facet.'};
      }
      // Asset-register identity (APP/MOD/EUC) and the unique data object id.
      if(d.assetId||d.domain||d.objectId||d.database){
        facets.asset={_producer:producer,_schemaURL:ASSET_FACET};
        if(d.assetId)facets.asset.id=String(d.assetId);
        if(d.domain)facets.asset.name=String(d.domain);
        if(d.objectId)facets.asset.dataObjectId=String(d.objectId);
        if(d.database)facets.asset.database=String(d.database);
      }
      // Per-field governance metadata for the columns this dataset produces.
      if(isOutput&&d.meta&&Object.keys(d.meta).length)
        facets.mappingMetadata={_producer:producer,_schemaURL:MAPPING_META_FACET,fields:d.meta};
      return{namespace:d.namespace,name:d.name,facets:facets};
    }
    var events=jobOrder.map(function(jk){
      var job=jobs[jk];var isRun=job.lineageType==='RUNTIME';
      var inputs=job.inputOrder.map(function(ik){return dsFacet(job.inputs[ik],false);});
      var outputs=job.outputOrder.map(function(ok){return dsFacet(job.outputs[ok],true);});
      var jobFacets={documentation:{_producer:producer,_schemaURL:DOC_SCHEMA,description:(isRun?'Runtime':'Design-time')+' lineage: '+outputs.map(function(o){return o.name;}).join(', ')+' <= '+inputs.map(function(i){return i.name;}).join(', ')}};
      var sqlQuery=(job.tableTx&&job.tableTx.logic)?String(job.tableTx.logic).trim():(job.sqlLike?buildSql(job):null);
      if(sqlQuery)jobFacets.sql={_producer:producer,_schemaURL:SQL_SCHEMA,query:sqlQuery};
      // A job belongs to the application it writes into. Without this the job
      // node has no application and falls back to its namespace when grouping.
      var jobApp='';
      job.outputOrder.forEach(function(ok){if(!jobApp&&job.outputs[ok].domain)jobApp=job.outputs[ok].domain;});
      if(!jobApp)job.inputOrder.forEach(function(ik){if(!jobApp&&job.inputs[ik].domain)jobApp=job.inputs[ik].domain;});
      if(jobApp){
        jobFacets.application={_producer:producer,_schemaURL:APP_FACET,name:jobApp};
        jobFacets.domain={_producer:producer,_schemaURL:APP_FACET,name:jobApp,deprecated:'Use the application facet.'};
      }
      // Runtime rows -> OpenLineage RunEvent (eventType + run). Design-time rows
      // -> static JobEvent (no run, no eventType) so consumers correctly treat it
      // as design-time lineage rather than a completed run.
      if(isRun){
        return{eventType:'COMPLETE',eventTime:eventTime,producer:producer,schemaURL:RUNEVENT_SCHEMA,

          job:{namespace:job.namespace,name:job.name,facets:jobFacets},

      }
