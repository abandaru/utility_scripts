    if(tab==='JOBS')return renderJobs();
    if(tab==='ISSUES')return renderIssues();
    if(tab==='NS')return renderNamespaces();
  }

  function renderDetails(){
    if(!selNode)return h('div',{className:'muted'},'Select a node in the graph to inspect it.');
    if(selected.kind==='dataset'){
      var d=selNode;
      return h(React.Fragment,null,
        h('div',{style:{display:'flex',alignItems:'center',gap:6}},h('span',{className:'sw',style:{background:model.nsColor[d.namespace]}}),h('span',{style:{color:'var(--t0)',fontSize:12}},d.name)),
        h('div',{className:'muted',style:{marginTop:2}},d.namespace),
        h('div',{style:{display:'flex',alignItems:'center',gap:8,marginTop:8}},h('span',{className:'sys-pill'},E.systemIcon(d.system)+' '+d.system)),
        h('div',{style:{display:'flex',gap:6,marginTop:8}},
          h('button',{className:'btn',onClick:function(){startImpact('down','d:'+d.key);}},'⬇ Impact'),
          h('button',{className:'btn',onClick:function(){startImpact('up','d:'+d.key);}},'⬆ Root cause')),
        h('div',{style:{marginTop:8}},h('button',{className:'btn',onClick:function(){setModal({title:d.key,body:JSON.stringify(d.facets,null,2)});}},'View facets')),
        d.owners.length?h(React.Fragment,null,h('div',{className:'sec-label'},'Owners'),h('div',{className:'box'},d.owners.map(function(o,i){return h('div',{key:i,className:'owner-chip'},h('span',null,'👤 '+o.name),o.type&&h('span',{className:'otype'},o.type));}))):null,
        d.tags.length?h(React.Fragment,null,h('div',{className:'sec-label'},'Tags'),h('div',null,d.tags.map(function(t,i){return h('span',{key:i,className:'tag-chip'},t);}))):null,
        h('div',{className:'sec-label'},'Schema ('+d.schemaFields.length+')'),
        d.schemaFields.length?(function(){
          var fq=(colFilter[d.key]||'').toLowerCase();
          var fs=fq?d.schemaFields.filter(function(f){return f.name.toLowerCase().indexOf(fq)>=0;}):d.schemaFields;
          var linShown=fs.filter(function(f){return hasColLineage(d.key,f.name);});
          return h(React.Fragment,null,
            d.schemaFields.length>6?h('input',{className:'finput',style:{marginBottom:6,fontSize:11,padding:'6px 8px'},placeholder:'Search columns…',value:colFilter[d.key]||'',onChange:function(e){setDsFilter(d.key,e.target.value);}}):null,
            // multi-select controls: tick columns to trace several lineages at once
            h('div',{style:{display:'flex',alignItems:'center',gap:8,marginBottom:6}},
              h('span',{className:'muted',style:{flex:1}},selColCount?(selColCount+' column'+(selColCount!==1?'s':'')+' highlighted'):'Tick columns to trace lineage'),
              linShown.length?h('button',{className:'btn',style:{padding:'3px 8px',minHeight:0,fontSize:10},onClick:function(){setSelCols(function(p){var c=Object.assign({},p);linShown.forEach(function(f){c[colKey(d.key,f.name)]={dsKey:d.key,field:f.name};});return c;});}},'✓ Select shown'):null,
              selColCount?h('button',{className:'btn',style:{padding:'3px 8px',minHeight:0,fontSize:10},onClick:clearSelCols},'Clear'):null),
            h('div',{className:'box',style:{maxHeight:240,overflowY:'auto'}},
              fs.length?fs.map(function(f,i){
                var lin=hasColLineage(d.key,f.name);var on=isSelCol(d.key,f.name);
                return h('div',{key:i,className:'field-row',style:{padding:'3px 4px',borderRadius:4,display:'flex',alignItems:'center',gap:6,background:on?'rgba(255,159,67,0.10)':'transparent'},
                  title:lin?'Tick to highlight; click name for transformation detail':null},
                  lin?h('input',{type:'checkbox',className:'ns-check',checked:on,onChange:function(){toggleSelCol(d.key,f.name);}}):h('span',{style:{width:14,flexShrink:0}}),
                  h('span',{className:'fn',style:{flex:1,cursor:lin?'pointer':'default',color:on?'var(--orange)':null},onClick:lin?function(){setSelected({kind:'dataset',key:d.key});setSelectedCol({dsKey:d.key,field:f.name});openColDetail(d.key,f.name);}:null},lin?'⚡ ':'',f.name),
                  h('span',{className:'ft'},f.type));
              }):h('div',{className:'muted'},'No columns match “'+fq+'”')),
            d.schemaFields.length>12?h('button',{className:'btn',style:{marginTop:6,width:'100%',justifyContent:'center'},onClick:function(){toggleFull('d:'+d.key);}},fullCols['d:'+d.key]?'▲ Show first 12 on node':('▼ Show all '+d.schemaFields.length+' on node')):null);
        })():h('div',{className:'muted'},'No schema facet'),
        h('div',{className:'sec-label'},'Produced by'),
        Object.keys(d.producedByJobs).length?Object.keys(d.producedByJobs).map(function(jk){return h('div',{key:jk,className:'list-item',onClick:function(){setSelected({kind:'job',key:jk});}},jk.split('::')[1]||jk);}):h('div',{className:'muted'},'—'),
        h('div',{className:'sec-label'},'Consumed by'),
        Object.keys(d.consumedByJobs).length?Object.keys(d.consumedByJobs).map(function(jk){return h('div',{key:jk,className:'list-item',onClick:function(){setSelected({kind:'job',key:jk});}},jk.split('::')[1]||jk);}):h('div',{className:'muted'},'—')
      );
    }
    var j=selNode;
    var jf=j.facets||{};
    var facetKeys=Object.keys(jf).filter(function(k){return k[0]!=='_';});
    var jsql=jf.sql&&(jf.sql.query||jf.sql.sql);
    var jdoc=jf.documentation&&(jf.documentation.description||jf.documentation.contentText);
    return h(React.Fragment,null,
      h('div',{style:{display:'flex',alignItems:'center',gap:6}},h('span',{className:'sw',style:{background:'var(--purple)',borderRadius:6}}),h('span',{style:{color:'var(--t0)',fontSize:12}},j.name)),
      h('div',{className:'muted',style:{marginTop:2}},j.namespace),
      h('div',{style:{display:'flex',gap:6,marginTop:8,flexWrap:'wrap'}},
        h('button',{className:'btn',onClick:function(){startImpact('down','j:'+j.key);}},'⬇ Impact'),
        h('button',{className:'btn',onClick:function(){startImpact('up','j:'+j.key);}},'⬆ Root cause')),
      h('div',{style:{marginTop:8}},h('button',{className:'btn',onClick:function(){setModal({title:j.key+' · job facets',body:JSON.stringify(jf,null,2)});}},'{ } View facets'+(facetKeys.length?(' ('+facetKeys.length+')'):''))),
      h('div',{className:'box',style:{marginTop:10}},
        h('div',{className:'kv'},h('span',{className:'k'},'Lineage'),h('span',{className:'v',style:{color:j.runs.length?'var(--blue)':'var(--green)'}},j.runs.length?'Runtime':'Design-time (static)')),
        h('div',{className:'kv'},h('span',{className:'k'},'Latest event'),h('span',{className:'v'},j.latestEventType||'—')),
        h('div',{className:'kv'},h('span',{className:'k'},'Runs'),h('span',{className:'v'},j.runs.length)),
        h('div',{className:'kv'},h('span',{className:'k'},'Inputs'),h('span',{className:'v'},Object.keys(j.inputs).length)),
        h('div',{className:'kv'},h('span',{className:'k'},'Outputs'),h('span',{className:'v'},Object.keys(j.outputs).length))),
      // §Job facets — surface the most useful ones inline; the button above shows raw JSON.
      facetKeys.length?h(React.Fragment,null,
        h('div',{className:'sec-label'},'Facets'),
        h('div',null,facetKeys.map(function(fk,i){return h('span',{key:i,className:'tag-chip'},fk);}))):null,
      jdoc?h(React.Fragment,null,h('div',{className:'sec-label'},'Documentation'),h('div',{className:'box',style:{fontSize:11,color:'var(--t1)',lineHeight:1.5}},jdoc)):null,
      jsql?h(React.Fragment,null,h('div',{className:'sec-label'},'SQL'),h('div',{className:'box'},h('pre',{style:{whiteSpace:'pre-wrap',fontSize:10,color:'var(--t1)',margin:0}},jsql))):null,
      j.sourceCode&&h(React.Fragment,null,h('div',{className:'sec-label'},'Source ('+(j.sourceCode.language||'')+')'),h('div',{className:'box'},h('pre',{style:{whiteSpace:'pre-wrap',fontSize:10,color:'var(--t1)',margin:0}},j.sourceCode.sourceCode))),
      h('div',{className:'sec-label'},'Inputs'),Object.keys(j.inputs).map(function(k){return h('div',{key:k,className:'list-item',onClick:function(){setSelected({kind:'dataset',key:k});}},k);}),
      h('div',{className:'sec-label'},'Outputs'),Object.keys(j.outputs).map(function(k){return h('div',{key:k,className:'list-item',onClick:function(){setSelected({kind:'dataset',key:k});}},k);})
    );
  }

  function renderColumns(){
    if(!selNode||selected.kind!=='dataset')return h('div',{className:'muted'},'Select a dataset to see its column lineage.');
    var d=selNode;var byOut={};
    model.colEdges.forEach(function(ce){if(ce.toDs===d.key){(byOut[ce.toField]||(byOut[ce.toField]=[])).push(ce);}});
    var keys=Object.keys(byOut);
    if(!keys.length)return h('div',{className:'muted'},'No column lineage facet for this dataset.');
    var isColActive=function(outF){return selectedCol&&selectedCol.dsKey===d.key&&selectedCol.field===outF;};
    return h(React.Fragment,null,
      h('div',{style:{color:'var(--t0)',fontSize:12,marginBottom:2}},d.name),
      h('div',{className:'muted',style:{marginBottom:8}},'Click a column to highlight lineage'),
      keys.map(function(outF){
        var srcs=byOut[outF];var tx=srcs.find(function(s){return s.transformation;});
        var active=isColActive(outF);
        return h('div',{key:outF,className:'col-item'+(tx?' tx':'')+(active?' col-active':''),style:{cursor:'pointer'},onClick:function(){
          if(active){setSelectedCol(null);}else{setSelectedCol({dsKey:d.key,field:outF});}
        }},
          h('div',{className:'col-out'+(tx?' tx':''),style:active?{fontWeight:700,fontSize:12}:{}},
            active?'⚡ ':'',outF,
            h('span',{style:{float:'right',color:active?'var(--orange)':'var(--t3)',fontSize:10}},active?'▾':'›')),
          srcs.map(function(s,i){return h('div',{key:i,className:'col-src',style:active?{color:'var(--t1)'}:{}},
            '← '+(s.fromDs.split('::')[1]||s.fromDs)+'.'+s.fromField+(s.transformation?'  ['+s.transformation+']':''));}),
          active&&h('div',{className:'col-tx-detail'},
            srcs.map(function(s,si){
              return h('div',{key:si,style:{marginBottom:si<srcs.length-1?10:0}},
                h('div',{style:{color:'var(--t0)',fontWeight:600,fontSize:11,marginBottom:4}},(s.fromDs.split('::')[1]||s.fromDs)+'.'+s.fromField),
                (s.transformationType||s.transformationSubtype)&&h('div',{style:{marginBottom:4,display:'flex',gap:6}},
                  s.transformationType&&h('span',{className:'sev med'},s.transformationType),
                  s.transformationSubtype&&h('span',{className:'sev med'},s.transformationSubtype)),
                s.transformation&&h('div',{style:{padding:'6px 8px',background:'var(--bg0)',borderRadius:4,fontSize:11,color:'var(--orange)',whiteSpace:'pre-wrap',fontFamily:'monospace',border:'1px solid rgba(255,159,67,0.2)'}},s.transformation),
                s.masking&&h('div',{style:{marginTop:4,color:'var(--red)',fontSize:10}},'⚠ masking applied'),
                !s.transformation&&!s.transformationType&&h('div',{className:'muted',style:{marginTop:2}},'Direct copy (no transformation)'));
            }))
        );
      })
    );
  }

  function renderJobs(){
    var ks=Object.keys(model.jobs);
    if(!ks.length)return h('div',{className:'muted'},'No jobs.');
    return ks.map(function(k){var j=model.jobs[k];return h('div',{key:k,className:'list-item',onClick:function(){setSelected({kind:'job',key:k});setTab('DETAILS');}},
      h('div',{style:{color:'var(--t0)'}},j.name),
      h('div',{className:'muted'},j.namespace+' · '+Object.keys(j.inputs).length+' in / '+Object.keys(j.outputs).length+' out'));});
  }

  function renderIssues(){
    if(!model.issues.length)return h('div',{style:{textAlign:'center',padding:20}},h('div',{style:{fontSize:28}},'✓'),h('div',{style:{color:'var(--green)',marginTop:8}},'No issues found'));
    return model.issues.map(function(is,i){var sev=is.severity==='high'?'high':'med';
      return h('div',{key:i,className:'issue'+(sev==='high'?' err':'')},
        h('div',{className:'it'},h('span',{className:'sev '+sev},sev==='high'?'HIGH':'MED'),is.reason),
        is.file&&h('div',{className:'id'},is.file));});
  }

  function renderNamespaces(){
    var shown=model.namespaces.filter(function(n){return !hiddenNs[n];}).length;
    return h(React.Fragment,null,
      h('div',{style:{display:'flex',alignItems:'center',gap:8,marginBottom:8}},
        h('span',{className:'muted',style:{flex:1}},shown+' / '+model.namespaces.length+' shown'),
        h('button',{className:'btn',style:{padding:'3px 10px',minHeight:0,fontSize:10},onClick:function(){setHiddenNs({});}},'All'),
        h('button',{className:'btn',style:{padding:'3px 10px',minHeight:0,fontSize:10},onClick:function(){var c={};model.namespaces.forEach(function(n){c[n]=1;});setHiddenNs(c);}},'None')),
      h('div',{className:'muted',style:{marginBottom:8}},'Toggle a namespace to show or hide it on the canvas'),
      model.namespaces.map(nsRow));
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
})();
</script>
