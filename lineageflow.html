        job:{namespace:job.namespace,name:job.name,facets:jobFacets},
        inputs:inputs,outputs:outputs};
    });
    return{events:events,columnLineageReport:report,stats:{events:events.length,jobs:jobOrder.length,targets:Object.keys(targetSet).length,columns:report.length}};
  }

  // Synthesize a readable INSERT…SELECT per output (concatenated for multi-output
  // jobs) when no explicit table transformation logic was provided.
  function buildSql(job){
    var from=job.inputOrder.map(function(k){return job.inputs[k].name;}).join(', ');
    return job.outputOrder.map(function(ok){
      var out=job.outputs[ok];
      var sel=out.fieldOrder.map(function(c){
        var srcs=(out.cl[c]&&out.cl[c].inputFields)||[];
        var expr=srcs.map(function(f){var d=(f.transformations&&f.transformations[0]&&f.transformations[0].description)||'';return d||(f.name.split('.').pop()+'.'+f.field);}).join(', ')||c;
        return '  '+expr+' AS '+c;
      }).join(',\n');
      return 'INSERT INTO '+out.name+' (\n'+out.fieldOrder.map(function(c){return '  '+c;}).join(',\n')+'\n)\nSELECT\n'+sel+'\nFROM '+from+';';
    }).join('\n\n');
  }

  // §10 Validate generated events before export. Returns issues shaped like
  // LineageEngine issues ({severity:'high'|'med',reason}) so they merge into the
  // model's Issues panel.
  function validateEvents(events,opts){
    var issues=[];
    if(!Array.isArray(events)||!events.length){issues.push({severity:'high',reason:'No OpenLineage events were generated.'});return issues;}
    events.forEach(function(ev,i){
      var w=' (event '+(i+1)+')';
      var outNames={};// per-event: a dataset produced by multiple jobs/runs is valid, not a duplicate
      // Static JobEvent (design-time) has no run/eventType; RunEvent (runtime) has both.
      var isRunEvent=(ev.eventType!=null||ev.run!=null);
      var req=isRunEvent?['eventType','eventTime','producer','run','job']:['eventTime','producer','job'];
      req.forEach(function(k){if(ev[k]==null)issues.push({severity:'high',reason:'Missing required attribute "'+k+'"'+w});});
      if(isRunEvent&&ev.run&&!ev.run.runId)issues.push({severity:'high',reason:'Run event missing run.runId'+w});
      if(ev.job&&(!ev.job.namespace||!ev.job.name))issues.push({severity:'high',reason:'Job missing namespace/name'+w});
      if(!Array.isArray(ev.inputs)||!ev.inputs.length)issues.push({severity:'med',reason:'Event has no inputs'+w});
      if(!Array.isArray(ev.outputs)||!ev.outputs.length){issues.push({severity:'high',reason:'Event has no outputs'+w});return;}
      var inSet={};(ev.inputs||[]).forEach(function(d){if(!d||!d.namespace||!d.name)issues.push({severity:'med',reason:'Input dataset missing namespace/name'+w});else inSet[d.namespace+'::'+d.name]=1;});
      ev.outputs.forEach(function(d){
        if(!d||!d.namespace||!d.name){issues.push({severity:'high',reason:'Output dataset missing namespace/name'+w});return;}
        var nm=d.namespace+'::'+d.name;if(outNames[nm])issues.push({severity:'med',reason:'Duplicate output dataset "'+d.name+'"'+w});outNames[nm]=1;
        var cl=d.facets&&d.facets.columnLineage&&d.facets.columnLineage.fields;
        if(cl)Object.keys(cl).forEach(function(fld){(cl[fld].inputFields||[]).forEach(function(inp){if(!inSet[inp.namespace+'::'+inp.name])issues.push({severity:'med',reason:'Broken lineage: column "'+fld+'" references input "'+inp.name+'" not in inputs'+w});});});
      });
    });
    try{JSON.stringify(events);}catch(e){issues.push({severity:'high',reason:'Events are not valid JSON: '+(e.message||e)});}
    return issues;
  }

  // ---- export helpers ----
  // CSV formula-injection guard (CWE-1236): dataset/column names, transformation
  // text and raw cell values are untrusted. A field beginning with = + - @ (or a
  // tab/CR) is treated as a formula by Excel/Sheets, so prefix a single quote to
  // neutralize it. Plain (possibly negative) numbers are left intact.
  function csvCell(v){
    v=v==null?'':String(v);
    if(/^[=+\-@\t\r]/.test(v)&&!/^-?\d+(\.\d+)?$/.test(v))v="'"+v;
    return /[",\n\r\t]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
  }
  function gapsToCSV(gaps){
    var head=['Row','Severity','Field','Current Value','Expected Value','Validation Rule','Message','Recommendation'];
    var lines=[head.join(',')];
    gaps.forEach(function(g){lines.push([g.row,g.severity,g.field,g.current,g.expected,g.rule,g.message,g.recommendation].map(csvCell).join(','));});
    return lines.join('\n');
  }
  function columnLineageToCSV(report){
    var head=['Process','Lineage Type','Target Dataset','Target Column','Source Dataset','Source Column','Transformation','Category','Type','Subtype'];
    var lines=[head.join(',')];
    report.forEach(function(r){lines.push([r.process||'',r.lineageType||'',r.targetDataset,r.targetColumn,r.sourceDataset,r.sourceColumn,r.transformation,r.category,r.type,r.subtype].map(csvCell).join(','));});
    return lines.join('\n');
  }

  var G=(typeof window!=='undefined')?window:globalThis;
  G.MappingEngine={FIELDS:FIELDS,PROCESS_FIELDS:PROCESS_FIELDS,TEMPLATES:TEMPLATES,validateTemplate:validateTemplate,validateRows:validateRows,
    classifyTransformation:classifyTransformation,classifyColumn:classifyColumn,generateEvents:generateEvents,validateEvents:validateEvents,
    detectCycles:detectCycles,nsFor:nsFor,nameFor:nameFor,techNs:techNs,uuidFrom:uuidFrom,
    gapsToCSV:gapsToCSV,columnLineageToCSV:columnLineageToCSV,normKey:normKey,PRODUCER:PRODUCER,
    TEMPLATE_DOC:TEMPLATE_DOC,DATA_TYPES:DATA_TYPES,MAPPING_TYPES:MAPPING_TYPES,
    LINEAGE_TYPES:LINEAGE_TYPES,BOOL_VALUES:BOOL_VALUES,OBJECT_TYPES:OBJECT_TYPES,ASSET_PREFIXES:ASSET_PREFIXES};
})();
/* MAPPING_ENGINE_END */
</script>

<script>
/* LF_STORE_START — IndexedDB persistence for loaded models + saved views.
 * Browser-only (not part of the pure engine). Models are cached as raw
 * OpenLineage events (JSON-serializable) and rebuilt via LineageEngine on
 * load; views persist the UI state needed to restore an exploration. */
(function(){
  var DB='lineageflow',VER=1,MODELS='models',VIEWS='views';
  function open(){
    return new Promise(function(res,rej){
      if(!('indexedDB'in window))return rej(new Error('IndexedDB unavailable'));
      var rq=indexedDB.open(DB,VER);
      rq.onupgradeneeded=function(e){
        var db=e.target.result;
        if(!db.objectStoreNames.contains(MODELS))db.createObjectStore(MODELS,{keyPath:'id'});
        if(!db.objectStoreNames.contains(VIEWS))db.createObjectStore(VIEWS,{keyPath:'id'});
      };
      rq.onsuccess=function(){res(rq.result);};
      rq.onerror=function(){rej(rq.error);};
    });
  }
  function tx(store,mode,fn){
    return open().then(function(db){
      return new Promise(function(res,rej){
        var t=db.transaction(store,mode),s=t.objectStore(store),out;
        var r=fn(s);if(r)r.onsuccess=function(){out=r.result;};
        t.oncomplete=function(){db.close();res(out);};
        t.onerror=function(){db.close();rej(t.error);};
      });
    });
  }
  function all(store){
    return open().then(function(db){
      return new Promise(function(res,rej){
        var t=db.transaction(store,'readonly'),r=t.objectStore(store).getAll();
        r.onsuccess=function(){db.close();res(r.result||[]);};
        r.onerror=function(){db.close();rej(r.error);};
      });
    });
  }
  function hash(s){var h=0x811c9dc5;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=(h*0x01000193)>>>0;}return ('00000000'+h.toString(16)).slice(-8);}
  var G=(typeof window!=='undefined')?window:globalThis;
  G.LFStore={
    available:('indexedDB'in window),
    hashEvents:function(events){try{return hash(JSON.stringify(events).slice(0,200000));}catch(e){return 'x'+Date.now();}},
    putModel:function(rec){rec.savedAt=Date.now();return tx(MODELS,'readwrite',function(s){return s.put(rec);}).then(function(){return rec;});},
    getModel:function(id){return tx(MODELS,'readonly',function(s){return s.get(id);});},
    listModels:function(){return all(MODELS).then(function(a){return a.sort(function(x,y){return y.savedAt-x.savedAt;});});},
    deleteModel:function(id){return tx(MODELS,'readwrite',function(s){s.delete(id);});},
    pruneModels:function(keep){return this.listModels().then(function(a){var del=a.slice(keep||12);return Promise.all(del.map(function(m){return tx(MODELS,'readwrite',function(s){s.delete(m.id);});}));});},
    putView:function(rec){rec.savedAt=Date.now();if(!rec.id)rec.id='v_'+Date.now().toString(36);return tx(VIEWS,'readwrite',function(s){return s.put(rec);}).then(function(){return rec;});},
    getView:function(id){return tx(VIEWS,'readonly',function(s){return s.get(id);});},
    listViews:function(){return all(VIEWS).then(function(a){return a.sort(function(x,y){return y.savedAt-x.savedAt;});});},
    deleteView:function(id){return tx(VIEWS,'readwrite',function(s){s.delete(id);});}
  };
})();
/* LF_STORE_END */
</script>

(function(){

function normPath(p){return (p||'').replace(/\\/g,'/').replace(/^\.\//,'');}

  if(!paths.length)return '';
  var first=paths[0].split('/');
  if(first.length<2)return '';
  var pre=first[0]+'/';
  return paths.every(function(p){return p.indexOf(pre)===0;})?pre:'';

/* §13 GitLab OAuth — Authorization Code flow with PKCE (RFC 7636).
   LineageFlow has no server, so it must be a *public* client: no client secret
   anywhere, PKCE instead. That imposes three hard requirements, all checked by
   available() below and surfaced in the UI rather than failing at redirect time:
     1. The page must be served over http(s) — a file:// page cannot be a
        registered redirect URI, so PAT stays the only option when run from disk.
     2. A secure context, because PKCE needs crypto.subtle for the S256 challenge.
     3. An OAuth Application registered on the GitLab instance (Settings ->
        Applications) with Confidential OFF and this page's URL as the redirect.
   Tokens live in sessionStorage: they die with the tab, and never touch
   localStorage where they would outlive the session. Only the (non-secret)
   Application ID is persisted across sessions. */
var GLOAuth=(function(){
  var TOK='lfGitLabToken',PEND='lfGitLabPkce',APP='lfGitLabApp';
  // GitLab's REST commit API needs `api`; `write_repository` is git-over-HTTP only.
  var SCOPE_READ='read_api',SCOPE_WRITE='api';
  function b64url(buf){var by=new Uint8Array(buf),s='';for(var i=0;i<by.length;i++)s+=String.fromCharCode(by[i]);

    var info=E.parseRepoUrl(repoUrl);
    if(!info){setErr('Invalid repo URL. Use https://github.com/owner/repo or https://gitlab.example.com/group/repo');return;}
    setRepoModal(false);setLoading(true);setErr(null);setProgress('Connecting to '+info.host+'…');
    try{
      var hdr=await authHeaders(info);
      var branch=repoBranch.trim()||info.branch;
      var jsonPaths=[];
      if(info.provider==='github'){
        if(!branch)branch=await ghDefaultBranch(info,hdr);
        setProgress('Fetching file tree ('+branch+')…');
        var tr=await fetch('https://api.github.com/repos/'+info.owner+'/'+info.repo+'/git/trees/'+encodeURIComponent(branch)+'?recursive=1',{headers:hdr});
        if(!tr.ok)throw new Error('GitHub tree '+tr.status+(tr.status===403?' (rate limited — add a token)':''));
        var td=await tr.json();
        (td.tree||[]).forEach(function(n){if(n.type==='blob'&&/\.json$/i.test(n.path))jsonPaths.push(n.path);});
      }else{
        if(!branch)branch=await glDefaultBranch(info,hdr);
        setProgress('Fetching file tree ('+branch+')…');
        var page=1,guard=0;
        while(guard++<60){
          var tg=await fetch('https://'+info.host+'/api/v4/projects/'+encodeURIComponent(info.path)+'/repository/tree?recursive=true&per_page=100&page='+page+'&ref='+encodeURIComponent(branch),{headers:hdr});
          if(!tg.ok)throw new Error('GitLab tree '+tg.status);
          var arr=await tg.json();
          arr.forEach(function(n){if(n.type==='blob'&&/\.json$/i.test(n.path))jsonPaths.push(n.path);});
          var next=tg.headers.get('x-next-page');if(!next)break;page=parseInt(next,10);
        }
      }
      if(!jsonPaths.length){setLoading(false);setProgress('');setErr('No .json files found in '+info.path+' (branch '+branch+')');return;}
      var allEvents=[],allIssues=[];
      for(var i=0;i<jsonPaths.length;i++){
        setProgress('Reading '+(i+1)+'/'+jsonPaths.length+': '+jsonPaths[i]);
        try{
          var text;
          if(info.provider==='github'){
            var cr=await fetch('https://api.github.com/repos/'+info.owner+'/'+info.repo+'/contents/'+jsonPaths[i].split('/').map(encodeURIComponent).join('/')+'?ref='+encodeURIComponent(branch),{headers:hdr});
            if(!cr.ok)throw new Error('HTTP '+cr.status);
            var cd=await cr.json();text=cd.content?b64utf8(cd.content):'';
          }else{
            var gr=await fetch('https://'+info.host+'/api/v4/projects/'+encodeURIComponent(info.path)+'/repository/files/'+encodeURIComponent(jsonPaths[i])+'/raw?ref='+encodeURIComponent(branch),{headers:hdr});
            if(!gr.ok)throw new Error('HTTP '+gr.status);
            text=await gr.text();
          }
          var pr=E.parseFileContent(text,jsonPaths[i]);
          allEvents=allEvents.concat(pr.events);allIssues=allIssues.concat(pr.issues);
        }catch(e){allIssues.push({file:jsonPaths[i],severity:'high',reason:'Fetch error: '+(e.message||e)});}
      }
      loadEvents(allEvents,allIssues,info.path);
    }catch(e){setErr('Failed to load repo: '+(e.message||e));}
    setLoading(false);setProgress('');
  }

  async function readFileObjs(fileObjs){

      }catch(e){allIssues.push({file:jsonFiles[i].name,severity:'high',reason:'Read error: '+(e.message||e)});}

  async function ingestSpecFile(file){
    if(!file)return;
    if(typeof XLSX==='undefined'){setErr('SheetJS (xlsx) failed to load — check your network/CDN.');return;}
    setMapBusy(true);setMapProg('Reading '+file.name+'…');setMapVal(null);setMapGen(null);
    mlog('Upload: '+file.name+' ('+Math.round(file.size/1024)+' KB)');
    try{
      var buf=await file.arrayBuffer();
      var wb=XLSX.read(buf,{type:'array',cellStyles:true});
      var sheets=[];
      for(var si=0;si<wb.SheetNames.length;si++){
        var nm=wb.SheetNames[si];setMapProg('Parsing worksheet '+(si+1)+'/'+wb.SheetNames.length+': '+nm);await tick();
        var ws=wb.Sheets[nm];
        var aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:'',blankrows:false});
        var headers=aoa.length?aoa[0]:[];
        var rows=aoa.slice(1);
        var hiddenCols=[];(ws['!cols']||[]).forEach(function(c,i){if(c&&c.hidden)hiddenCols.push(i);});
        sheets.push({name:nm,headers:headers,rows:rows,meta:{sheetName:nm,merges:ws['!merges']||[],hiddenCols:hiddenCols}});
        mlog('Worksheet "'+nm+'": '+headers.length+' columns, '+rows.length+' data rows');
      }
      var sel={};sheets.forEach(function(s){sel[s.name]=1;});
      setMapSheets(sheets);setMapSel(sel);setMapFile(file.name);setMapStep('validate');
    }catch(ex){setErr('Failed to read workbook: '+(ex.message||ex));mlog('ERROR reading workbook: '+(ex.message||ex),'error');}
    setMapBusy(false);setMapProg('');
    if(mapInputRef.current)mapInputRef.current.value='';
  }

  // §3+§4 Validate every selected worksheet. Chunked per sheet with await tick()
  // so a 50-sheet / 50k-row workbook never freezes the UI.
  async function runValidate(){
    setMapBusy(true);setMapGen(null);mlog('Validation started');
    var perSheet=[],allGaps=[],allValid=[],templateFails=[],tot={totalRows:0,validRows:0,invalidRows:0,errors:0,warnings:0};
    var sel=mapSheets.filter(function(s){return mapSel[s.name];});
    for(var i=0;i<sel.length;i++){
      var sh=sel[i];setMapProg('Validating '+(i+1)+'/'+sel.length+': '+sh.name);await tick();
      var tv=ME.validateTemplate(sh.headers,{meta:sh.meta});
      if(!tv.ok){
        templateFails.push({sheet:sh.name,missing:tv.missing,duplicates:tv.duplicates.map(function(d){return d.label;}),
          chosen:tv.templateLabel,candidates:tv.candidates||[]});
        mlog('Template FAIL on "'+sh.name+'": missing ['+tv.missing.join(', ')+']','error');
        perSheet.push({sheet:sh.name,template:tv,rowResult:null});
        continue;
      }
      // structural + header warnings surfaced as informational gaps
      tv.structural.forEach(function(s){allGaps.push({row:0,severity:'WARNING',field:sh.name,current:s.count,expected:'0',rule:s.kind,message:sh.name+': '+s.count+' '+(s.kind==='mergedCells'?'merged cell range(s)':'hidden column(s)')+' detected.',recommendation:'Unmerge/unhide before parsing to avoid misaligned data.'});});
      tv.caseMismatches.forEach(function(c){allGaps.push({row:1,severity:'WARNING',field:c.header,current:c.header,expected:c.expected,rule:'header-case',message:'Header "'+c.header+'" differs from canonical "'+c.expected+'".',recommendation:'Rename header to the canonical label.'});});
      tv.unexpected.forEach(function(u){allGaps.push({row:1,severity:'WARNING',field:u.header,current:u.header,expected:'known column','rule':'unexpected-column',message:'Unexpected column "'+u.header+'" ignored.',recommendation:'Remove or map this column.'});});
      var rr=ME.validateRows(sh.rows,tv.map,{template:tv.template});
      // tag gaps with worksheet for multi-sheet reports
      rr.gaps.forEach(function(g){g.sheet=sh.name;});
      allGaps=allGaps.concat(rr.gaps);allValid=allValid.concat(rr.valid);
      ['totalRows','validRows','invalidRows','errors','warnings'].forEach(function(k){tot[k]+=rr.summary[k];});
      perSheet.push({sheet:sh.name,template:tv,rowResult:rr});
      mlog('Validated "'+sh.name+'" ['+tv.templateLabel+']: '+rr.summary.validRows+' valid, '+rr.summary.invalidRows+' invalid, '+rr.summary.errors+' errors, '+rr.summary.warnings+' warnings');
    }
    // recompute aggregate error/warning counts (structural/header gaps included)
    tot.errors=allGaps.filter(function(g){return g.severity==='ERROR';}).length;
    tot.warnings=allGaps.filter(function(g){return g.severity==='WARNING';}).length;
    setMapVal({perSheet:perSheet,gaps:allGaps,valid:allValid,summary:tot,templateFails:templateFails});
    setMapStep('generate');setMapBusy(false);setMapProg('');
    mlog('Validation complete: '+tot.validRows+' valid rows across '+sel.length+' worksheet(s)');
  }

  // §8 Generate design-time OpenLineage events from valid rows, validate them,
  // then hand off to the existing LineageEngine visualization via loadEvents.
  async function runGenerate(){
    if(!mapVal||!mapVal.valid.length){setErr('No valid mapping rows to generate lineage from.');return;}
    setMapBusy(true);setMapProg('Generating OpenLineage design-time events…');await tick();
    mlog('Event generation started ('+mapVal.valid.length+' rows)');
    try{
      var gen=ME.generateEvents(mapVal.valid,{eventTime:new Date().toISOString()});
      var eventIssues=ME.validateEvents(gen.events);
      setMapGen({events:gen.events,columnLineageReport:gen.columnLineageReport,eventIssues:eventIssues});
      mlog('Generated '+gen.events.length+' events, '+gen.columnLineageReport.length+' column links; '+eventIssues.length+' event issue(s)');
      // Feed unresolved validation gaps + event issues into the model Issues panel.
      var issues=eventIssues.slice();
      if(mapVal.summary.invalidRows)issues.push({severity:'high',reason:mapVal.summary.invalidRows+' mapping row(s) excluded due to validation errors — see gap report.'});
      loadEvents(gen.events,issues,mapFile||'mapping.xlsx');
      setMapOpen(false);
    }catch(ex){setErr('Event generation failed: '+(ex.message||ex));mlog('ERROR generating events: '+(ex.message||ex),'error');}
    setMapBusy(false);setMapProg('');
  }

  // Store-only (no-compression) ZIP writer — dependency-free bundle of all outputs.
  function crc32(buf){var c,t=crc32.t;if(!t){t=crc32.t=[];for(var n=0;n<256;n++){c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}}c=0xFFFFFFFF;for(var i=0;i<buf.length;i++)c=t[(c^buf[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
  function makeZip(files){
    var enc=new TextEncoder(),chunks=[],central=[],offset=0;
    function u16(n){return [n&0xFF,(n>>8)&0xFF];}function u32(n){return [n&0xFF,(n>>8)&0xFF,(n>>16)&0xFF,(n>>>24)&0xFF];}
    files.forEach(function(f){
      var data=enc.encode(f.content),crc=crc32(data),name=enc.encode(f.name);
      var local=[].concat(u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0));
      chunks.push(new Uint8Array(local),name,data);
      var cen=[].concat(u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset));
      central.push(new Uint8Array(cen),name);
      offset+=local.length+name.length+data.length;
    });
    var cenStart=offset,cenSize=0;central.forEach(function(c){cenSize+=c.length;});
    var end=new Uint8Array([].concat(u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(cenSize),u32(cenStart),u16(0)));
    return new Blob(chunks.concat(central,[end]),{type:'application/zip'});
  }

  // §11 Authoring template (.xlsx). Written as raw OOXML on top of makeZip rather
  // than through SheetJS: the community build silently drops dataValidations on
  // write, and the per-column input messages are the whole point of the template.
  // Every column carries a prompt (description + example); enumerable columns also
  // get a dropdown backed by the Lists sheet, so headers and values stay importable.
  var TPL_ROWS=500;// rows covered by validation — generous, but keeps the file small
  function xmlEsc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function colRef(i){var s='',n=i+1;while(n>0){var m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26);}return s;}
  function xlCell(ref,val,style){
    var s=style?(' s="'+style+'"'):'';
    if(val==null||val==='')return '<c r="'+ref+'"'+s+'/>';
    return '<c r="'+ref+'"'+s+' t="inlineStr"><is><t xml:space="preserve">'+xmlEsc(val)+'</t></is></c>';
  }
  // Excel caps promptTitle at 32 chars and prompt at 255; over-long values make the
  // whole file unreadable, so clamp here rather than trusting the doc strings.
  function xlValidation(sqref,title,prompt,listName){
    var t=listName?'list':'none';
    return '<dataValidation type="'+t+'" allowBlank="1" showInputMessage="1"'+
      (listName?' showErrorMessage="1" errorStyle="warning" errorTitle="Unexpected value" error="That value is not in the list. Pick one from the dropdown, or keep yours if the source really uses it."':'')+
      ' promptTitle="'+xmlEsc(String(title).slice(0,32))+'" prompt="'+xmlEsc(String(prompt).slice(0,255))+'" sqref="'+sqref+'">'+
      (listName?('<formula1>'+listName+'</formula1>'):'')+'</dataValidation>';
  }
  function xlSheet(rows,widths,validations,freezeRows){
    var body=rows.map(function(cells,r){
      return '<row r="'+(r+1)+'">'+cells.map(function(c,i){
        var v=(c&&typeof c==='object')?c.v:c,st=(c&&typeof c==='object')?c.s:0;
        return xlCell(colRef(i)+(r+1),v,st);
      }).join('')+'</row>';
    }).join('');
    var cols=widths&&widths.length?('<cols>'+widths.map(function(w,i){return '<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>';}).join('')+'</cols>'):'';
    var dv=validations&&validations.length?('<dataValidations count="'+validations.length+'">'+validations.join('')+'</dataValidations>'):'';
    var pane=freezeRows?('<pane ySplit="'+freezeRows+'" topLeftCell="A'+(freezeRows+1)+'" activePane="bottomLeft" state="frozen"/>'):'';
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+

  // Header row + example rows + one validation per column, driven by the same
  // FIELDS/PROCESS_FIELDS arrays the importer validates against — so the template
  // can never drift from the parser.
  // `examples` are keyed by field key, not positional — a 27-column template is
  // far too easy to mis-align by hand, and this stays correct if the order moves.
  function xlTemplateSheet(fields,examples){
    var head=fields.map(function(f){return {v:f.label,s:1};});
    var rows=[head].concat(examples.map(function(ex){
      return fields.map(function(f){return {v:(ex[f.key]==null?'':ex[f.key]),s:3};});
    }));
    var dvs=fields.map(function(f,i){
      var doc=ME.TEMPLATE_DOC[f.key]||{},c=colRef(i);
      var prompt=(doc.desc||f.label)+(doc.ex?('\n\nExample: '+doc.ex):'')+
        (f.req?'\n\nRequired header.':'')+(f.val==='error'?' A blank value rejects the row.':f.val==='warn'?' A blank value raises a warning.':'');
      return xlValidation(c+'2:'+c+TPL_ROWS,f.label,prompt,doc.list);
    });
    return xlSheet(rows,fields.map(function(f){return Math.min(34,Math.max(14,f.label.length+6));}),dvs,1);
  }

  // D3 render (rich mode: column-level detail, transformation styling, drag)

    var nodeMap=layout.nodeMap;
    var selId=selected?(selected.kind+':').replace('dataset:','d:').replace('job:','j:')+selected.key:null;
    var connected={};
    if(selId){layout.edges.forEach(function(e){if(e.from===selId||e.to===selId){connected[e.from]=1;connected[e.to]=1;}});}
    // §5 impact/root-cause highlight sets (null when inactive)
    var impSet=impactResult?impactResult.depth:null;
    var impEdges=impactResult?impactResult.edges:null;
    var impMode=impact?impact.mode:null;
    var cvar=function(n,f){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||f;};
    var greenC=cvar('--green','#22c55e'),blueC=cvar('--blue','#4d9fff'),cyanC=cvar('--cyan','#22d3ee');
    // Hoisted theme colours — read once per render, not once per node. On large

    function box(id){return nodeMap[id];}
    function anchorOut(n){return dir==='LR'?[n.x+n.w,n.y+n.h/2]:[n.x+n.w/2,n.y+n.h];}
    function anchorIn(n){return dir==='LR'?[n.x,n.y+n.h/2]:[n.x+n.w/2,n.y];}
    function path(a,b){
      if(dir==='LR'){var mx=(a[0]+b[0])/2;return 'M'+a[0]+','+a[1]+'C'+mx+','+a[1]+' '+mx+','+b[1]+' '+b[0]+','+b[1];}
      var my=(a[1]+b[1])/2;return 'M'+a[0]+','+a[1]+'C'+a[0]+','+my+' '+b[0]+','+my+' '+b[0]+','+b[1];
    }

    // ----- edges (redrawable so drag updates them live) -----

      var cy;
      if(n.expanded){var idx=n.fields.findIndex(function(f){return f.name===fname;});cy=idx>=0?n.y+(n.hdr||HEADER)+idx*ROWH+ROWH/2:n.y+n.h/2;}

    // Render a wrapped label as one text row per line. SVG has no text flow, so

        if(opts){Object.keys(opts).forEach(function(k){t.attr(k,opts[k]);});}
      });
    }
    function drawEdges(){
      eg.selectAll('*').remove();cg.selectAll('*').remove();
      var cv=function(n,f){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||f;};
      var edgeClr=cv('--edge-color','#3a3a44'),accColor=cv('--acc','#9575cd');

      var activeColEdges=colChain?colChain.edgeKeys:{};

      layout.edges.forEach(function(e){
        if(!showCtl.xsys&&e.crossSystem)return;// Graph controls: cross-system edges off
        var a=anchorOut(box(e.from)),b=anchorIn(box(e.to));
        var inImpact=impEdges&&impEdges[e.from+'>'+e.to];
        var dim=impSet&&!inImpact;
        var hot=selId&&(e.from===selId||e.to===selId);
        var stroke=edgeClr,w=1,dash=null,op=1,marker='url(#arr)';
        if(inImpact){stroke=impMode==='up'?blueC:greenC;w=2;marker=impMode==='up'?'url(#arrUp)':'url(#arrDown)';}
        else if(hot){stroke=accColor;w=1.8;marker='url(#arrHot)';}
        // §4 cross-system boundary crossing (when not otherwise emphasized)

        if(e.bypass){dash='5,4';op=Math.min(op,0.7);}// lineage through a hidden job

        if(dash)p.attr('stroke-dasharray',dash);

          var tw=lbl.length*5.4+12;
          eg.append('rect').attr('x',mx-tw/2).attr('y',my-8).attr('width',tw).attr('height',15)
            .attr('rx',7).attr('fill',cv('--bg1','#161b2b')).attr('stroke',stroke)
            .attr('stroke-width',0.8).attr('opacity',0.96);
          eg.append('text').attr('x',mx).attr('y',my+2.5).attr('text-anchor','middle')

      // §8 per-transformation-class visual language for column edges
      var TXST={
        IDENTITY:{color:cv('--t3','#5c5c66'),width:1,dash:null,op:0.55},

        AGGREGATION:{color:'#ff9f43',width:2.8,dash:null,op:0.95},

      }
    }

    // ----- nodes (draggable; column rows open transformation popout) -----
    var ng=g.append('g');
    var useShadow=layout.nodes.length<=120;// soft card shadow only on smaller graphs
    layout.nodes.forEach(function(n){

      if(dimNode)grp.attr('opacity',0.22);

  // An event is exportable when it is a well-formed OpenLineage event: a job
  // object plus an eventType and at least one input/output.
  function validEvents(){return (events||[]).filter(function(ev){return ev&&ev.job&&typeof ev.job==='object'&&(ev.eventType||ev.inputs||ev.outputs);});}
  function safeName(s){return String(s||'event').replace(/[^A-Za-z0-9._-]+/g,'_').slice(0,60)||'event';}
  function dsSchemaFields(d){var s=d&&d.facets&&d.facets.schema&&d.facets.schema.fields;return Array.isArray(s)?s.map(function(f){return f.name;}):[];}
  // Per-job summary capturing the job's inputs and outputs (datasets + columns),
  // lineage kind (design-time JobEvent vs runtime RunEvent), and documentation/SQL.
  function jobSummary(g){
    var ev0=g.events[0]||{};
    var inMap={},outMap={},inputs=[],outputs=[];
    g.events.forEach(function(ev){
      (ev.inputs||[]).forEach(function(d){var k=d.namespace+'::'+d.name;if(!inMap[k]){inMap[k]=1;inputs.push(d);}});
      (ev.outputs||[]).forEach(function(d){var k=d.namespace+'::'+d.name;if(!outMap[k]){outMap[k]=1;outputs.push(d);}});
    });
    function ds(arr){return arr.map(function(d){var o={namespace:d.namespace,name:d.name,fields:dsSchemaFields(d)};var cl=d.facets&&d.facets.columnLineage&&d.facets.columnLineage.fields;if(cl)o.derivedColumns=Object.keys(cl);return o;});}
    var isRun=!!(ev0.eventType||ev0.run);
    var jf=g.job&&g.job.facets||{};
    return{job:{namespace:g.job.namespace,name:g.job.name},
      lineageType:isRun?'runtime':'design-time',eventType:ev0.eventType||null,runId:(ev0.run&&ev0.run.runId)||null,
      producer:ev0.producer||null,eventTime:ev0.eventTime||null,eventCount:g.events.length,
      documentation:(jf.documentation&&jf.documentation.description)||null,sql:(jf.sql&&jf.sql.query)||null,
      inputCount:inputs.length,outputCount:outputs.length,inputs:ds(inputs),outputs:ds(outputs)};
  }
  // Build the ZIP file set: one folder per job (jobs/<job>/) containing its
  // event JSON(s) + a summary.json (inputs/outputs), plus a combined index.
  function eventFiles(evs){
    var files=[{name:'openlineage-events.json',content:JSON.stringify(evs,null,2)}];
    var groups={},order=[];
    evs.forEach(function(ev){
      var jn=((ev.job&&ev.job.namespace)||'')+'::'+((ev.job&&ev.job.name)||'event');
      if(!groups[jn]){groups[jn]={job:ev.job||{},events:[]};order.push(jn);}
      groups[jn].events.push(ev);
    });
    var used={},index=[];
    order.forEach(function(jn){
      var g=groups[jn],base=safeName(g.job.name||'job'),folder=base,n=2;
      while(used[folder])folder=base+'-'+(n++);used[folder]=1;
      var dir='jobs/'+folder+'/';
      g.events.forEach(function(ev,i){
        files.push({name:dir+(g.events.length>1?('event-'+('00'+(i+1)).slice(-2)+'.json'):'event.json'),content:JSON.stringify(ev,null,2)});
      });
      var sum=jobSummary(g);
      files.push({name:dir+'summary.json',content:JSON.stringify(sum,null,2)});
      index.push({job:sum.job.name,namespace:sum.job.namespace,folder:'jobs/'+folder,lineageType:sum.lineageType,inputs:sum.inputCount,outputs:sum.outputCount});
    });
    files.push({name:'jobs/index.json',content:JSON.stringify({jobCount:order.length,jobs:index},null,2)});
    return files;
  }

  function doExportZip(){
    var evs=validEvents();if(!evs.length){setExMsg('No valid events to export.');return;}
    dlBlob(makeZip(eventFiles(evs)),(srcName?safeName(srcName):'lineage')+'-openlineage-events.zip');

  async function doExportFolder(){
    var evs=validEvents();if(!evs.length){setExMsg('No valid events to export.');return;}
    if(!window.showDirectoryPicker){setExMsg('This browser lacks the File System Access API — use Download ZIP instead.');return;}
    setExBusy(true);setExMsg('Choose a destination folder…');
    try{
      var dh=await window.showDirectoryPicker({mode:'readwrite'});
      var files=eventFiles(evs);
      for(var i=0;i<files.length;i++){
        var parts=files[i].name.split('/'),dir=dh;
        for(var p=0;p<parts.length-1;p++)dir=await dir.getDirectoryHandle(parts[p],{create:true});
        var fh=await dir.getFileHandle(parts[parts.length-1],{create:true});
        var w=await fh.createWritable();await w.write(files[i].content);await w.close();
      }
      setExMsg('Wrote '+files.length+' file(s) to “'+dh.name+'”.');
    }catch(e){if(e&&e.name==='AbortError')setExMsg('Cancelled.');else setExMsg('Folder write failed: '+(e.message||e));}
    setExBusy(false);
  }
  async function doExportGitLab(){
    var evs=validEvents();if(!evs.length){setExMsg('No valid events to export.');return;}
    var info=E.parseRepoUrl(exUrl);
    if(!info||info.provider!=='gitlab'){setExMsg('Enter a GitLab repository URL (e.g. https://gitlab.com/group/project).');return;}
    var authH=null;
    if(exAuth==='oauth'){
      var t=await GLOAuth.token(info.host);
      if(t&&t!==glTok)setGlTok(t);
      if(!t){setExMsg('Connect to '+info.host+' with GitLab OAuth first — the session is not connected or has expired.');return;}
      if(!GLOAuth.canWrite(t)){setExMsg('This OAuth session is read-only. Reconnect with write access (the `api` scope) to publish.');return;}
      authH={Authorization:'Bearer '+t.access_token};
    }else{
      if(!exToken){setExMsg('A GitLab personal access token with the `api` scope is required.');return;}
      authH={'PRIVATE-TOKEN':exToken};
    }
    setExBusy(true);setExMsg('Connecting to '+info.host+'…');
    try{
      var branch=exBranch.trim()||info.branch||await glDefaultBranch(info,authH);
      var base=exPath.trim().replace(/^\/+|\/+$/g,'');
      var files=eventFiles(evs);
      var actions=files.map(function(f){return {action:'create',file_path:(base?base+'/':'')+f.name,content:f.content};});
      var url='https://'+info.host+'/api/v4/projects/'+encodeURIComponent(info.path)+'/repository/commits';
      var body={branch:branch,commit_message:exCommit||'Add OpenLineage events',actions:actions};
      setExMsg('Committing '+files.length+' file(s) to '+info.path+' ('+branch+')…');
      var r=await fetch(url,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authH),body:JSON.stringify(body)});
      if(!r.ok){
        var t=await r.text();
        if(r.status===400&&/already exists/i.test(t)){// files present -> update instead
          actions.forEach(function(a){a.action='update';});
          r=await fetch(url,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authH),body:JSON.stringify(body)});
          if(!r.ok)throw new Error('GitLab '+r.status+': '+(await r.text()).slice(0,200));
        }else throw new Error('GitLab '+r.status+': '+t.slice(0,200));
      }
      var cd=await r.json();
      setExMsg('✓ Committed '+files.length+' file(s) — '+(cd.short_id||cd.id||'')+' on '+branch+'.');
    }catch(e){setExMsg('GitLab export failed: '+(e.message||e));}
    setExBusy(false);
  }

  // §11 ETL Mapping Specification modal — upload → worksheet select → validate
  // → gap report → generate → visualize + exports.
  // ---- Gap-report filtering (view-only; exports always cover the full set) ----
  function gapMatches(g,f,except){
    for(var k in GAP_KEYS){
      if(k===except||!f[k])continue;
      if(String(g[GAP_KEYS[k]]||'')!==f[k])return false;
    }
    return true;
  }
  function filterGaps(gaps,f){return gaps.filter(function(g){return gapMatches(g,f);});}
  function gapFacets(f){var n=0;for(var k in GAP_KEYS)if(f[k])n++;return n;}
  // Counts for one facet, computed against the *other* active filters so the
  // numbers reflect what selecting that value would actually show.
  function gapCounts(gaps,f,prop){
    var key=null;for(var k in GAP_KEYS)if(GAP_KEYS[k]===prop)key=k;
    var m={};
    gaps.forEach(function(g){
      if(!gapMatches(g,f,key))return;
      var v=String(g[prop]||'');if(!v)return;
      m[v]=(m[v]||0)+1;
    });
    return Object.keys(m).sort().map(function(v){return {v:v,n:m[v]};});
  }

  // Which group a node falls into at the current level — mirrors computeLayout.
  function groupKeyOf(kind,k){
    if(kind==='dataset'){
      var d=model.datasets[k];
      if(groupBy==='domain')return d.domain||d.namespace;
      if(groupBy==='system')return d.system||E.systemOf(d.namespace);
      return d.namespace;
    }
    var j=model.jobs[k];
    if(groupBy==='domain')return j.domain||j.namespace;
    if(groupBy==='system')return E.systemOf(j.namespace);
    return j.namespace;
  }

    return ks.map(function(k){var j=model.jobs[k];return h('div',{key:k,className:'list-item',onClick:function(){setSelected({kind:'job',key:k});setTab('DETAILS');}},
      h('div',{style:{color:'var(--t0)'}},j.name),
      h('div',{className:'muted'},j.namespace+' · '+Object.keys(j.inputs).length+' in / '+Object.keys(j.outputs).length+' out'));});
  }

  function renderIssues(){
    if(!model.issues.length)return h('div',{style:{textAlign:'center',padding:20}},h('div',{style:{fontSize:28}},'✓'),h('div',{style:{color:'var(--green)',marginTop:8}},'No issues found'));
    return model.issues.map(function(is,i){var sev=is.severity==='high'?'high':'med';
      return h('div',{key:i,className:'issue'+(sev==='high'?' err':'')},
        h('div',{className:'it'},h('span',{className:'sev '+sev},sev==='high'?'HIGH':'MED'),is.reason),
        is.file&&h('div',{className:'id'},is.file));});
  }

  function renderNamespaces(){
    var shown=model.namespaces.filter(function(n){return !hiddenNs[n];}).length;
    return h(React.Fragment,null,
      h('div',{style:{display:'flex',alignItems:'center',gap:8,marginBottom:8}},
        h('span',{className:'muted',style:{flex:1}},shown+' / '+model.namespaces.length+' shown'),
        h('button',{className:'btn',style:{padding:'3px 10px',minHeight:0,fontSize:10},onClick:function(){setHiddenNs({});}},'All'),
        h('button',{className:'btn',style:{padding:'3px 10px',minHeight:0,fontSize:10},onClick:function(){var c={};model.namespaces.forEach(function(n){c[n]=1;});setHiddenNs(c);}},'None')),
      h('div',{className:'muted',style:{marginBottom:8}},'Toggle a namespace to show or hide it on the canvas'),
      model.namespaces.map(nsRow));
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
})();
</script>
</body>
</html>
