<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LineageFlow — OpenLineage Visualizer</title>
<meta name="description" content="Visualize OpenLineage event files as an interactive dataset and job lineage graph with column-level lineage. Single-file, no install.">
<style>
/* Brand palette — Purple #2E1A47, White #FFF, Dusk #7C6992, Sky Blue #B0E0E2,
   Dark Grey #787878, Charcoal #34363B, Dawn #AFABC9, Light Gray #C9C9C9,
   Mild Gray #A8A8A8. `:root` = dark theme; [data-theme="light"] = light theme.
   Semantic red/green kept (not in the brand set) but tuned to the palette. */
/* Indigo SaaS palette. :root = dark theme; [data-theme="light"] = light (default).
   Topbar + status bar keep a fixed dark-navy chrome in both themes (per design). */
:root{--bg0:#0e1220;--bg1:#161b2b;--bg2:#1e2434;--bg3:#272e42;--bg4:#313a52;--hover:#3a4460;--border:#2b3246;--border2:#222839;--t0:#eef1f8;--t1:#c2c8d8;--t2:#9299ad;--t3:#6b7286;--acc:#818cf8;--acc2:#a5b4fc;--accbg:rgba(129,140,248,0.16);--blue:#60a5fa;--purple:#a78bfa;--orange:#fbbf24;--red:#f87171;--cyan:#22d3ee;--pink:#f472b6;--green:#34d399;--node-bg:#171d2e;--modal-overlay:rgba(6,9,18,0.66);--edge-color:#3b425a;--canvas-dot:#232a3d;--topbar-bg:#2e1a47;--topbar-fg:#f1eef8;--topbar-border:#43305f;--topbar-hl:#b0e0e2;--shadow-sm:0 1px 2px rgba(0,0,0,0.3);--shadow-md:0 10px 30px rgba(0,0,0,0.4)}
[data-theme="light"]{--bg0:#f6f8fb;--bg1:#ffffff;--bg2:#f1f3f8;--bg3:#e6e9f1;--bg4:#dbe0ea;--hover:#e2e6ef;--border:#e4e7ee;--border2:#eef1f6;--t0:#1f2430;--t1:#4b5162;--t2:#6b7280;--t3:#9aa1ae;--acc:#2E1A47;--acc2:#4338ca;--accbg:rgba(79,70,229,0.1);--blue:#3b82f6;--purple:#8b5cf6;--orange:#f59e0b;--red:#ef4444;--cyan:#06b6d4;--pink:#ec4899;--green:#10b981;--node-bg:#ffffff;--modal-overlay:rgba(17,24,39,0.28);--edge-color:#c7cdd8;--canvas-dot:#e7eaf0;--topbar-bg:#2e1a47;--topbar-fg:#f1eef8;--topbar-border:#43305f;--topbar-hl:#b0e0e2;--shadow-sm:0 1px 2px rgba(16,24,40,0.06);--shadow-md:0 10px 30px rgba(16,24,40,0.10)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif,'Apple Color Emoji','Segoe UI Emoji','Segoe UI Symbol','Noto Color Emoji';background:var(--bg0);color:var(--t0);height:100vh;height:100dvh;overflow:hidden;transition:background 0.25s,color 0.25s}
/* Keep the monospace identity on canvas data + code, per design. */
.node-label,.node-sub,.field-txt,.field-type,.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.modal pre,.box pre,pre,code{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
#root{height:100%}
.app{display:flex;flex-direction:column;height:100%}
.topbar{min-height:56px;background:var(--topbar-bg);border-bottom:1px solid var(--topbar-border);display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0;z-index:20;transition:background 0.25s}
.topbar .logo-text{color:#fff}
/* Topbar buttons — ghost on the dark navy chrome; the indigo primary pops. */
.topbar .btn{background:transparent;border-color:rgba(255,255,255,0.14);color:var(--topbar-fg)}
.topbar .btn:hover{background:rgba(176,224,226,0.14);border-color:var(--topbar-hl);color:var(--topbar-hl)}
.topbar .theme-toggle{background:transparent;border-color:rgba(255,255,255,0.14);color:var(--topbar-fg)}
.topbar .theme-toggle:hover{background:rgba(176,224,226,0.14);border-color:var(--topbar-hl);color:var(--topbar-hl)}
.topbar .btn.primary{background:var(--topbar-hl);border-color:var(--topbar-hl);color:#1a2340}
.topbar .btn.primary:hover{background:#c4ebed;border-color:#c4ebed;color:#1a2340}
.topbar .tb-sep{background:rgba(255,255,255,0.12)}
.topbar .search{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.14)}
.topbar .search input{color:#fff}
.topbar .search input::placeholder{color:rgba(232,235,245,0.5)}
.topbar .btn.primary{background:var(--acc);border-color:var(--acc);color:var(--bg0)}
.topbar .btn.primary:hover{background:var(--acc2);border-color:var(--acc2);color:var(--bg0)}
.tb-group{display:flex;align-items:center;gap:6px;flex-shrink:0}
.tb-sep{width:1px;height:24px;background:var(--border);flex-shrink:0;margin:0 2px}
.logo{width:30px;height:30px;background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo svg{width:30px;height:30px;display:block}
.brand-home{cursor:pointer;border-radius:8px;padding:2px 6px;margin:-2px -2px -2px -6px;transition:background 0.15s,opacity 0.15s}
.brand-home:hover{background:rgba(176,224,226,0.12)}
.brand-home:active{opacity:0.8}
.brand-home:focus-visible{outline:2px solid var(--topbar-hl);outline-offset:2px}
.logo-text{font-size:14px;font-weight:700;color:var(--acc);white-space:nowrap}
/* Button system — consistent 3-tier hierarchy across the app:
   .btn (secondary, neutral surface), .btn.primary (solid accent),
   .theme-toggle (icon), and .toggle (segmented). Hovers stay neutral;
   the accent is reserved for primary and selected states. */
.btn{padding:6px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--t1);font-family:inherit;font-size:11px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;min-height:32px;transition:background 0.15s,border-color 0.15s,color 0.15s,box-shadow 0.15s}
.btn:hover{background:var(--bg3);border-color:var(--t3);color:var(--t0)}
.btn:active{transform:translateY(0.5px)}
.btn.primary{background:var(--acc);color:var(--bg0);border-color:var(--acc);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,0.14)}
.btn.primary:hover{background:var(--acc2);border-color:var(--acc2);color:var(--bg0)}
.btn.primary:active{transform:translateY(0.5px)}
.btn:disabled{opacity:0.45;cursor:not-allowed;box-shadow:none;transform:none}
.btn:disabled:hover{background:var(--bg2);border-color:var(--border);color:var(--t1)}
.btn.primary:disabled:hover{background:var(--acc);border-color:var(--acc)}
.btn:focus-visible,.theme-toggle:focus-visible,.tab:focus-visible,.toggle span:focus-visible,.zoom-ctl button:focus-visible,.grpmenu-btn:focus-visible,.sheet-chip:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.theme-toggle{width:32px;height:32px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--t2);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.15s,border-color 0.15s,color 0.15s;flex-shrink:0}
.theme-toggle:hover{background:var(--bg3);border-color:var(--t3);color:var(--t0)}
.theme-toggle:active{transform:translateY(0.5px)}
.search{flex:1 1 auto;min-width:110px;display:flex;align-items:center;gap:8px;background:var(--bg0);border:1px solid var(--border);border-radius:6px;padding:0 10px;transition:background 0.25s,border-color 0.25s}
.search input{min-width:0}
.search input{flex:1;background:transparent;border:0;outline:0;color:var(--t0);font-family:inherit;font-size:11px;padding:7px 0}
.search input::placeholder{color:var(--t3)}
.search-nav{display:flex;align-items:center;gap:2px;flex-shrink:0;padding-left:4px;border-left:1px solid var(--border)}
.sn-count{font-size:10px;color:var(--t2);min-width:26px;text-align:center;font-variant-numeric:tabular-nums}
.sn-count.none{color:var(--red)}
.sn-btn{width:20px;height:20px;background:transparent;border:0;border-radius:4px;color:var(--t2);cursor:pointer;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;transition:background 0.12s,color 0.12s}
.sn-btn:hover{background:var(--bg2);color:var(--acc)}
.sn-btn:disabled{opacity:0.35;cursor:not-allowed}
.chips{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--t2);white-space:nowrap;flex-shrink:0}
.chip b{color:var(--t0);font-weight:600}
.dot{color:var(--border)}
.body{flex:1;display:flex;min-height:0}
.rail{width:210px;background:var(--bg1);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;transition:width 0.2s ease,background 0.25s}
.rail.collapsed{width:0;min-width:0;border-right:0;overflow:hidden}
.panel.collapsed{width:0;min-width:0;border-left:0;overflow:hidden}
/* Collapsed left rail becomes a slim icon strip (not width:0) so controls stay
   discoverable while the canvas keeps the reclaimed width. Click any glyph to
   re-open the full rail. */
.rail-icons{width:48px;background:var(--bg1);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;flex-shrink:0;transition:background 0.25s}
.rail-icons button{position:relative;width:34px;height:34px;background:transparent;border:1px solid transparent;border-radius:8px;color:var(--t2);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;transition:background 0.15s,color 0.15s,border-color 0.15s}
.rail-icons button:hover{background:var(--bg2);color:var(--acc);border-color:var(--border)}
.rail-icons button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.rail-icons .ri-sep{width:22px;height:1px;background:var(--border);margin:4px 0;flex-shrink:0}
.rail-icons .ri-issues{color:var(--red)}
.rail-icons .ri-issues .ri-dot{position:absolute;transform:translate(9px,-9px);background:var(--red);color:#fff;font-size:8px;font-weight:700;border-radius:8px;padding:0 3px;line-height:1.4}
/* Persistent Issues indicator in the topbar — visible even when the rail is
   collapsed, so validation problems are never hidden. */
.tb-issues{background:rgba(232,106,106,0.12)!important;border-color:var(--red)!important;color:var(--red)!important;font-weight:600}
.tb-issues:hover{background:rgba(232,106,106,0.2)!important;border-color:var(--red)!important;color:var(--red)!important}
.edge-toggle{position:absolute;top:14px;width:22px;height:44px;background:var(--bg1);border:1px solid var(--border);color:var(--t2);cursor:pointer;z-index:16;display:flex;align-items:center;justify-content:center;font-size:15px;padding:0}
.edge-toggle:hover{color:var(--acc);border-color:var(--acc)}
.edge-toggle.left{left:0;border-left:0;border-radius:0 8px 8px 0}
.edge-toggle.right{right:0;border-right:0;border-radius:8px 0 0 8px}
.rail-sec{padding:12px;border-bottom:1px solid var(--border)}
.rail-title{font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--t3);margin-bottom:8px}
.ns-row{display:flex;align-items:center;gap:8px;padding:6px;border-radius:6px;cursor:pointer;font-size:11px;color:var(--t1);user-select:none;border:1px solid transparent;margin-bottom:3px}
.ns-row:hover{background:var(--bg2);border-color:var(--border)}
.ns-row.off{opacity:0.45}
.ns-check{width:14px;height:14px;accent-color:var(--acc);cursor:pointer;flex-shrink:0;margin:0}
.ns-info{display:flex;flex-direction:column;min-width:0}
.ns-name{color:var(--t0);font-size:11px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ns-sub{color:var(--t3);font-size:9px;line-height:1.3}
.sw{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.ns-count{margin-left:auto;color:var(--t3);font-size:10px}
.toggle{display:flex;gap:2px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:2px}
.toggle span{flex:1;text-align:center;padding:5px 6px;border-radius:4px;font-size:11px;font-weight:500;color:var(--t2);cursor:pointer;white-space:nowrap;transition:background 0.15s,color 0.15s}
.toggle span:hover{color:var(--t0)}
.toggle span.on{background:#2e1a47;color:#fff}
input[type=range]{accent-color:#2e1a47;height:4px;cursor:pointer}
.legend-row{display:flex;align-items:center;gap:8px;color:var(--t2);font-size:11px;margin-bottom:6px}
.hex-glyph{width:16px;height:14px;background:var(--purple);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);flex-shrink:0}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stat-card{background:var(--node-bg,var(--bg2));border:1px solid var(--border);border-radius:6px;padding:8px 6px;text-align:center;transition:border-color 0.15s}
.flabel{display:block;font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--t3);margin-bottom:5px}
.finput{width:100%;padding:8px 10px;background:var(--bg0);border:1px solid var(--border);border-radius:6px;color:var(--t0);font-family:inherit;font-size:12px;outline:none}
.finput:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg)}
select.finput{cursor:pointer}
.stat-card.link{cursor:pointer}
.stat-card.link:hover{border-color:var(--acc)}
.stat-card.link .stat-num{text-decoration:underline;text-decoration-color:var(--border);text-underline-offset:2px}
.stat-card.link:hover .stat-num{text-decoration-color:var(--acc)}
.stat-card.alert{border-color:var(--red)}
.stat-num{font-size:18px;font-weight:700;line-height:1.1}
.stat-label{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:0.4px;margin-top:2px}
/* Overview rendered as a metrics list (icon chip + label + count) — SaaS style. */
.ov-list{display:flex;flex-direction:column;gap:2px}
.ov-row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;border:1px solid transparent;transition:background 0.15s,border-color 0.15s}
.ov-row.link{cursor:pointer}
.ov-row.link:hover{background:var(--bg2);border-color:var(--border)}
.ov-ico{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.ov-label{flex:1;font-size:12px;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov-count{font-size:15px;font-weight:700;color:var(--t0);font-variant-numeric:tabular-nums;letter-spacing:-0.01em}
.ov-row.alert{background:rgba(239,68,68,0.06)}
/* Softer, lifted surfaces to match the mockup. */
.rail{box-shadow:2px 0 12px rgba(16,24,40,0.03)}
.panel{box-shadow:-2px 0 12px rgba(16,24,40,0.03)}
.btn{border-radius:8px}
.box,.list-item,.stat-card,.finput,.sys-pill{border-radius:9px}
.crumb{border-radius:10px;box-shadow:var(--shadow-sm)}
.zoom-ctl button,.theme-toggle{border-radius:8px}
/* Bottom status bar — dark chrome, key counts + scan status. */
.statusbar{height:34px;flex-shrink:0;background:var(--topbar-bg);border-top:1px solid var(--topbar-border);color:var(--topbar-fg);display:flex;align-items:center;gap:14px;padding:0 16px;font-size:11px;z-index:20}
.statusbar .sb-item{display:flex;align-items:center;gap:6px;color:rgba(232,235,245,0.72);font-variant-numeric:tabular-nums;white-space:nowrap}
.statusbar .sb-item b{color:#fff;font-weight:600}
.statusbar .sb-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
.statusbar .sb-sep{width:1px;height:16px;background:rgba(255,255,255,0.12);flex-shrink:0}
.statusbar .sb-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.canvas-wrap{flex:1;position:relative;min-width:0;background:var(--bg0);background-image:radial-gradient(var(--canvas-dot) 1px,transparent 1px);background-size:20px 20px;transition:background-color 0.25s}
.canvas-wrap svg{width:100%;height:100%;display:block}
.col-modal-bg{position:fixed;inset:0;background:var(--modal-overlay);display:flex;align-items:center;justify-content:center;z-index:50;animation:colModalFadeIn 0.18s ease}
@keyframes colModalFadeIn{from{opacity:0}to{opacity:1}}
.col-modal{width:min(520px,92vw);max-height:80vh;background:var(--bg1);border:1px solid var(--orange);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.5);animation:colModalSlideIn 0.22s ease}
@keyframes colModalSlideIn{from{opacity:0;transform:translateY(16px) scale(0.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.col-modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600;color:var(--orange)}
.col-modal-head button{background:transparent;border:0;color:var(--t2);font-size:20px;cursor:pointer;line-height:1;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;transition:background 0.15s,color 0.15s}
.col-modal-head button:hover{background:var(--bg3);color:var(--t0)}
.col-modal-body{padding:18px;overflow-y:auto;font-size:11px}
.zoom-ctl{position:absolute;left:12px;bottom:12px;display:flex;gap:6px}
.zoom-ctl button{width:30px;height:30px;background:var(--bg1);border:1px solid var(--border);border-radius:6px;color:var(--t2);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:background 0.15s,border-color 0.15s,color 0.15s}
.zoom-ctl button:hover{background:var(--bg3);border-color:var(--t3);color:var(--t0)}
.zoom-ctl button:active{transform:translateY(0.5px)}
.panel{width:290px;background:var(--bg1);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:width 0.2s ease,background 0.25s}
.tabs{display:flex;border-bottom:1px solid var(--border);overflow-x:auto}
.tab{padding:9px 10px;font-size:9px;letter-spacing:0.5px;color:var(--t2);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:color 0.15s,border-color 0.15s}
.tab:hover{color:var(--t0)}
.tab.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}
.tab .badge{margin-left:4px;background:var(--red);color:#fff;border-radius:8px;padding:1px 5px;font-size:9px}
.panel-body{flex:1;overflow-y:auto;padding:12px;font-size:11px}
.sec-label{font-size:9px;text-transform:uppercase;letter-spacing:0.5px;color:var(--t3);margin:14px 0 6px}
.box{background:var(--bg0);border:1px solid var(--border);border-radius:6px;padding:8px;transition:background 0.25s,border-color 0.25s}
.kv{display:flex;justify-content:space-between;gap:8px;padding:3px 0;line-height:1.5}
.kv .k{color:var(--t2)}.kv .v{color:var(--t1);text-align:right;word-break:break-all}
.field-row{display:flex;justify-content:space-between;padding:3px 0}
.field-row .fn{color:var(--t1)}.field-row .ft{color:var(--blue);font-size:10px}
.col-item{background:var(--bg0);border-left:2px solid var(--border);padding:7px 8px;margin-bottom:6px;transition:background 0.25s,border-color 0.2s,box-shadow 0.2s;border-radius:4px}
.col-item.tx{border-left-color:var(--orange)}
.col-item.col-active{background:rgba(255,159,67,0.08);border-left-color:var(--orange);border-left-width:3px;box-shadow:0 0 12px rgba(255,159,67,0.15)}
.col-out{color:var(--t0)}.col-out.tx{color:var(--orange)}
.col-src{color:var(--t2);font-size:10px;margin-top:2px;line-height:1.5}
.col-tx-detail{margin-top:8px;padding:8px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;font-size:11px;animation:colTxExpand 0.2s ease}
@keyframes colTxExpand{from{opacity:0;max-height:0}to{opacity:1;max-height:300px}}
@keyframes colFlowDash{to{stroke-dashoffset:-20}}
.list-item{background:var(--bg0);border:1px solid var(--border);border-radius:6px;padding:8px;margin-bottom:6px;cursor:pointer;transition:background 0.25s,border-color 0.2s}
.list-item:hover{border-color:var(--acc)}
.issue{background:var(--bg0);border-left:2px solid var(--orange);padding:7px 8px;margin-bottom:6px}
.issue.err{border-left-color:var(--red)}
.issue .it{font-size:11px;color:var(--t0)}
.issue .id{font-size:10px;color:var(--t2);margin-top:2px}
.sev{display:inline-block;font-size:9px;padding:1px 6px;border-radius:4px;margin-right:6px}
.sev.high{background:rgba(255,95,95,0.15);color:var(--red)}
.sev.med{background:rgba(255,159,67,0.15);color:var(--orange)}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:40px}
.empty h2{font-size:16px;color:var(--t0);font-weight:600}
.empty p{font-size:12px;color:var(--t2);max-width:420px;line-height:1.6}
.empty .row{display:flex;gap:10px}
.muted{color:var(--t3);font-size:10px}
.node-label{fill:var(--t0);font-size:11px;font-family:inherit}
.node-sub{fill:var(--t3);font-size:9px;font-family:inherit}
.field-txt{fill:var(--t1);font-size:9px;font-family:inherit}
.field-type{fill:var(--blue);font-size:9px;font-family:inherit}

<body>
<div id="root"></div>

<script>
/* LINEAGE_ENGINE_START — pure logic, no DOM/React/D3. Testable in Node. */
(
  function(){
  var NS_COLORS=['#4d9fff','#22c55e','#ff9f43','#a78bfa','#22d3ee','#ec4899','#f0f0f2','#00ff9d','#ff5f5f'];
  var JOB_COLOR='#a78bfa';

  // §3 Graph data model — derive the storage/compute System (platform) a dataset
  // lives on from its namespace. OpenLineage namespaces are typically scheme URIs
  // (snowflake://, s3://, postgres://host:port). Enables cross-platform lineage.
  var SYSTEM_MAP={snowflake:'Snowflake',bigquery:'BigQuery',postgres:'Postgres',postgresql:'Postgres',mysql:'MySQL',mariadb:'MySQL',redshift:'Redshift',s3:'S3',s3a:'S3',gs:'GCS',gcs:'GCS',abfss:'ADLS',abfs:'ADLS',wasbs:'ADLS',kafka:'Kafka',file:'File',hdfs:'HDFS',mssql:'SQLServer',sqlserver:'SQLServer',oracle:'Oracle',trino:'Trino',presto:'Presto',hive:'Hive',databricks:'Databricks',athena:'Athena',dbfs:'DBFS',clickhouse:'ClickHouse',cassandra:'Cassandra',mongodb:'MongoDB',elasticsearch:'Elasticsearch'};
  var SYSTEM_ICONS={Snowflake:'❄',BigQuery:'▤',Postgres:'🐘',MySQL:'🐬',Redshift:'▧',S3:'🪣',GCS:'🪣',ADLS:'🪣',Kafka:'✉',File:'📄',HDFS:'🗄',SQLServer:'🗄',Oracle:'🗄',Trino:'◆',Presto:'◆',Hive:'🐝',Databricks:'▦',Athena:'◈',DBFS:'🗄',ClickHouse:'◉',Cassandra:'◎',MongoDB:'🌿',Elasticsearch:'🔎'};
  function systemOf(ns){
    ns=ns||'';
    var m=ns.match(/^([a-z0-9+]+):\/\//i);
    var scheme=m?m[1].toLowerCase():'';
    if(scheme)return SYSTEM_MAP[scheme]||(scheme.charAt(0).toUpperCase()+scheme.slice(1));
    var seg=ns.split(/[:.\/@]/)[0];// no scheme -> first segment as platform grouping
    return seg?(SYSTEM_MAP[seg.toLowerCase()]||(seg.charAt(0).toUpperCase()+seg.slice(1))):'unknown';
  }
  function systemIcon(sys){return SYSTEM_ICONS[sys]||'▢';}

  // §8 Column lineage — normalize OpenLineage transformation type/subtype/masking
  // into a semantic class the UI can style distinctly. OL uses type DIRECT|INDIRECT
  // with subtypes (IDENTITY, TRANSFORMATION, AGGREGATION, FILTER, GROUP_BY, JOIN,
  // SORT, WINDOW, CONDITIONAL) plus a masking boolean.
  function classifyTx(type,subtype,masking,hasDesc){
    if(masking)return 'MASKING';
    var t=(type||'').toUpperCase(),s=(subtype||'').toUpperCase();
    if(s==='AGGREGATION'||s==='GROUP_BY')return 'AGGREGATION';
    if(!t&&!hasDesc)return 'IDENTITY';
    if(t==='IDENTITY'||s==='IDENTITY')return 'IDENTITY';
    if(t==='INDIRECT'&&!hasDesc&&(s==='FILTER'||s==='JOIN'||s==='SORT'||s==='WINDOW'||s==='CONDITIONAL'))return 'FILTER';
    return 'TRANSFORM';
  }

  function dsKey(ns,name){return (ns||'')+'::'+(name||'');}

  function collectEvent(o,events,issues,file,idx){
    var where=(idx!=null?' (line '+(idx+1)+')':'');
    if(o&&typeof o==='object'&&o.job&&typeof o.job==='object'&&(o.eventType||o.inputs||o.outputs)){
      events.push(o);
    }else{
      issues.push({file:file,severity:'high',reason:'Not an OpenLineage event'+where});
    }
  }

  function parseFileContent(text,file){
    var events=[],issues=[];
    var trimmed=(text||'').trim();
    if(!trimmed){issues.push({file:file,severity:'med',reason:'Empty file'});return{events:events,issues:issues};}
    var parsed,parseErr=null;
    try{parsed=JSON.parse(trimmed);}catch(e){parseErr=e;}
    if(!parseErr){
      if(Array.isArray(parsed))parsed.forEach(function(o){collectEvent(o,events,issues,file);});
      else collectEvent(parsed,events,issues,file);
      return{events:events,issues:issues};
    }
    // Fallback: NDJSON (one JSON object per line)
    var lines=trimmed.split(/\r?\n/).filter(function(l){return l.trim();});
    var anyOk=false;
    lines.forEach(function(l,i){
      try{collectEvent(JSON.parse(l),events,issues,file,i);anyOk=true;}
      catch(e2){issues.push({file:file,severity:'high',reason:'Line '+(i+1)+': invalid JSON'});}
    });
    if(!anyOk&&lines.length<=1){
      issues=[{file:file,severity:'high',reason:'Invalid JSON: '+(parseErr.message||parseErr)}];
    }
    return{events:events,issues:issues};
  }

  function eventTimeMs(ev){var t=ev&&ev.eventTime?Date.parse(ev.eventTime):NaN;return isNaN(t)?0:t;}

  function buildModel(events,parseIssues){
    var datasets={},jobs={},edgeSet={},edges=[],colEdges=[],issues=(parseIssues||[]).slice();
    var nsOrder=[];
    function ns(n){if(n&&nsOrder.indexOf(n)<0)nsOrder.push(n);}
    function ensureDs(d){
      var k=dsKey(d.namespace,d.name);
      if(!datasets[k]){datasets[k]={key:k,namespace:d.namespace||'',name:d.name||'',system:systemOf(d.namespace),schemaFields:[],columnLineage:null,producedByJobs:{},consumedByJobs:{},owners:[],tags:[],facets:{}};ns(d.namespace);}
      return datasets[k];
    }
    function addEdge(from,to){var id=from+'>'+to;if(!edgeSet[id]){edgeSet[id]=1;edges.push({from:from,to:to});}}

    var ordered=events.slice().sort(function(a,b){return eventTimeMs(a)-eventTimeMs(b);});
    ordered.forEach(function(ev){
      var jns=ev.job.namespace||'',jname=ev.job.name||'';
      var jk=dsKey(jns,jname);ns(jns);
      var job=jobs[jk]||(jobs[jk]={key:jk,namespace:jns,name:jname,inputs:{},outputs:{},runs:[],latestEventType:null,latestTime:-1,sourceCode:null,facets:ev.job.facets||{}});
      var t=eventTimeMs(ev);
      if(ev.run&&ev.run.runId)job.runs.push({runId:ev.run.runId,eventType:ev.eventType||'',eventTime:ev.eventTime||''});
      if(t>=job.latestTime){job.latestTime=t;job.latestEventType=ev.eventType||job.latestEventType;}
      if(ev.job.facets){job.facets=ev.job.facets;if(ev.job.facets.sourceCode)job.sourceCode=ev.job.facets.sourceCode;}

      (ev.inputs||[]).forEach(function(d){
        if(!d)return;var ds=ensureDs(d);var k=ds.key;
        job.inputs[k]=1;ds.consumedByJobs[jk]=1;
        addEdge('d:'+k,'j:'+jk);
        applyFacets(ds,d.facets);
      });
      (ev.outputs||[]).forEach(function(d){
        if(!d)return;var ds=ensureDs(d);var k=ds.key;
        job.outputs[k]=1;ds.producedByJobs[jk]=1;
        addEdge('j:'+jk,'d:'+k);
        applyFacets(ds,d.facets);
        extractColumnEdges(ds,d.facets,colEdges);
      });
    });

    function applyFacets(ds,facets){
      if(!facets)return;
      if(facets.schema&&Array.isArray(facets.schema.fields)&&facets.schema.fields.length){
        ds.schemaFields=facets.schema.fields.map(function(f){return{name:f.name,type:f.type||''};});
      }
      if(facets.columnLineage&&facets.columnLineage.fields)ds.columnLineage=facets.columnLineage.fields;
      // §3 ownership + tags facets -> governance metadata on the node
      if(facets.ownership&&Array.isArray(facets.ownership.owners))
        ds.owners=facets.ownership.owners.map(function(o){return{name:o.name||'',type:o.type||''};}).filter(function(o){return o.name;});
      var tg=[];
      if(Array.isArray(facets.tags))facets.tags.forEach(function(t){tg.push(typeof t==='string'?t:(t.key?t.key+(t.value?'='+t.value:''):(t.name||'')));});
      else if(facets.tags&&Array.isArray(facets.tags.tags))facets.tags.tags.forEach(function(t){tg.push(t.key?t.key+(t.value?'='+t.value:''):(t.name||t.value||''));});
      if(tg.length)ds.tags=tg.filter(Boolean);
      Object.keys(facets).forEach(function(fk){if(fk[0]!=='_')ds.facets[fk]=facets[fk];});
    }
    function extractColumnEdges(ds,facets,out){
      if(!facets||!facets.columnLineage||!facets.columnLineage.fields)return;
      var f=facets.columnLineage.fields;
      Object.keys(f).forEach(function(outField){
        var spec=f[outField];var ins=(spec&&spec.inputFields)||[];
        ins.forEach(function(inp){
          if(!inp)return;
          var tx='',type='',subtype='',masking=false;
          if(Array.isArray(inp.transformations)&&inp.transformations.length){
            var tr=inp.transformations[0];
            tx=tr.description||'';type=tr.type||'';subtype=tr.subtype||'';masking=!!tr.masking;
          }
          if(!tx&&inp.transformationDescription)tx=inp.transformationDescription;
          if(!type&&inp.transformationType)type=inp.transformationType;
          if(!tx&&spec.transformationDescription)tx=spec.transformationDescription;
          var txClass=classifyTx(type,subtype,masking,!!tx);
          out.push({toDs:ds.key,toField:outField,fromDs:dsKey(inp.namespace,inp.name),fromField:inp.field||'',transformation:tx,transformationType:type,transformationSubtype:subtype,masking:masking,txClass:txClass});
        });
      });
    }

    // colors
    var nsColor={};nsOrder.forEach(function(n,i){nsColor[n]=NS_COLORS[i%NS_COLORS.length];});

    var dsList=Object.keys(datasets).map(function(k){return datasets[k];});
    var jobList=Object.keys(jobs).map(function(k){return jobs[k];});
    var systems=[];dsList.forEach(function(d){if(systems.indexOf(d.system)<0)systems.push(d.system);});
    var stats={datasets:dsList.length,jobs:jobList.length,namespaces:nsOrder.length,systems:systems.length,edges:edges.length,columnEdges:colEdges.length,events:events.length};

    var model={datasets:datasets,jobs:jobs,edges:edges,colEdges:colEdges,namespaces:nsOrder,systems:systems,nsColor:nsColor,stats:stats,issues:issues};
    validate(model);
    return model;
  }

  function detectCycles(model){
    var adj={};model.edges.forEach(function(e){(adj[e.from]||(adj[e.from]=[])).push(e.to);});
    var state={},cycleNodes={};
    function dfs(n){
      state[n]=1;
      (adj[n]||[]).forEach(function(m){
        if(state[m]===1){cycleNodes[m]=1;cycleNodes[n]=1;}
        else if(!state[m])dfs(m);
      });
      state[n]=2;
    }
    Object.keys(adj).forEach(function(n){if(!state[n])dfs(n);});
    return Object.keys(cycleNodes);
  }

  // §5 Impact analysis (direction 'down') and root-cause (direction 'up').
  // BFS over the structural dataset<->job graph from a start node id ('d:'/'j:'),
  // bounded by maxDepth. Returns per-node depth, the traversed edge set, and a
  // reachable count. Pure + testable.
  function traverse(model,startId,direction,maxDepth){
    maxDepth=(maxDepth==null)?Infinity:maxDepth;
    var fwd={},rev={};
    model.edges.forEach(function(e){(fwd[e.from]||(fwd[e.from]=[])).push(e.to);(rev[e.to]||(rev[e.to]=[])).push(e.from);});
    var adj=direction==='up'?rev:fwd;
    var depth={},edges={};depth[startId]=0;
    var q=[startId];
    while(q.length){
      var n=q.shift();var d=depth[n];if(d>=maxDepth)continue;
      (adj[n]||[]).forEach(function(m){
        edges[direction==='up'?(m+'>'+n):(n+'>'+m)]=1;
        if(depth[m]==null){depth[m]=d+1;q.push(m);}
      });
    }
    return{depth:depth,edges:edges,count:Object.keys(depth).length-1,direction:direction,start:startId};
  }

  function validate(model){
    var issues=model.issues;
    Object.keys(model.datasets).forEach(function(k){
      var d=model.datasets[k];
      var prod=Object.keys(d.producedByJobs).length,cons=Object.keys(d.consumedByJobs).length;
      if(prod===0&&cons===0)issues.push({severity:'med',reason:'Orphan dataset (no producer or consumer): '+d.key});
      else if(prod>0&&d.schemaFields.length===0)issues.push({severity:'med',reason:'Output dataset missing schema: '+d.key});
    });
    var cyc=detectCycles(model);
    if(cyc.length)issues.push({severity:'high',reason:'Cycle detected involving '+cyc.length+' node(s): '+cyc.map(function(x){return x.slice(2);}).join(', ')});
    model.cycleNodes=cyc;
    return issues;
  }

  function computeLayout(model,opts){
    opts=opts||{};
    var dir=opts.direction||'LR';
    var expanded=opts.expanded||{};
    var hidden=opts.hiddenNs||{};
    var manual=opts.manual||{};
    var colFilter=opts.colFilter||{};// dsKey -> filter substring
    var fullCols=opts.fullCols||{};// nodeId -> 1 (show all columns)

  // Parse a git repo reference into provider/host/path. github.com -> GitHub API,

  var DATA_TYPES={};['varchar','varchar2','nvarchar','char','nchar','text','string','clob','int','integer','smallint','tinyint','bigint','decimal','numeric','number','float','double','real','money','bit','boolean','bool','date','datetime','timestamp','time','binary','blob','uuid','json','jsonb','array','struct'].forEach(function(t){DATA_TYPES[t]=1;});

  // §7 Transformation categories -> OpenLineage transformation {type,subtype}.

    {cat:'NVL',re:/\b(nvl|nvl2|ifnull|isnull)\b/i,type:'DIRECT',subtype:'TRANSFORMATION',sql:true},

  /** Classify a transformation string into an OL transformation descriptor. */

      return{category:'Direct Mapping',type:'DIRECT',subtype:'IDENTITY',sqlLike:false,description:'',direct:true};
    }
    for(var i=0;i<TX_CATS.length;i++){

    }

  }

  // Explicit ColumnTransformationType -> OpenLineage {type,subtype}. When the
  // process template supplies a type, it wins; otherwise fall back to inferring
  // from the transformation logic text.
  var COL_TX_MAP={identity:{type:'DIRECT',subtype:'IDENTITY'},direct:{type:'DIRECT',subtype:'IDENTITY'},copy:{type:'DIRECT',subtype:'IDENTITY'},passthrough:{type:'DIRECT',subtype:'IDENTITY'},
    transformation:{type:'DIRECT',subtype:'TRANSFORMATION'},expression:{type:'DIRECT',subtype:'TRANSFORMATION'},derived:{type:'DIRECT',subtype:'TRANSFORMATION'},derivedcolumn:{type:'DIRECT',subtype:'TRANSFORMATION'},
    aggregation:{type:'DIRECT',subtype:'AGGREGATION'},aggregate:{type:'DIRECT',subtype:'AGGREGATION'},
    conditional:{type:'DIRECT',subtype:'CONDITIONAL'},'case':{type:'DIRECT',subtype:'CONDITIONAL'},casestatement:{type:'DIRECT',subtype:'CONDITIONAL'},decode:{type:'DIRECT',subtype:'CONDITIONAL'},
    join:{type:'INDIRECT',subtype:'JOIN'},lookup:{type:'INDIRECT',subtype:'JOIN'},
    filter:{type:'INDIRECT',subtype:'FILTER'},'where':{type:'INDIRECT',subtype:'FILTER'},distinct:{type:'INDIRECT',subtype:'FILTER'},

  /** Classify a column transformation given an explicit type and/or logic text. */

  // Match a worksheet's headers against one template, returning the column map
  // plus every structural discrepancy.
  function buildMap(headers,tmpl){
    var map={},duplicates=[],blanks=[],unexpected=[],caseMismatches=[],seen={};
    headers.forEach(function(raw,i){
      var s=(raw==null?'':String(raw)).trim();
      if(!s){blanks.push({index:i});return;}
      var f=tmpl.alias[normKey(s)];
      if(!f){unexpected.push({index:i,header:s});return;}
      if(seen[f.key]!=null){duplicates.push({key:f.key,label:f.label,index:i});return;}
      seen[f.key]=i;map[f.key]=i;
      if(s!==f.label)caseMismatches.push({index:i,header:s,expected:f.label});
    });
    var missing=tmpl.fields.filter(function(f){return f.req&&map[f.key]==null;}).map(function(f){return f.label;});
    return{map:map,duplicates:duplicates,blanks:blanks,unexpected:unexpected,caseMismatches:caseMismatches,missing:missing,mapped:Object.keys(map).length};
  }

  // §3 Template validation. Auto-detects which registered template the sheet
  // uses (fewest missing required columns, ties broken by most columns mapped).
  // Pass opts.template to force one. `meta` carries structural signals.
  function validateTemplate(headers,opts){
    opts=opts||{};headers=headers||[];

    else{
      var best=null;

        var t=buildMap(headers,TEMPLATES[id]);

  }

  function isBlank(v){return v==null||String(v).trim()==='';}
  function whitespaceOnly(v){return v!=null&&String(v)!==''&&String(v).trim()==='';}

  // §4 Row-level validation, driven by the detected template. Emits a normalized
  // row (ns/name/field + OL transformation, template-agnostic) for every valid

  // Template registry. Each template supplies field defs, identifier columns for
  // name-shape checks, a per-row `check` (warnings), an `edge` (dup/cycle keys),
  // and a `normalize` producing the common row consumed by generateEvents.

  var TEMPLATES={

      identifiers:['sourceSchema','sourceTable','sourceColumn','targetSchema','targetTable','targetColumn'],

      check:function(rec,gaps,er){

          targetNs:tNs,targetName:rec.targetDataset,targetField:rec.targetField,targetObjectType:rec.targetObjectType||'TABLE',
          dataType:'',nullable:true,tx:colTx,tableTx:{type:rec.tableTransformationType||'',logic:rec.tableTransformationLogic||''},
          jobName:rec.processName,jobKey:jk,jobNamespace:opts.processNamespace||'etl.process',lineageType:isRun?'RUNTIME':'DESIGN',runId:isRun?(rec.runId||null):null};
      }}

  function detectCycles(edges){
    var adj={},cyc={},state={};
    edges.forEach(function(e){(adj[e.from]||(adj[e.from]=[])).push(e.to);});
    function dfs(n){state[n]=1;(adj[n]||[]).forEach(function(m){if(state[m]===1){cyc[m]=1;cyc[n]=1;}else if(!state[m])dfs(m);});state[n]=2;}

  // Build an OpenLineage namespace (scheme URI) + dataset name from ETL metadata.
  // scheme://schema keeps LineageEngine.systemOf() able to derive the platform.
  function schemeOf(sys){var t=normKey(sys);return t||'unknown';}
  function nsFor(system,schema){return schemeOf(system)+'://'+(schema?String(schema).toLowerCase():'default');}
  function nameFor(schema,table){return (schema?String(schema)+'.':'')+table;}
  // Process-template namespace: <technology-scheme>://<host[:port]> so

  }

  // §8 Generate OpenLineage COMPLETE events from normalized rows. One event per
  // job (a target table's mapping for template A; a ProcessName+run for template
  // B), each with its input datasets and one or more output datasets carrying
  // schema, columnLineage, documentation, datasetType, and an SQL job facet.
  // Design rows get deterministic runIds; RunTime rows use the supplied RunId.
  function generateEvents(rows,opts){
    opts=opts||{};

    var eventTime=opts.eventTime||new Date().toISOString();
    var jobs={},jobOrder=[],report=[],targetSet={};
    rows.forEach(function(r){

  // CSV formula-injection guard (CWE-1236): dataset/column names, transformation
  // text and raw cell values are untrusted. A field beginning with = + - @ (or a
  // tab/CR) is treated as a formula by Excel/Sheets, so prefix a single quote to
  // neutralize it. Plain (possibly negative) numbers are left intact.

</script>

<script>
/* LF_STORE_START — IndexedDB persistence for loaded models + saved views.
 * Browser-only (not part of the pure engine). Models are cached as raw
 * OpenLineage events (JSON-serializable) and rebuilt via LineageEngine on
 * load; views persist the UI state needed to restore an exploration. */
(function(){
  var DB='lineageflow',VER=1,MODELS='models',VIEWS='views';
  function open(){
    return new Promise(function(res,rej){
      if(!('indexedDB'in window))return rej(new Error('IndexedDB unavailable'));
      var rq=indexedDB.open(DB,VER);
      rq.onupgradeneeded=function(e){
        var db=e.target.result;
        if(!db.objectStoreNames.contains(MODELS))db.createObjectStore(MODELS,{keyPath:'id'});
        if(!db.objectStoreNames.contains(VIEWS))db.createObjectStore(VIEWS,{keyPath:'id'});
      };
      rq.onsuccess=function(){res(rq.result);};
      rq.onerror=function(){rej(rq.error);};
    });
  }
  function tx(store,mode,fn){
    return open().then(function(db){
      return new Promise(function(res,rej){
        var t=db.transaction(store,mode),s=t.objectStore(store),out;
        var r=fn(s);if(r)r.onsuccess=function(){out=r.result;};
        t.oncomplete=function(){db.close();res(out);};
        t.onerror=function(){db.close();rej(t.error);};
      });
    });
  }
  function all(store){
    return open().then(function(db){
      return new Promise(function(res,rej){
        var t=db.transaction(store,'readonly'),r=t.objectStore(store).getAll();
        r.onsuccess=function(){db.close();res(r.result||[]);};
        r.onerror=function(){db.close();rej(r.error);};
      });
    });
  }
  function hash(s){var h=0x811c9dc5;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=(h*0x01000193)>>>0;}return ('00000000'+h.toString(16)).slice(-8);}
  var G=(typeof window!=='undefined')?window:globalThis;
  G.LFStore={
    available:('indexedDB'in window),
    hashEvents:function(events){try{return hash(JSON.stringify(events).slice(0,200000));}catch(e){return 'x'+Date.now();}},
    putModel:function(rec){rec.savedAt=Date.now();return tx(MODELS,'readwrite',function(s){return s.put(rec);}).then(function(){return rec;});},
    getModel:function(id){return tx(MODELS,'readonly',function(s){return s.get(id);});},
    listModels:function(){return all(MODELS).then(function(a){return a.sort(function(x,y){return y.savedAt-x.savedAt;});});},
    deleteModel:function(id){return tx(MODELS,'readwrite',function(s){s.delete(id);});},
    pruneModels:function(keep){return this.listModels().then(function(a){var del=a.slice(keep||12);return Promise.all(del.map(function(m){return tx(MODELS,'readwrite',function(s){s.delete(m.id);});}));});},
    putView:function(rec){rec.savedAt=Date.now();if(!rec.id)rec.id='v_'+Date.now().toString(36);return tx(VIEWS,'readwrite',function(s){return s.put(rec);}).then(function(){return rec;});},
    getView:function(id){return tx(VIEWS,'readonly',function(s){return s.get(id);});},
    listViews:function(){return all(VIEWS).then(function(a){return a.sort(function(x,y){return y.savedAt-x.savedAt;});});},
    deleteView:function(id){return tx(VIEWS,'readwrite',function(s){s.delete(id);});}
  };
})();
/* LF_STORE_END */
</script>

  var colChain=useMemo(function(){
    if(!model)return null;
    var seeds=Object.keys(selCols).map(function(k){return selCols[k];});
    if(selectedCol)seeds.push(selectedCol);
    if(!seeds.length)return null;
    var fields={},edgeIndices={},edgeKeys={},datasets={};
    function fKey(ds,f){return ds+'::'+f;}
    function eKey(ce){return ce.fromDs+'::'+ce.fromField+'>'+ce.toDs+'::'+ce.toField;}
    function walkUp(dsKey,field){
      model.colEdges.forEach(function(ce,idx){
        if(ce.toDs===dsKey&&ce.toField===field){
          edgeIndices[idx]=true;edgeKeys[eKey(ce)]=true;
          var sk=fKey(ce.fromDs,ce.fromField);datasets[ce.fromDs]=true;
          if(!fields[sk]){fields[sk]=true;walkUp(ce.fromDs,ce.fromField);}
        }
      });
    }
    function walkDown(dsKey,field){
      model.colEdges.forEach(function(ce,idx){
        if(ce.fromDs===dsKey&&ce.fromField===field){
          edgeIndices[idx]=true;edgeKeys[eKey(ce)]=true;
          var tk=fKey(ce.toDs,ce.toField);datasets[ce.toDs]=true;
          if(!fields[tk]){fields[tk]=true;walkDown(ce.toDs,ce.toField);}
        }
      });
    }
    seeds.forEach(function(s){
      fields[fKey(s.dsKey,s.field)]=true;datasets[s.dsKey]=true;
      walkUp(s.dsKey,s.field);walkDown(s.dsKey,s.field);
    });
    return{fields:fields,edgeIndices:edgeIndices,edgeKeys:edgeKeys,datasets:datasets};
  },[selCols,selectedCol,model]);

  var expanded=useMemo(function(){
    var e={};
    // A column filter or an explicit "show all" always expands its node, even in table view.
    Object.keys(colFilter).forEach(function(k){if(colFilter[k])e['d:'+k]=1;});
    Object.keys(fullCols).forEach(function(id){if(fullCols[id])e[id]=1;});
    if(viewMode==='table')return e;
    if(selected&&selected.kind==='dataset'){
      e['d:'+selected.key]=1;
      if(model)model.colEdges.forEach(function(ce){if(ce.toDs===selected.key)e['d:'+ce.fromDs]=1;if(ce.fromDs===selected.key)e['d:'+ce.toDs]=1;});
    }
    // When a column is selected, expand all datasets in the full lineage chain
    if(colChain){
      Object.keys(colChain.datasets).forEach(function(dk){e['d:'+dk]=1;});
    }
    return e;
  },[selected,model,viewMode,colChain,colFilter,fullCols]);

  // §Extension: undirected adjacency over the structural graph, for progressive
  // hop-wise expansion. Neighbor lists are sorted so batching is deterministic.
  var adjacency=useMemo(function(){
    if(!model)return {};
    var adj={};
    model.edges.forEach(function(e){(adj[e.from]||(adj[e.from]=[])).push(e.to);(adj[e.to]||(adj[e.to]=[])).push(e.from);});
    Object.keys(adj).forEach(function(k){var seen={},u=[];adj[k].forEach(function(n){if(!seen[n]){seen[n]=1;u.push(n);}});u.sort();adj[k]=u;});
    return adj;
  },[model]);

  // §Extension: progressive expansion. A node with ≤ FOCUS_BATCH (10) neighbors
  // reveals them all at once; a hub with more reveals 10 at a time so the DOM
  // stays bounded even for very large, densely connected models. focusExpanded
  // maps a node id -> how many of its neighbors are currently revealed.
  var FOCUS_BATCH=10;
  function seedBatch(id){var t=(adjacency[id]||[]).length;return t<=FOCUS_BATCH?t:FOCUS_BATCH;}
  function revealedFor(id){return focusExpanded[id]!=null?focusExpanded[id]:(id===focusSeed?seedBatch(id):0);}

  // Visible node-id allowlist: the seed plus, for each expanded node, its first
  // `revealed` neighbors. Bounded regardless of total edge count.
  var focusOnly=useMemo(function(){
    if(!focusMode||!focusSeed||!model)return null;
    var vis={};vis[focusSeed]=1;
    var counts=Object.assign({},focusExpanded);
    if(counts[focusSeed]==null)counts[focusSeed]=seedBatch(focusSeed);
    Object.keys(counts).forEach(function(id){
      vis[id]=1;(adjacency[id]||[]).slice(0,counts[id]).forEach(function(n){vis[n]=1;});
    });
    return vis;
  },[focusMode,focusSeed,focusExpanded,adjacency,model]);
  // Not-yet-revealed neighbors of a node (drives the "+N" frontier badge). N is
  // capped in the label at the batch size to signal a partial reveal.
  function frontierCount(id){return Math.max(0,(adjacency[id]||[]).length-revealedFor(id));}
  // Reveal the next batch of a node's neighbors (all if ≤ batch on first click).
  function expandFocus(id){
    setFocusExpanded(function(p){
      var total=(adjacency[id]||[]).length;
      var cur=p[id]!=null?p[id]:(id===focusSeed?seedBatch(id):0);
      if(cur>=total)return p;
      var next=cur===0?(total<=FOCUS_BATCH?total:FOCUS_BATCH):Math.min(total,cur+FOCUS_BATCH);
      var c=Object.assign({},p);c[id]=next;return c;
    });
  }

  // Base layout (internal barycenter placement) — always available; also supplies
  // node sizes + edges that ELK positions.
  var layoutOpts=function(pos){return{direction:dir,expanded:expanded,hiddenNs:hiddenNs,colGap:gap,rowGap:Math.max(12,Math.round(gap*0.29)),manual:manualRef.current,colFilter:colFilter,fullCols:fullCols,groupBy:(focusOnly||groupBy==='none')?null:groupBy,expandedGroups:expGroups,only:focusOnly,positions:pos||null};};

  // Signature of the node set (ids + sizes + direction) — ELK re-runs only when
  // this changes (drilling, expanding columns, focus hops, spacing, direction).
  var elkSig=useMemo(function(){
    if(!layoutBase)return null;
    return dir+'|'+gap+'|'+layoutBase.nodes.map(function(n){return n.id+':'+n.w+'x'+n.h;}).join(',');
  },[layoutBase,dir,gap]);

  // Run ELK layered layout off the base graph whenever the node set changes.
  useEffect(function(){
    if(!elkOn||!layoutBase||typeof ELK==='undefined'||!layoutBase.nodes.length){return;}
    var sig=elkSig,cancelled=false;
    setElkBusy(true);
    var elk=new ELK();
    var spNode=Math.max(18,Math.round(gap*0.35)),spLayer=Math.max(50,Math.round(gap*1.1));
    elk.layout({id:'root',
      layoutOptions:{'elk.algorithm':'layered','elk.direction':dir==='TB'?'DOWN':'RIGHT',
        'elk.spacing.nodeNode':String(spNode),'elk.layered.spacing.nodeNodeBetweenLayers':String(spLayer),
        'elk.layered.crossingMinimization.strategy':'LAYER_SWEEP','elk.layered.nodePlacement.strategy':'BRANDES_KOEPF',
        'elk.layered.nodePlacement.bk.fixedAlignment':'BALANCED','elk.edgeRouting':'POLYLINE','elk.layered.mergeEdges':'true'},
      children:layoutBase.nodes.map(function(n){return{id:n.id,width:n.w,height:n.h};}),
      edges:layoutBase.edges.map(function(e,i){return{id:'e'+i,sources:[e.from],targets:[e.to]};})
    }).then(function(res){
      if(cancelled)return;
      var pos={};(res.children||[]).forEach(function(c){pos[c.id]={x:c.x,y:c.y};});
      setElkPos({sig:sig,pos:pos});setElkBusy(false);
    }).catch(function(){if(!cancelled){setElkBusy(false);}});
    return function(){cancelled=true;};
  },[elkSig,elkOn]);

  // Final layout: apply ELK positions when they match the current node set;
  // otherwise fall back to the internal placement (also used while ELK computes).
  var layout=useMemo(function(){
    if(!model||!layoutBase)return layoutBase;
    if(elkOn&&elkPos&&elkPos.sig===elkSig)return E.computeLayout(model,layoutOpts(elkPos.pos));
    return layoutBase;
  },[layoutBase,elkPos,elkOn,elkSig,model,manualV]);

  function toggleGroup(g){setExpGroups(function(p){var c=Object.assign({},p);if(c[g])delete c[g];else c[g]=1;return c;});}

      var dc=0,jc=0;

      Object.keys(model.jobs).forEach(function(k){var j=model.jobs[k];var key=groupBy==='system'?E.systemOf(j.namespace):j.namespace;if(key===g)jc++;});

  function openColDetail(dsKey,field){

  // §Extension scalability threshold: above this many nodes, don't render the
  // whole graph — auto-enter progressive focus mode seeded on the highest-degree
  // node. The full model stays cached in IndexedDB; only the explored subgraph
  // (revealed 10 neighbors at a time) is ever in the DOM.
  var LARGE_GRAPH=40;
  function loadEvents(events,parseIssues,name,fromCache){
    try{
      var m=E.buildModel(events,parseIssues||[]);
      setEvents(events||[]);
      setModel(m);setSelected(null);setErr(null);setImpact(null);setCtxMenu(null);setColFilter({});setFullCols({});setSelCols({});setSelectedCol(null);setExpGroups({});
      manualRef.current={};
      if(name)setSrcName(name);

      // somewhere meaningful and the DOM never holds the full graph at once.
      var big=(m.stats.datasets+m.stats.jobs)>LARGE_GRAPH;
      if(big){
        var deg={};m.edges.forEach(function(e){deg[e.from]=(deg[e.from]||0)+1;deg[e.to]=(deg[e.to]||0)+1;});
        var seed=null,best=-1;Object.keys(deg).forEach(function(id){if(deg[id]>best){best=deg[id];seed=id;}});

      }else{

      }

  }

  // ---- §Extension: persistence (IndexedDB) ----

        .then(function(){return window.LFStore.pruneModels(12);}).then(refreshLibrary).catch(function(){});
    }catch(e){}
  }
  function loadCachedModel(rec){setLoading(true);setLibOpen(false);setTimeout(function(){loadEvents(rec.events,[],rec.name,true);setLoading(false);},20);}

  function loadDemo(){setLoading(true);setTimeout(function(){loadEvents(E.DEMO_EVENTS.slice(),[],'demo');setLoading(false);},50);}

  function b64utf8(b64){var bin=atob((b64||'').replace(/\s/g,''));try{var by=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)by[i]=bin.charCodeAt(i);return new TextDecoder('utf-8').decode(by);}catch(e){return bin;}}
  function authHeaders(info){
    var hdr={};
    if(info.provider==='github')hdr['Accept']='application/vnd.github.v3+json';
    if(repoAuth==='pat'&&repoToken){
      if(info.provider==='github')hdr['Authorization']='Bearer '+repoToken;
      else hdr['PRIVATE-TOKEN']=repoToken;

    return hdr;
  }
  async function ghDefaultBranch(info,hdr){var r=await fetch('https://api.github.com/repos/'+info.owner+'/'+info.repo,{headers:hdr});if(!r.ok)throw new Error('GitHub repo '+r.status+(r.status===404?' (not found / private — add a token?)':r.status===403?' (rate limited — add a token for 5000 req/hr)':''));return (await r.json()).default_branch||'main';}
  async function glDefaultBranch(info,hdr){var r=await fetch('https://'+info.host+'/api/v4/projects/'+encodeURIComponent(info.path),{headers:hdr});if(!r.ok)throw new Error('GitLab project '+r.status+(r.status===404?' (not found / private?)':''));return (await r.json()).default_branch||'main';}

  async function loadRepo(){
    var info=E.parseRepoUrl(repoUrl);
    if(!info){setErr('Invalid repo URL. Use https://github.com/owner/repo or https://gitlab.example.com/group/repo');return;}
    setRepoModal(false);setLoading(true);setErr(null);setProgress('Connecting to '+info.host+'…');
    try{
      var hdr=authHeaders(info);
      var branch=repoBranch.trim()||info.branch;
      var jsonPaths=[];
      if(info.provider==='github'){
        if(!branch)branch=await ghDefaultBranch(info,hdr);
        setProgress('Fetching file tree ('+branch+')…');
        var tr=await fetch('https://api.github.com/repos/'+info.owner+'/'+info.repo+'/git/trees/'+encodeURIComponent(branch)+'?recursive=1',{headers:hdr});
        if(!tr.ok)throw new Error('GitHub tree '+tr.status+(tr.status===403?' (rate limited — add a token)':''));
        var td=await tr.json();
        (td.tree||[]).forEach(function(n){if(n.type==='blob'&&/\.json$/i.test(n.path))jsonPaths.push(n.path);});
      }else{
        if(!branch)branch=await glDefaultBranch(info,hdr);
        setProgress('Fetching file tree ('+branch+')…');
        var page=1,guard=0;
        while(guard++<60){
          var tg=await fetch('https://'+info.host+'/api/v4/projects/'+encodeURIComponent(info.path)+'/repository/tree?recursive=true&per_page=100&page='+page+'&ref='+encodeURIComponent(branch),{headers:hdr});
          if(!tg.ok)throw new Error('GitLab tree '+tg.status);
          var arr=await tg.json();
          arr.forEach(function(n){if(n.type==='blob'&&/\.json$/i.test(n.path))jsonPaths.push(n.path);});
          var next=tg.headers.get('x-next-page');if(!next)break;page=parseInt(next,10);
        }
      }
      if(!jsonPaths.length){setLoading(false);setProgress('');setErr('No .json files found in '+info.path+' (branch '+branch+')');return;}
      var allEvents=[],allIssues=[];
      for(var i=0;i<jsonPaths.length;i++){
        setProgress('Reading '+(i+1)+'/'+jsonPaths.length+': '+jsonPaths[i]);
        try{
          var text;
          if(info.provider==='github'){
            var cr=await fetch('https://api.github.com/repos/'+info.owner+'/'+info.repo+'/contents/'+jsonPaths[i].split('/').map(encodeURIComponent).join('/')+'?ref='+encodeURIComponent(branch),{headers:hdr});
            if(!cr.ok)throw new Error('HTTP '+cr.status);
            var cd=await cr.json();text=cd.content?b64utf8(cd.content):'';
          }else{
            var gr=await fetch('https://'+info.host+'/api/v4/projects/'+encodeURIComponent(info.path)+'/repository/files/'+encodeURIComponent(jsonPaths[i])+'/raw?ref='+encodeURIComponent(branch),{headers:hdr});
            if(!gr.ok)throw new Error('HTTP '+gr.status);
            text=await gr.text();
          }
          var pr=E.parseFileContent(text,jsonPaths[i]);
          allEvents=allEvents.concat(pr.events);allIssues=allIssues.concat(pr.issues);
        }catch(e){allIssues.push({file:jsonPaths[i],severity:'high',reason:'Fetch error: '+(e.message||e)});}
      }
      loadEvents(allEvents,allIssues,info.path);
    }catch(e){setErr('Failed to load repo: '+(e.message||e));}
    setLoading(false);setProgress('');
  }

  // ---- ETL Mapping Specification (Excel → OpenLineage design-time) ----
  var ME=window.MappingEngine;

  // Parse the workbook with SheetJS into per-sheet header/rows/meta (plain data
  // so MappingEngine stays DOM-free). Reads structural signals (merges, hidden
  // columns) for template warnings.
  async function onMapFile(e){
    var file=(e.target.files||[])[0];if(!file)return;
    if(typeof XLSX==='undefined'){setErr('SheetJS (xlsx) failed to load — check your network/CDN.');return;}
    setMapBusy(true);setMapProg('Reading '+file.name+'…');setMapVal(null);setMapGen(null);
    mlog('Upload: '+file.name+' ('+Math.round(file.size/1024)+' KB)');
    try{
      var buf=await file.arrayBuffer();
      var wb=XLSX.read(buf,{type:'array',cellStyles:true});
      var sheets=[];
      for(var si=0;si<wb.SheetNames.length;si++){
        var nm=wb.SheetNames[si];setMapProg('Parsing worksheet '+(si+1)+'/'+wb.SheetNames.length+': '+nm);await tick();
        var ws=wb.Sheets[nm];
        var aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:'',blankrows:false});
        var headers=aoa.length?aoa[0]:[];
        var rows=aoa.slice(1);

        mlog('Worksheet "'+nm+'": '+headers.length+' columns, '+rows.length+' data rows');

  // §3+§4 Validate every selected worksheet. Chunked per sheet with await tick()
  // so a 50-sheet / 50k-row workbook never freezes the UI.
  async function runValidate(){
    setMapBusy(true);setMapGen(null);mlog('Validation started');
    var perSheet=[],allGaps=[],allValid=[],templateFails=[],tot={totalRows:0,validRows:0,invalidRows:0,errors:0,warnings:0};
    var sel=mapSheets.filter(function(s){return mapSel[s.name];});
    for(var i=0;i<sel.length;i++){
      var sh=sel[i];setMapProg('Validating '+(i+1)+'/'+sel.length+': '+sh.name);await tick();
      var tv=ME.validateTemplate(sh.headers,{meta:sh.meta});
      if(!tv.ok){
        templateFails.push({sheet:sh.name,missing:tv.missing,duplicates:tv.duplicates.map(function(d){return d.label;})});
        mlog('Template FAIL on "'+sh.name+'": missing ['+tv.missing.join(', ')+']','error');
        perSheet.push({sheet:sh.name,template:tv,rowResult:null});
        continue;
      }
      // structural + header warnings surfaced as informational gaps
      tv.structural.forEach(function(s){allGaps.push({row:0,severity:'WARNING',field:sh.name,current:s.count,expected:'0',rule:s.kind,message:sh.name+': '+s.count+' '+(s.kind==='mergedCells'?'merged cell range(s)':'hidden column(s)')+' detected.',recommendation:'Unmerge/unhide before parsing to avoid misaligned data.'});});
      tv.caseMismatches.forEach(function(c){allGaps.push({row:1,severity:'WARNING',field:c.header,current:c.header,expected:c.expected,rule:'header-case',message:'Header "'+c.header+'" differs from canonical "'+c.expected+'".',recommendation:'Rename header to the canonical label.'});});
      tv.unexpected.forEach(function(u){allGaps.push({row:1,severity:'WARNING',field:u.header,current:u.header,expected:'known column','rule':'unexpected-column',message:'Unexpected column "'+u.header+'" ignored.',recommendation:'Remove or map this column.'});});
      var rr=ME.validateRows(sh.rows,tv.map,{template:tv.template});
      // tag gaps with worksheet for multi-sheet reports
      rr.gaps.forEach(function(g){g.sheet=sh.name;});
      allGaps=allGaps.concat(rr.gaps);allValid=allValid.concat(rr.valid);
      ['totalRows','validRows','invalidRows','errors','warnings'].forEach(function(k){tot[k]+=rr.summary[k];});
      perSheet.push({sheet:sh.name,template:tv,rowResult:rr});
      mlog('Validated "'+sh.name+'" ['+tv.templateLabel+']: '+rr.summary.validRows+' valid, '+rr.summary.invalidRows+' invalid, '+rr.summary.errors+' errors, '+rr.summary.warnings+' warnings');
    }
    // recompute aggregate error/warning counts (structural/header gaps included)
    tot.errors=allGaps.filter(function(g){return g.severity==='ERROR';}).length;
    tot.warnings=allGaps.filter(function(g){return g.severity==='WARNING';}).length;
    setMapVal({perSheet:perSheet,gaps:allGaps,valid:allValid,summary:tot,templateFails:templateFails});
    setMapStep('generate');setMapBusy(false);setMapProg('');
    mlog('Validation complete: '+tot.validRows+' valid rows across '+sel.length+' worksheet(s)');
  }

  // §8 Generate design-time OpenLineage events from valid rows, validate them,
  // then hand off to the existing LineageEngine visualization via loadEvents.
  async function runGenerate(){
    if(!mapVal||!mapVal.valid.length){setErr('No valid mapping rows to generate lineage from.');return;}
    setMapBusy(true);setMapProg('Generating OpenLineage design-time events…');await tick();
    mlog('Event generation started ('+mapVal.valid.length+' rows)');
    try{
      var gen=ME.generateEvents(mapVal.valid,{eventTime:new Date().toISOString()});
      var eventIssues=ME.validateEvents(gen.events);
      setMapGen({events:gen.events,columnLineageReport:gen.columnLineageReport,eventIssues:eventIssues});
      mlog('Generated '+gen.events.length+' events, '+gen.columnLineageReport.length+' column links; '+eventIssues.length+' event issue(s)');
      // Feed unresolved validation gaps + event issues into the model Issues panel.
      var issues=eventIssues.slice();
      if(mapVal.summary.invalidRows)issues.push({severity:'high',reason:mapVal.summary.invalidRows+' mapping row(s) excluded due to validation errors — see gap report.'});
      loadEvents(gen.events,issues,mapFile||'mapping.xlsx');
      setMapOpen(false);
    }catch(ex){setErr('Event generation failed: '+(ex.message||ex));mlog('ERROR generating events: '+(ex.message||ex),'error');}
    setMapBusy(false);setMapProg('');
  }

  // Store-only (no-compression) ZIP writer — dependency-free bundle of all outputs.
  function crc32(buf){var c,t=crc32.t;if(!t){t=crc32.t=[];for(var n=0;n<256;n++){c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}}c=0xFFFFFFFF;for(var i=0;i<buf.length;i++)c=t[(c^buf[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
  function makeZip(files){
    var enc=new TextEncoder(),chunks=[],central=[],offset=0;
    function u16(n){return [n&0xFF,(n>>8)&0xFF];}function u32(n){return [n&0xFF,(n>>8)&0xFF,(n>>16)&0xFF,(n>>>24)&0xFF];}
    files.forEach(function(f){
      var data=enc.encode(f.content),crc=crc32(data),name=enc.encode(f.name);
      var local=[].concat(u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0));
      chunks.push(new Uint8Array(local),name,data);
      var cen=[].concat(u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset));
      central.push(new Uint8Array(cen),name);
      offset+=local.length+name.length+data.length;
    });
    var cenStart=offset,cenSize=0;central.forEach(function(c){cenSize+=c.length;});
    var end=new Uint8Array([].concat(u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(cenSize),u32(cenStart),u16(0)));
    return new Blob(chunks.concat(central,[end]),{type:'application/zip'});
  }
  function exportZip(){
    var files=[];
    if(mapGen)files.push({name:'openlineage-events.json',content:JSON.stringify(mapGen.events,null,2)});
    if(mapGen)files.push({name:'column-lineage.csv',content:ME.columnLineageToCSV(mapGen.columnLineageReport)});

    if(!files.length)return;
    var b=makeZip(files),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='lineageflow-outputs.zip';a.click();URL.revokeObjectURL(u);
    mlog('Exported ZIP bundle ('+files.length+' files)');
  }

  // D3 render (rich mode: column-level detail, transformation styling, drag)
  useEffect(function(){
    if(!layout||!svgRef.current)return;
    var svg=d3.select(svgRef.current);
    svg.selectAll('*').remove();
    var g=svg.append('g');gRef.current=g;
    var nodeMap=layout.nodeMap;
    var selId=selected?(selected.kind+':').replace('dataset:','d:').replace('job:','j:')+selected.key:null;
    var connected={};
    if(selId){layout.edges.forEach(function(e){if(e.from===selId||e.to===selId){connected[e.from]=1;connected[e.to]=1;}});}
    // §5 impact/root-cause highlight sets (null when inactive)
    var impSet=impactResult?impactResult.depth:null;
    var impEdges=impactResult?impactResult.edges:null;
    var impMode=impact?impact.mode:null;
    var cvar=function(n,f){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||f;};
    var greenC=cvar('--green','#22c55e'),blueC=cvar('--blue','#4d9fff'),cyanC=cvar('--cyan','#22d3ee');

    function box(id){return nodeMap[id];}
    function anchorOut(n){return dir==='LR'?[n.x+n.w,n.y+n.h/2]:[n.x+n.w/2,n.y+n.h];}
    function anchorIn(n){return dir==='LR'?[n.x,n.y+n.h/2]:[n.x+n.w/2,n.y];}
    function path(a,b){
      if(dir==='LR'){var mx=(a[0]+b[0])/2;return 'M'+a[0]+','+a[1]+'C'+mx+','+a[1]+' '+mx+','+b[1]+' '+b[0]+','+b[1];}
      var my=(a[1]+b[1])/2;return 'M'+a[0]+','+a[1]+'C'+a[0]+','+my+' '+b[0]+','+my+' '+b[0]+','+b[1];
    }

    // ----- edges (redrawable so drag updates them live) -----
    var HEADER=layout.dims.HEADER,ROWH=layout.dims.ROWH;
    var eg=g.append('g'),cg=g.append('g');
    function fieldAnchor(n,fname,side){
      var cy;
      if(n.expanded){var idx=n.fields.findIndex(function(f){return f.name===fname;});cy=idx>=0?n.y+HEADER+idx*ROWH+ROWH/2:n.y+n.h/2;}
      else cy=n.y+n.h/2;
      return side==='out'?[n.x+n.w,cy]:[n.x,cy];
    }
    function drawEdges(){
      eg.selectAll('*').remove();cg.selectAll('*').remove();
      var cv=function(n,f){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||f;};
      var edgeClr=cv('--edge-color','#3a3a44'),accColor=cv('--acc','#9575cd');
      // Use full transitive chain for active edges
      var activeColEdges=colChain?colChain.edgeKeys:{};
      var hasActiveCol=Object.keys(activeColEdges).length>0;
      layout.edges.forEach(function(e){
        var a=anchorOut(box(e.from)),b=anchorIn(box(e.to));
        var inImpact=impEdges&&impEdges[e.from+'>'+e.to];
        var dim=impSet&&!inImpact;
        var hot=selId&&(e.from===selId||e.to===selId);
        var stroke=edgeClr,w=1,dash=null,op=1,marker='url(#arr)';
        if(inImpact){stroke=impMode==='up'?blueC:greenC;w=2;marker=impMode==='up'?'url(#arrUp)':'url(#arrDown)';}
        else if(hot){stroke=accColor;w=1.8;marker='url(#arrHot)';}
        // §4 cross-system boundary crossing (when not otherwise emphasized)
        if(e.crossSystem&&!inImpact&&!hot){stroke=cyanC;dash='7,4';op=0.9;}
        if(e.bypass){dash='5,4';op=Math.min(op,0.7);}// lineage through a hidden job
        if(dim)op=0.1;
        var p=eg.append('path').attr('d',path(a,b)).attr('fill','none').attr('stroke',stroke).attr('stroke-width',w).attr('marker-end',marker).attr('opacity',op);
        if(dash)p.attr('stroke-dasharray',dash);
      });
      // §8 per-transformation-class visual language for column edges
      var TXST={
        IDENTITY:{color:cv('--t3','#5c5c66'),width:1,dash:null,op:0.55},
        TRANSFORM:{color:'#ff9f43',width:1.6,dash:null,op:0.9},
        AGGREGATION:{color:'#ff9f43',width:2.8,dash:null,op:0.95},
        FILTER:{color:'#ff9f43',width:1,dash:'2,3',op:0.7},
        MASKING:{color:cv('--red','#ff5f5f'),width:1.5,dash:'4,3',op:0.9}
      };
      if(dir==='LR'){
        layout.colEdges.forEach(function(ce,idx){
          var a=box(ce.from),b=box(ce.to);if(!a||!b)return;
          var pa=fieldAnchor(a,ce.fromField,'out'),pb=fieldAnchor(b,ce.toField,'in');
          var isActive=activeColEdges[ce.from.slice(2)+'::'+ce.fromField+'>'+ce.to.slice(2)+'::'+ce.toField];
          if(hasActiveCol&&!isActive){
            // Dim non-active column edges
            cg.append('path').attr('d',path(pa,pb)).attr('fill','none').attr('stroke','#ff9f43').attr('stroke-width',0.6).attr('stroke-dasharray','3,3').attr('opacity',0.2);
          }else if(isActive){
            // Glowing background for active edge
            cg.append('path').attr('d',path(pa,pb)).attr('fill','none').attr('stroke','#ff9f43').attr('stroke-width',6).attr('opacity',0.1).attr('filter','blur(2px)');
            // Active animated edge with flowing dashes
            var p=cg.append('path').attr('d',path(pa,pb)).attr('fill','none').attr('stroke','#ff9f43').attr('stroke-width',2.2).attr('stroke-dasharray','6,4').attr('opacity',1)
              .attr('marker-end','url(#arrCol)');
            p.style('animation','colFlowDash 0.6s linear infinite');
            // Source dot
            cg.append('circle').attr('cx',pa[0]).attr('cy',pa[1]).attr('r',4).attr('fill','#ff9f43').attr('opacity',0.9);
            // Target dot
            cg.append('circle').attr('cx',pb[0]).attr('cy',pb[1]).attr('r',4).attr('fill','#ff9f43').attr('opacity',0.9);
          }else{
            // Default column edges styled by transformation class
            var st=TXST[ce.txClass]||TXST.IDENTITY;
            var pth=cg.append('path').attr('d',path(pa,pb)).attr('fill','none').attr('stroke',st.color).attr('stroke-width',st.width).attr('opacity',st.op).attr('marker-end','url(#arrCol)');

      }
    }
    drawEdges();

    // ----- nodes (draggable; column rows open transformation popout) -----

    layout.nodes.forEach(function(n){
